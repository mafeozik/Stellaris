# Sexopolis Creation #

lv_sworld_creation.1.name: "§HСескополис§!: [Root.GetName] преоброзована"
lv_sworld_creation.1.desc: "Слои за слоями приятных мест, раскинувшихся во всех направлениях.\n\nМесто, куда могут отправиться все те, кто ищет общения и приключений, чтобы насладиться его бесконечной щедростью.\n\nПоистине, кульминация наших желаний."
lv_sworld_creation.1.a: "Восхитительно."

# Pleasure Habitat Creation #

lv_shabitat_creation.10.name: "§HСреда обитания удовольствий§! Построена"
lv_shabitat_creation.10.desc.a: "Мы сделали это, после многих лет упорного труда и самоотверженности мы создали нашу первую среду обитания для отдыха. Помимо того, что эта новая орбитальная звездная база является технологическим чудом, она станет отличным домом для наших граждан, где они смогут расслабиться и испачкаться!"
lv_shabitat_creation.10.desc.b: "Была успешно построена еще одна Среда обитания удовольствий. Наши граждане будут очень рады услышать эту новость..."

