lv_mono_gender_conversion_mm.desc: "§LВыберите, в какой пол вы хотите превратить население этой планеты. Они приведут вас к подменю, где вы получите еще несколько вариантов.\n\nОбратите внимание, что вы получите возмещение, если решите, что больше не хотите этого делать!§!"

lv_mono_gender_conversion_mm.1: "Женское подменю"
lv_mono_gender_conversion_mm.2: "Мужское подменю"
lv_mono_gender_conversion_mm.3: "Фута подменю"

lv_mono_gender_conversion_fsm.desc: "§LЭто женское подменю!\n\nНа данный момент вы можете либо преобразовать всю планету, либо только ксеносов (например, не включая ваш основной вид). Это вызовет серьезные проблемы со стабильностью в течение нескольких лет...\n\nПо мере развития мода могут быть добавлены дополнительные опции.§!"

lv_mono_gender_conversion_fsm.1: "Преобразовать всех"
lv_mono_gender_conversion_fsm.1.tooltip: "§LПревратить всех в самок!\n\n§RВНИМАНИЕ!§! это приведёт к удалению у поселений  черты §HВсе мужчины§! и §HФутанари§! включая любые характерные для мужчин черты.§!"
lv_mono_gender_conversion_fsm.2: "Преобразовать только ксеносов"
lv_mono_gender_conversion_fsm.2.tooltip: "§LПревратить всех ксеносов в самок!\n\n§RWARNING!§! это приведёт к удалению у поселений  черты §HВсе мужчины§! и §HФутанари§! включая любые характерные для мужчин черты.§!"

lv_mono_gender_conversion_msm.desc: "§LЭто мужское подменю!\n\nНа данный момент вы можете либо преобразовать всю планету, либо только ксеносов (например, не включая ваш основной вид). Это вызовет некоторые серьезные проблемы со стабильностью в течение нескольких лет ...\n\n По мере развития мода могут быть добавлены дополнительные опции..§!"

lv_mono_gender_conversion_msm.1: "Превратить всех"
lv_mono_gender_conversion_msm.1.tooltip: "§LПревратите всех в самцов!\n\n§RВНИМАНИЕ!§! Это приведет к удалению черт §HВсе женщины§! и §HФутанари§!  включая любые характерные для женщин черты.§!"
lv_mono_gender_conversion_msm.2: "Превратить только ксеносов"
lv_mono_gender_conversion_msm.2.tooltip: "§LПревратите всех ксеносов в самцов!\n\n§RВНИМАНИЕ!§! Это приведет к удалению черт §HВсе женщины§! и §HФутанари§!  включая любые характерные для женщин черты.§!"

lv_mono_gender_conversion_fusm.desc: "§LЭто фута под меню\n\nНа данный момент вы можете либо преобразовать всю планету, либо только ксеносов (например, не включая ваш основной вид). Это вызовет некоторые серьезные проблемы со стабильностью в течение нескольких лет ...\n\n По мере развития мода могут быть добавлены дополнительные опции.§!"

lv_mono_gender_conversion_fusm.1: "Превратить всех"
lv_mono_gender_conversion_fusm.1.tooltip: "§LПревратить всех в футанари!\n\n§RВНИМАНИЕ!§! Это приведёт к удалению у поселений черт §HВсе женщины§! and §HВсе мужчины§! .§!"
lv_mono_gender_conversion_fusm.2: "Превратить только ксеносов"
lv_mono_gender_conversion_fusm.2.tooltip: "§LПревратите всех ксеносов в футанари!\n\n§RВНИМАНИЕ!§! Это приведёт к удалению у поселений черт §HВсе женщины§! and §HВсе мужчины§!.§!"

lv_mono_gender_conversion_fsm_ca.desc: "§LВсе они были превращены в женщин...нравится им это или нет.§!"
lv_mono_gender_conversion_fsm_ca.1: "Хорошо!"

lv_mono_gender_conversion_fsm_cxo.desc: "§LВсе ксеносы были преобразованы в женщин...нравится им это или нет.§!"
lv_mono_gender_conversion_fsm_cxo.1: "Хорошо!"

lv_mono_gender_conversion_msm_ca.desc: "§LВсе они были превращены в мужчин...нравится им это или нет.§!"
lv_mono_gender_conversion_msm_ca.1: "Хорошо!"

lv_mono_gender_conversion_msm_cxo.desc: "§LВсе ксеносы были преобразованы в мужчин...нравится им это или нет.§!"
lv_mono_gender_conversion_msm_cxo.1: "Хорошо!"

lv_mono_gender_conversion_fusm_ca.desc: "§LВсе они были превращены в футанари... нравится им это или нет.§!"
