lv_lewd_asteroids_1_category: "Занимательный астероид"
lv_lewd_asteroids_1_category_desc: "§LДатчики зафиксировали необычные показания на близлежащем астероиде, [From.GetName].§!"

lv_lewd_asteroids_1.1.name: "Появление Безумного ученого с щупальцами"
lv_lewd_asteroids_1.1.desc: "§LПосле дальнейшего исследования, [Root.GetName] обнаружено небольшое и похожее на заброшенное сооружение, встроенное в [From.GetName]. Для расследования была направлена исследовательская группа. Сначала команда сообщает, что объект, похоже, хорошо сохранился но выглядит заброшенным, внезапно скрытые средства защиты объекта оживают и выводят команду из строя, прерывая связь.§!"

lv_lewd_asteroids_1.2.name: "Появление Безумного ученого с щупальцами"
lv_lewd_asteroids_1.2.desc: "§LВторая, лучше вооруженная команда отправляется на спасение первой. Это занимает у них некоторое время, но в конце концов первая команда ,была обнаружнена в недрах действующей лаборатории. Единственный житель объекта решил, что наши люди могли бы стать отличными подопытными для какого-то создания с щупальцами, которое охотно насилует захваченных членов экипажа.§!"
lv_lewd_asteroids_1.2.a: "Бедные люди."
lv_lewd_asteroids_1.2.b: "Мы многому научимся благдоря их жертве."
lv_lewd_asteroids_1.2.c: "Давайте узнаем какие преимущества это может нам дать."
lv_lewd_asteroids_1.2.d: "Сотворение жизни - священный долг!"
lv_lewd_asteroids_1.2.e: "Наши граждане НЕ ОБЪЕКТЫ ДЛЯ ЭКСПЕРИМЕНТОВ!"

lv_lewd_asteroids_2_category: "Занимательный астероид"
lv_lewd_asteroids_2_category_desc: "§LДатчики зафиксировали необычные показания на близлежащем астероиде [From.GetName].§!"

lv_lewd_asteroids_2.1.name: "Подпольная торговая станция"
lv_lewd_asteroids_2.1.desc: "§LНаша исследовательская группа обнаружила огромную несанкционированную станцию, замаскированную под астероид на орбите [From.GetStarName]. Вместо обычной торговли на черном рынке, этот центр специализируется на незаконных сексуальных услугах и товарах, таких как экзотическая кибернетика, неэтичные модификации тела и чрезвычайно мощные афродизиаки, которые не выдержали бы даже самых слабых общественных стандартов и законов. Нам нужно решить, что делать с объектом и теми, кто находится внутри.§!"
lv_lewd_asteroids_2.1.a: "Отличный источник налогов."
lv_lewd_asteroids_2.1.b: "Отлмчный источник минералов."
lv_lewd_asteroids_2.1.c: "Конфисковать все и снести это место."
lv_lewd_asteroids_2.1.c.tooltip: "§LКажется отличный ученый готов присоединиться к нам в обмен на убежище.§!"
lv_lewd_asteroids_2.1.d: "Изучите а потом уничтожьте это место."
lv_lewd_asteroids_2.1.d.tooltip: "§LЭти чертежи довольно занимательны. Кажется отличный ученый готов присоединиться к нам в обмен на убежище.§!"
lv_lewd_asteroids_2.1.e: "Предложите им безопасное убежище при условии, что они будут следовать нашим правилам."
lv_lewd_asteroids_2.1.f: "Это нарушает естественный порядок вещей. Уничтожьте его."

lv_slime_asteroid_category: "Слизь"
lv_slime_asteroid_category_desc: "§LЭкипаж корабля §B[Root.GetFleetName]§! сообщил, что заметил какое-то слизеподобное существо на соседнем астероиде §G[Root.GetLeaderName]§! рекомендуется собрать образцы для дальнейшего исследования.§!"
 
lv_slime_asteroid.1.name: "Похабная Слизь"
lv_slime_asteroid.1.desc: "§LСлизистая сущность была легко обнаружена и доставлена на борт §B[Root.GetFleetName]§!. §G[Root.GetLeaderName]§! не был уверен, был ли он вообще жив или нет, пока он не вырвался на свободу и не попытался спариться с ближайшим ученым.§!"
lv_slime_asteroid.1.a: "Мы можем использовать их способнсть к фотосинтезу в своих интересах."
lv_slime_asteroid.1.b: "Их биология и поведение поистине завораживают."
lv_slime_asteroid.1.c: "Возможно, наши инженеры смогут найти им применение."

lv_hidden_flesh_pit_category: "Интересные Тепловые Показания"
lv_hidden_flesh_pit_category_desc: "§LДатчики корабля §B[Root.GetFleetName]§! зафиксировали необычное тепловое пятно на соседнем астероиде.§!"
 
lv_hidden_flesh_pit.1.name: "Скрытое убежище тентаклей"
lv_hidden_flesh_pit.1.desc: "§LМы должны отпраить туда §B[Root.GetFleetName]§! для более тщательного изучения. Вскоре местоположение теплового пятна было найдено. Мы послали команду для изучения аномалии, но вскоре после этого потеряли связь. Когда связь была восстановлена, экспедиция потеряла нескольких своих женщин из-за неизвестных форм жизни, по сообщениям, было слышно только эхо влажного хлюпанья и похотливых стонов, когда они убегали. Мы считаем, что эти существа являются источником тепла, который мы обнаружили.§!"
lv_hidden_flesh_pit.1.a: "Мы должны спасти этих бедных женщин, чего бы это ни стоило!"
lv_hidden_flesh_pit.1.b: "Давайте изучим этих существ на благо нашей цивилизации."
lv_hidden_flesh_pit.1.c: "Как эти существа выживают в вакуумном пространстве? Мы должны узнать!"
lv_hidden_flesh_pit.1.d: "Эти похотливые создания должны быть очищены священным огнем!"
lv_hidden_flesh_pit.1.e: "Потеря нескольких трутней незначительна."
 
lv_hidden_flesh_pit.2.name: "Обнаружена Неизвестная Микробиосфера"
lv_hidden_flesh_pit.2.desc: "§LБолее пристальный взгляд на тепловую точку привел к невероятному открытию! В трещинах астероида процветает то, что кажется микробиосферой. Для более тщательного осмотра была отправлена команда, и во время изучения окружающей среды женщина-член экипажа решила снять свое защитное снаряжение, по-видимому, находясь в каком-то трансе. На нее сразу же набросились живущие там организмы, и после некоторой паники и небольшого неловкого изучения организмы, к счастью, оказались симбионтами, балуя очарованную девочку и очень тщательно ее ублажая.§!"
lv_hidden_flesh_pit.2.a: "Давайте сделаем этот астероид туристическим местом для отдыха."
lv_hidden_flesh_pit.2.b: "Построить специальную исследовательскую станцию для изучения биосферы!"
lv_hidden_flesh_pit.2.c: "С отклонениями этой биосферы нельзя мириться"
lv_hidden_flesh_pit.2.d: "Улей от этого только выиграет."

lv_sexy_planet_category: "Странная форма жизни"
lv_sexy_planet_category_desc: "§LЭкипаж обнаружил какую-то странную форму жизни на §Y[From.GetName]§!.§!"
 
lv_sexy_planet.1.name: "Течка"
lv_sexy_planet.1.desc: "§LВсе усилия по поиску этой формы жизни оказались безрезультатными. Даже отправка разведывательных кораблей для физического исследования §Y[From.GetName]§! не удалось получить никаких результатов..\n\nоднако, похоже, нам не нужно было так усердно искать, поскольку одна из наших женщин-пилотов обнаружила форму жизни на своем исследовательском корабле, когда возвращалась с поверхности планеты.§!"
lv_sexy_planet.1.a: "Тревожно, но завораживающе."

lv_sexy_planet.2.name: "Рой"
lv_sexy_planet.2.desc: "§LПосле приземления на поверхность §Y[From.GetName]§! наша исследовательская группа была немедленно атакована существом с ненасытным сексуальным влечением. Самцы исследовательской группы могли лишь наблюдать, как существо срывало одежду с самок и проникало во все их дырочки своими щупальцами, не отпуская их, пока полностью не наполнило их своим семенем.§!"
lv_sexy_planet.2.a: "Тревожно, но завораживающе."
lv_sexy_planet.2.b: "Эти мерзкие существа будут уничтожены."
lv_sexy_planet.2.c: "Женщинам явно понравился этот опыт."

lv_potential_colony_site_category: "Потенциальное Место Для Колонии"
lv_potential_colony_site_category_desc: "§L[Root.GetLeaderName] утверждает, что нашел место на §Y[From.GetName]§! оно было бы идеалным местом для новой колонии.§!"

lv_sexy_planet.3.name: "Изобилие тентаклеивых существ"
lv_sexy_planet.3.desc: "§LСначала планета §Y[From.GetName]§! казалась идеальной. Исследовательская группа находилась в процессе определения наилучшего места для будущего административного здания, когда одну из женщин команды внезапно затянуло в яму в земле. Она вскрикнула, когда похожие на усики отростки обвились вокруг нее и проникли в нее. §G[Root.GetLeaderName]§! сообщает нам, что планета является домом для множества других 'тентаклиевых форм жизни".'.§!"
lv_sexy_planet.3.a: "Не смотря на это, это все еще подходящее место для колонии, верно?"
lv_sexy_planet.3.b: "Соберите как можно больше данных об этих удивительных формах жизни."
lv_sexy_planet.3.c: "Искорените это! Мы не потерпим присутствия этих существ."

lv_sexy_planet_hard_category: "Здесь Что-То Скрывается"
lv_sexy_planet_hard_category_desc: "§LЭкипаж считает, что он, возможно, обнаружил признаки странной формы жизни на §Y[From.GetName]§!, но что бы это ни было, оно доказало, что его очень трудно отследить.§!"
 
lv_sexy_planet_hard.1.name: "Ксенотеррор"
lv_sexy_planet_hard.1.desc: "§LЭкипажу удалось найти форму жизни. Ну... возможно, было бы точнее сказать, что он нашел их. §G[Root.GetLeaderName]§! До сих пор не уверен, что это за существо, но он с некоторой уверенностью говорит, что оно было создано с помощью биоинженерии. Что бы это ни было, "Ксенотеррор", как называет его команда, похоже, испытывает сильное влечение к женщинам нашего вида.§!"
lv_sexy_planet_hard.1.a: "Поистине Ужасает"
lv_sexy_planet_hard.1.b: "Вот почему на эти миссии не посылают никого важного."
lv_sexy_planet_hard.1.c: "Сжечь! Сжечь! Сжечь!"
lv_sexy_planet_hard.1.d: "Узнаем, что мы можем изучить, а затем сбросим ядерную бомбу с орбиты прямо на объект."

lv_nuclear_sex_category: "Жизнь в Разрушенном Мире"
lv_nuclear_sex_category_desc: "§LЭкипаж обнаружил формы жизни на поверхности §Y[From.GetName]§! несмотря на то, что планета была разрушена ядерным конфликтом. Попытки найти эти формы жизни с орбиты оказались в лучшем случае разочаровывающими, поскольку формы жизни защищены от наших датчиков различными руинами на поверхности планеты. §G[Root.GetLeaderName]§! предложил отправить команду на поверхность для дальнейшего исследования.§!"

lv_nuclear_sex.1.name: "Радиоактвиный секс"
lv_nuclear_sex.1.desc: "§LИсследовательская группа пробыла на поверхности совсем чуть чтуь но за это время одна из местных форм жизни вступила в контакт с отставшим членом команды. Прибыв на место происшествия, другие участники группы обнаружили женщину в полностью разорванном защитном костюме. Записи инцидента указывают на то, что половой акт, который ксенос совершал с женщиной, вероятно, был бы для нее весьма приятным, если бы она не получила смертельную дозу радиации.§!"
lv_nuclear_sex.1.a: "Давайте будем хранить молчание об этом инциденте."
lv_nuclear_sex.1.b: "Обнародуйте записи этого акта, чтобы мы могли узнать как можно больше."
lv_nuclear_sex.1.c: "Нашего ученого постигла трагическая судьба."

lv_slug_planet_category: "Планета Слизняков"
lv_slug_planet_category_desc: "§LПосле нескольких дней сканирования [from.GetName], [Root.GetFleetName] обнаружил какую-то форму жизни, которая обладает совершенно иной структурой ДНК, чем остальные присутствующие формы жизни. . [Root.GetLeaderName] предлагает отправить команду на поверхность для дальнейшего расследования.§!"
 
lv_slug_planet.1.name: "Планета Слизняков"
lv_slug_planet.1.desc: "§LОбнаруженные формы жизни, безусловно, не принадлежали к экоситсеме планеты [from.GetName] . Из того, что смогли узнать наши ученые, так называемые "слизни" были занесены на планету столетия назад. Зачем? Мы можем только гадать. Что мы знаем наверняка, так это то, что им, похоже, нравятся наши люди в сексуальном смысле. Во время исследования слизней несколько наших женщин-ученых были повалены слизнями на землю, которые затем вступили в половую связь с самками. К счастью, слизни созданы для нежного, хотя и липкого секса.§!"
lv_slug_planet.1.a: "Интересно."

lv_bad_category: "Странная форма жизни"
lv_bad_category_desc: "§LЭкипаж обнаружил какую-то странную форму жизни на §Y[From.GetName]§!.§!"

lv_bad.1.name: "Похищение пиратами"
lv_bad.1.desc: "§LТо, что мы считали простой формой жизни, оказалось пиратом. К счастью, наш научный корабль и большая часть нашей команды не пострадали. Однако несколько членов экипажа были похищены. Несмотря на все наши усилия, мы не смогли отследить их и должны сделать вывод, что их держат в качестве рабов, продали или убили.§!"
lv_bad.1.a: "Вот чёрт!."

lv_bad.2.name: "Нападение работорговцев"
lv_bad.2.desc: "§LВсе шло хорошо, пока мы внезапно не потеряли контакт с §G[Root.GetLeaderName]§! и их командой. Попытки восстановить контакт оказались безрезультатными, и когда мы послали спасательную команду, все, что они нашли, - это обломки, оставшиеся после нападения. Несколько дней спустя нам сообщили о широко распространенном видео, демонстрирующем нападение и похищение ученых. Видео также показало десять часов "обучения" ученых, когда их обучали всем навыкам, которые им понадобятся в их новой жизни в качестве сексуальных рабынь.§!"
lv_bad.2.a: "Чёрт побери."

lv_bad.3.name: "Развлечение На Свежем Воздухе"
lv_bad.3.desc: "§LПосле тщательного обследования экипаж из §G[FROMFROM.GetFleetName]§! отказались от своих поисков. Многие поспешили вернуться на корабль, но некоторые решили не торопиться и насладиться "видами" и телами друг друга.§!"
lv_bad.3.a: "Ну чтож, бывает."

# Lost Sexbot Chain
lv_lewd_planets_1_category: "Слабый сигнал"
lv_lewd_planets_1_category_desc: "§LНаши сканеры обнаружили капсулу, дрейфующую на стабильной орбите вокруг §Y[From.GetName]§!. Размером всего в несколько метров, наши ученые считают, что это своего рода спасательная капсула.§!"

# Lost Sexbot Part 1
lv_lewd_planets_1.1.name: "Потеряный секс бот"
lv_lewd_planets_1.1.desc: "§LНесмотря на то, что капсула выглядела как спасательная, она оказалась чем-то вроде грузового контейнера с довольно своеобразным содержимым. Внутри него, §E[Root.GetLeaderName]§! нашел то, что можно описать только как женский секс-бот. Гуманоидный по форме, хотя и хорошо развитый в области груди и спины, этот робот-слуга находится в удивительно хорошем состоянии, несмотря на то, что ему несколько сотен лет. Благодоря хорошо сохранившемуся ядру, §E[Root.GetLeaderName]§! верит, что мы могли бы оживить ее с помощью технологии, доступной на нашей родной планете.§!"
lv_lewd_planets_1.1.a: "Так чего же мы ждём?"
lv_lewd_planets_1.1.a.tooltip: "§LПеревезите ёё в столицу и активируйте!§!"
lv_lewd_planets_1.1.b: "Как непристойно… но мне любопытно."
lv_lewd_planets_1.1.b.tooltip: "§LДоставьте ее в наш родной мир и активируйте ее.§!"
lv_lewd_planets_1.1.c: "Еще одна космическая странность…"
lv_lewd_planets_1.1.c.tooltip: "§LЗагрузите ее банки данных и разберите тело.§!"

# Lost Sexbot Part 2
lv_lewd_planets_1.2.name: "Её пробуждение"
lv_lewd_planets_1.2.desc: "§LВы наблюдаете за тем, как команда ваших самых талантливых инженеров под руководством §E[lv_sexbot_finder.GetName]§!, заканчивает ремонт потерянного секс-робота. Вы знали, что она должна быть ужасно привлекательной, но то, что вы обнаружили в лаборатории, намного превзошло ваши ожидания. Как и ожидалось от §M[Root.GetRulerTitle]§!, ты сохраняешь самообладание и не позволяешь своему взгляду слишком долго блуждать по ее сочным изгибам. Ты демонстративно игнорируешь манящие дырочки между ее ног и изо всех сил стараешься не думать о небрежном замечании, написанном в одном из отчетов, в котором говорится, что странный дроид полностью совместим с физиологией [Root.Owner.GetSpeciesName] .\n\nВнезапно ее глаза резко открываются. §B[lv_sexbot_finder.GetName]§! уверяет вас, что она совершенно безвредна, но пара солдат рядом с вами все еще направляют на нее свои винтовки, на всякий случай.§!"
lv_lewd_planets_1.2.a: "Что ты такое?"

# Lost Sexbot Part 3
lv_lewd_planets_1.3.name: "Бот служанка"
lv_lewd_planets_1.3.desc: "§LДроид поднимается на ноги, ее движения медленные и чувственные. Ведя себя так, словно она не провела столетия, паря в космосе в стазисе, она оглядывает комнату, анализируя свое окружение. Пока ее глаза не найдут тебя. - Привет. - Ее голос хриплый, мелодичный. Идеально подходит для спальни. "Я - 2946-Т, ваш лучший компаньон. Я могу поддерживать беседу с 27 известными видами. Мои отверстия были оптимизированы, чтобы доставить изысканное удовольствие 42 известным видам. Используя свои руки, я знаю, как удовлетворить еще 69 известных видов.§!"

lv_lewd_planets_1.4.name: "Бот служанка"
lv_lewd_planets_1.4.desc: "§LТы мой новый хозяин? Ты хочешь, чтобы я запустила §EПротокол первой встречи§!?'\n\nВы смотрите на окружающих вас ученых. Все они делают уклончивые жесты, слишком смущенные, чтобы ответить. Они сказали, что она идеально сохранилась…§!"
lv_lewd_planets_1.4.a: "Как хорошо быть §H[Root.GetRulerTitle]§!!"
lv_lewd_planets_1.4.a.tooltip: "§LПрикажите доставить ее в ваши апартаменты… Очень аккуратно.§!"
lv_lewd_planets_1.4.b: "Как развратно… но и увлекательно…"
lv_lewd_planets_1.4.b.tooltip: "§LПрикажите доставить ее в ваши апартаменты… Очень аккуратно.§!"
lv_lewd_planets_1.4.c: "Передайте её учёному §E[lv_sexbot_finder.GetName]§!"
lv_lewd_planets_1.4.c.tooltip: "§LОна могла бы пригодиться.§!"
lv_lewd_planets_1.4.d: "Очень интересно."
lv_lewd_planets_1.4.d.tooltip: "§LПродайте ее тому, кто больше заплатит.§!"
lv_lewd_planets_1.4.e: "Деактивировать и разобрать ее."
lv_lewd_planets_1.4.e.tooltip: "§LЭта "вещь" - насмешка над всеми [Root.Owner.GetSpeciesNamePlural].§!"

# Lost Sexbot Part 4
lv_lewd_planets_1.5.name: "Секс бот помошник"
lv_lewd_planets_1.5.desc: "§LНа несколько недель вы уединяетесь в укромном месте. Запертые в твоей спальне, пока дроид показывает прелести §BПротокола первой встречи§!  вы делаете только самый минимум, необходимый для поддержания вашей космической империи в рабочем состоянии. Секс-робот никогда не устает, никогда не говорит "нет". Она всегда готова, всегда довольна вами и вашими действиями, ее сладкие стоны призывают вас возвращаться в ее объятия снова, и снова, и снова. Вы занимаетесь любовью во всех позах, когда-либо известных вам, и как только вы испробуете все что вам известно...§!"

lv_lewd_planets_1.6.name: "Секс бот помошник"
lv_lewd_planets_1.6.desc: "§L...она вводит вас в мир восхитительных извращений, о которых вы и мечтать не могли. Только после того, как сексуальное безумие утихнет, вы начнете ценить ее лучшие качества. Помимо секса, у нее хорошо развиты социальные навыки, и она приходит, чтобы поделиться бесценной информацией, когда вы имеете дело с различными дипломатическими эмиссарами. Ее несексуальные умения включают массаж и гимнастику, и все это для поддержания вас в хорошей форме, чтобы вы могли наслаждаться ею еще больше. Ваши ученые нашли секс-робота, а вы получили… Ну, секс-бота, с небольшим бонусами вдобавок.§!"
lv_lewd_planets_1.6.a: "Она идеальна!"
lv_lewd_planets_1.6.b: "Но это так неправильно!"

# Lost Sexbot Part 5
lv_lewd_planets_1.7.name: "Секс бот помошник"
lv_lewd_planets_1.7.desc: "§L§E[lv_sexbot_finder.GetName]§! вскоре после этого свяжется с вами. Все его тело гудит от возбуждения, и он долго рассказывает о том, каким чудесным открытием является секс-бот. . §B[lv_sexbot_finder.GetName]§! выражает свою благодарность и заверяет вас, что вскоре они применят свой новообретенный опыт на практике..§!"
lv_lewd_planets_1.7.a: "И все это за один рабочий день."

