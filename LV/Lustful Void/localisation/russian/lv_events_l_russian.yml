#################

lv_event_popups.0: "Понятно."

# Brood Parasite #

lv_brood_parasite_inform.desc: "§LВыводковые паразиты начали внедрять свои яйца в любое отверстие, в которое они могут проникнуть половым путем на планете §E[Root.GetName]§!. Получившиеся в результате новые матери неоднозначно реагируют на внезапную роль инкубаторов для яиц...§!"

lv_ep_brood_parasite.name.1: "Жизнь всегда найдёт путь."
lv_ep_brood_parasite.name.1.tooltip: "§LТо, что может показаться нам странным, для них является биологической необходимостью.§!\n"
lv_ep_brood_parasite.name.2: "Омерзительно."
lv_ep_brood_parasite.name.2.tooltip: "§LАбсолютно отвратительная форма размножения.§!\n"
lv_ep_brood_parasite.name.3: "Так и должно быть."
lv_ep_brood_parasite.name.3.tooltip: "§LТо, что другим может показаться странным, для нас является биологической необходимостью.§!\n"

# Biomechanical Breeder #

lv_biomechanical_breeder_inform.desc: "§LНачалось биомеханическое скрещивание биологического и машинного населения планеты §E[Root.GetName]§!. Оплодотворенные самки могут испытывать некоторый дискомфорт во время этого процесса.§!"

lv_ep_biomechanical_breeder.name.1: "Отлично."
lv_ep_biomechanical_breeder.name.1.tooltip: "§LСледующее поколение обеспечено.§!\n"
lv_ep_biomechanical_breeder.name.2: "Богохульство!."
lv_ep_biomechanical_breeder.name.2.tooltip: "§LТакое неестественное зачатие ставит под сомнение целостность самой души ребенка.§!\n"
lv_ep_biomechanical_breeder.name.3: "Репродуктивные протоколы активированны."
lv_ep_biomechanical_breeder.name.3.tooltip: "§LАктивированны родильные отделения. Теперь корректируем рабочие нагрузки.§!\n"

# Mono Gender #

lv_mono_gender_inform.desc: "§LОднополые виды на планете §E[Root.GetName]§! были сексуально активны с другим видом, полом или даже роботизированными единицами. Скрещивание между ними становится все более распространенным явлением.§!"

lv_ep_mono_gender.name.1: "Чудо жизни."
lv_ep_mono_gender.name.1.tooltip: "§LТо, что виды из таких разных мест могут создавать семьи, является свидетельством красоты жизни.§!\n"
lv_ep_mono_gender.name.2: "Отвратительное смешивание видов."
lv_ep_mono_gender.name.2.tooltip: "§LЧем дольше мы будем это допускать, тем более обыденным оно станет.§!\n"

# Dom/Sub #

lv_dom_sub_inform.desc: "§LСексуальные союзы между властолюбивым видом и необычайно покорным видом на планете  §E[Root.GetName]§! стали обычным явлением. Хотя эти отношения в высшей степени односторонни, оба вида, по-видимому, наслаждаются этим соглашением.§!"

lv_ep_dom_sub.name.1: "Полезно."
lv_ep_dom_sub.name.1.tooltip: "§LЭто должно сохранять их спокойствие и продуктивность, соответственно.§!\n"
lv_ep_dom_sub.name.2: "Мы должны следить за этим."
lv_ep_dom_sub.name.2.tooltip: "§LТе, кто чувствуют себя комфортно будучи угнетёнными, являются самыми слабыми существами на свете .§!\n"
lv_ep_dom_sub.name.3: "Так и надо."
lv_ep_dom_sub.name.3.tooltip: "§LТе, кто зависит от чужого оружия, всегда живут под их сапогом.§!\n"

# Sex Crazed #

lv_sex_crazed_inform.desc: "§LИз-за всепланетных оргий на §B[Root.GetName]§!,некоторые из наших людей стали сломленными наркоманами, которым нужна постоянная сексуальная стимуляция, чтобы иметь какое-то подобие функциональности.§!"

lv_ep_sex_crazed.name.1: "Теперь они знают свое место."
lv_ep_sex_crazed.name.2: "Они вольны делать то, что хотят."
lv_ep_sex_crazed.name.3: "Возможно, это безумие можно использовать в атаке!"

# All Female #

lv_all_female_inform.desc: "§LЗа последние несколько лет женщины на планете [Root.GetName] решили размножаться с самцами, обладающими совместимой спермой, из-за их очень соблазнительной природы самцам других видов стало невероятно трудно найти себе пару. В качестве другого побочного эффекта те, у кого есть эта сперма, заставляют самок, с которыми они размножаются, рожать либо больше самок этого вида, либо детенышей самих самцов. Теперь дело дошло до того, что эти виды стали исключительно женскими.§!"

lv_all_female.name.1: "Подтверждаю."
lv_all_female.name.1.tooltip: "§LНекоторые поселения стали женщинами.§!"

# All Male #

lv_all_male_inform.desc: "§LЗа последние несколько лет мужчины на планете [Root.GetName] решили размножаться с самками, обладающими совместимыми матками, из-за их очень соблазнительной природы, в результате этого самкам других видов стало невероятно трудно найти себе пару. В качестве еще одного побочного эффекта те, у кого есть такие матки, рожают либо больше самцов того вида, с которым они размножаются, либо детенышей самих самок, совместимых между собой. Теперь дело дошло до того, что эти виды стали исключительно мужчинами.§!"

lv_all_male.name.1: "Подтверждаю."
lv_all_male.name.1.tooltip: "§LНекоторые поселения стали мужчинами.§!"

# Hybrids #

lv_perfect_bio_hybrid.desc: "§L"Идеальный" гибридный вид был рожден на §E[Root.GetName]§!!\n\nЭти новые гибриды не только обладают тем, что большинство людей назвали бы физическим совершенством, но и, похоже, демонстрируют мощные псионические способности. Эта комбинация, по сути, дает им контроль над разумом и может представлять опасность, если мы не будем осторожны.§!"

lv_perfect_bio_hybrid.name.1: "WМы должны следить за этим."
lv_perfect_bio_hybrid.name.1.tooltip: "§LНекоторые уже называют их богами. Мы должны убедиться, что люди понимают, что такого понятия не существует.§!"
lv_perfect_bio_hybrid.name.2: "Они действительно идеальны..."
lv_perfect_bio_hybrid.name.2.tooltip: "§LЭти новые существа, должно быть, божественны по своей природе... как еще они могли бы проявить такую силу!§!"

# Milk Cow Specialization #

lv_no_milk_cow_specialization.desc: "§LТеперь мы можем специализировать наших дойных коров. На данный момент наша политика в отношении дойных коров щадящая, мы не хотим слишком напрягать их... (default option)§!"
lv_maximize_milk_cow_production.desc: "§LПостоянно стимулируя наших дойных коров и вводя им в грудь постоянный поток препаратов для лактации, мы можем еще больше увеличить производство молока.!§!"
lv_free_use_cows.desc: "§LРазрешение публике заниматься сексом с любыми дойными коровами, которых они захотят, немного успокоит их.§!"
lv_milk_cow_renting.desc: "§LСдавая в аренду тела наших дойных коров, мы можем заработать немало дополнительных кредитов.§!"
lv_milk_cow_breeding.desc: "§LСосредоточение внимания на использовании наших дойных коров в качестве животных для размножения существенно поможет в усилиях по колонизации или повторному заселению!§!"

# Buildings #

lv_pop_stealing_notify.desc: "§LНаша операция в чужом мире §R[lv_abduction_planet.GetName]§! успешно выполнена! Большое количество их людей было приобретено без привлечения слишком большого внимания. Они были перемещены на §E[lv_relocated_planet.GetName]§!.§!"
lv_pop_stolen_notify.desc: "§LИПосле вражеской операции на планете §R[lv_abduction_planet.getName]§! похитили большое количество наших людей! Они были перемещены в §E[lv_relocated_planet.getName]§! насколько нам известно.§!"

