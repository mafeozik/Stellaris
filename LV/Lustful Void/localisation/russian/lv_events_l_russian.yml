###     Archaeology Site Events     ###
#######################################

site_lv_srelic: "В поисках ответов"
site_lv_srelic_intro: "§LЭта система имеет много странных особенностей, и этот реликтовый мир может содержать ответы.§!"

lv_arcsite_events.11.name: "Поиск Цели"
lv_arcsite_events.11.desc: "§LПохоже, что это общество никогда не стремилось выйти за пределы своей домашней системы и вместо этого сосредоточило все свои усилия на одном: трахании. Похоже, что они были настолько сосредоточены на сексуальном удовлетворении, что все остальное было второстепенным, и остатки их жидкостей можно найти по всей планете.§!"
lv_arcsite_events.12.name: "Библиотека удовольствий"
lv_arcsite_events.12.desc: "§LКоманда археологов обнаружила остатки того, что, по-видимому, является гигантской библиотекой, наполненной множеством документов, созданных погибшей цивилизацией. Хотя большинство файлов носят порнографический характер, похоже, что в них могли храниться и более важные документы.§!"
lv_arcsite_events.13.name: "Стеклянный свод"
lv_arcsite_events.13.desc: "§LВо время поисков в библиотеке команда обнаружила потайной туннель, который вел в большое подземное хранилище. Большая часть хранилища от пола до потолка заполнена стеклянными компьютерами, в которых хранится еще больше носителей, созданных цивилизацией. Казалось бы, это относится ко всем произведениям, когда-либо созданным цивилизацией. Существуют различные ответвления от главного хранилища, которые команда решила исследовать.§!"
lv_arcsite_events.14.name: "Исходящий сигнал"
lv_arcsite_events.14.desc: "§LОдин из археологов обнаружил, что в Стеклянном хранилище находится скрытый передатчик, подключенный к большой базе данных. Сигнал, который он излучает, совершенно чужой, и для его расшифровки потребуется некоторое время, но команда смогла определить, что его приемник находится на экранированной Луне.§!"
lv_arcsite_events.15.name: "Сигнал Расшифрован"
lv_arcsite_events.15.desc: "§LАрхеологическая команда смогла успешно расшифровать передачу, и с обнаружением приемопередатчика обнаружила, что все, что находится на Луне, активно получает доступ к Стеклянному Хранилищу. Команда перепроектировала приемопередатчик и собирается попытаться установить связь с тем, кто (или что) находится на экранированной Луне.§!"
lv_arcsite_events.15.a: "Возможно, у них есть ответы."
lv_arcsite_events.16.name: "Контакт"
lv_arcsite_events.16.desc: "§LПривет?\n\nАхуеть, я не получал сообщений по этой линии уже тысячи лет! Вы все, должно быть, инопланетяне, верно? Черт, честно говоря, я думал, что вы никогда не придете.§!"
lv_arcsite_events.16.a: "Кто ты?"
lv_arcsite_events.16.a.response: "§LЯ? Что ж, я ученый, один из немногих в своем времени. Все, что я когда-либо хотел сделать, это полететь на Луну, но никто другой даже немного не интересовался этим.\n\n"Почему ты хочешь туда поехать?" они сказали: "Просто займись с нами сексом", они сказали, что ж, К ЧЕРТУ ЭТО ДЕРЬМО. Я хотел полететь на Луну, вот я и полетел на эту чертову луну. Оказалось, что это место было так же пригодно для жизни, как и наша родная планета, но я знал, что если бы люди на родине узнали об этом, они бы послали сюда людей как сумасшедших, поэтому я разработал щит, который сейчас на месте. Было несколько непредвиденных последствий, таких как продление моей жизни и невозможность отключить его, но в остальном все было в порядке.§!"
lv_arcsite_events.16.b: "Что произошло с твоим народом?"
lv_arcsite_events.16.b.response: "§LЧто ж, на самом деле это было довольно странно. Их страсть к похоти была безумной, она определяла практически каждое принятое ими решение. Это вожделение было настолько сильным, что привлекло внимание некоего существа с другого плана существования. Это заключило какую-то сделку с людьми там, внизу, потому что в последней передаче, которую я получил, все люди на планете сказали "да" одновременно. Когда он улетел, все, что осталось, - это пустая планета и странный фиолетовый шар размером с астероид. Эта чертова штука куда-то улетела, но я думаю, что она все еще в системе.§!"
lv_arcsite_events.16.c: "У вас случайно нет какой-нибудь технологии, не так ли?"
lv_arcsite_events.16.c.response: "§LХа-ха, да, конечно, знаю, в конце концов, я ученый. Так получилось, что у меня есть довольно много изобретений, которые могут быть вам полезны, я пришлю их в обмен на доступ к инопланетным медиа, потому что у меня почти закончились дела здесь.§!"
lv_arcsite_events.17.name: "Контакт"
lv_arcsite_events.17.desc: "§LХа-ха, да, конечно, знаю, в конце концов, я ученый. Просто так случилось, что у меня есть довольно много изобретений, которые могут быть вам полезны, я пришлю их в обмен на доступ к инопланетным МЕДИА, потому что у меня здесь почти закончились дела.§!"
lv_arcsite_events.17.a: "Договорились"

site_lv_sring: "Переломный момент"
site_lv_sring_intro: "§LЭтот сегмент мира-кольца был полностью разрушен миром-изгоем, обнажив внутренности структуры. Возможно, изучение этой области даст нам некоторое представление о том, что имели в виду создатели этого сооружения.§!"

lv_arcsite_events.22.name: "Странная защелка"
lv_arcsite_events.22.desc: "§LИсследуя обломки, археологическая группа обнаружила защелку, которая, по-видимому, ведет в довольно неповрежденную часть кольца. Она заперта, так что потребуется некоторое время, чтобы пройти.§!"
lv_arcsite_events.23.name: "Лабиринт бесконечности"
lv_arcsite_events.23.desc: "§LВзломав задвижку, археологи обнаружили большой лабиринт, который тянется во всех направлениях. Панели управления расположены повсюду, возможно, если мы сможем заставить одну из них работать, можно будет найти способ получить что-то интересное.§!"
lv_arcsite_events.24.name: "Карта лабиринта"
lv_arcsite_events.24.desc: "§LКак только консоль была снова включена, была обнаружена структура большого лабиринта, указывающая на область далеко впереди, в которой находятся хранилища данных строителей этого кольца. Команда археологов готова к работе, но путешествие по лабиринту займет некоторое время.§!"
lv_arcsite_events.25.name: "Серверные стеки"
lv_arcsite_events.25.desc: "§LЧерез некоторое время мы нашли нужные серверы. Хотя некоторые из них повреждены, археологам удалось включить несколько. На данный момент они ищут в архивах информацию о кольце и его строителях. Они свяжутся с нами, когда найдут все, что смогут.§!"
lv_arcsite_events.26.name: "Ужасная судьба"
lv_arcsite_events.26.desc: "§LКоманда археологов многое узнала об этом кольце и его создателях из этих архивов. Изначально они построили кольцо для себя, чтобы жить на нем, новую колонию для своей огромной империи. Однако они были вынуждены отказаться от неё после того, как неизвестная сила, известная только как "Конец", уничтожила все разумные формы жизни в их империи. Это известно только благодаря искусственному интеллекту, который продолжал записывать данные после их смерти. Хотя это ядро данных было уничтожено вместе с этим кольцевым сегментом, оно оставило координаты для различных кэшей, до сих пор не обнаруженных ресурсов.§!"
lv_arcsite_events.26.a: "Трагическая судьба, мы будем использовать эти ресурсы."

site_lv_golden_rod: "Руины колонии"
site_lv_golden_rod_intro: "§LСканирования [From.Planet.GetName] показывают плотное размещение строений в районе северного полушария. Дальнейшее наблюдение показывает, что когда-то здесь жила относительно небольшая доиндустриальная цивилизация..§!"

lv_arcsite_events.31.name: "Исследование города"
lv_arcsite_events.31.desc: "§LДля осмотра руин была отправлена экспедиция археологов. При первых наблюдениях в руинах было обнаружено множество зданий из мрамора и камня. Большинство из них ветхие и заросшие, но они, должно быть, были высококвалифицированными архитекторами, судя по некоторым деталям и формам, все еще видимым на строительных блоках.\n\nБольшой лес находится на окраине города, но инструменты и остатки вымощенные булыжником дороги позволяют предположить, что раньше это была обширная сеть пастбищ и полей..§!"
lv_arcsite_events.32.name: "Исследование внутренностей"
lv_arcsite_events.32.desc: "§LОбследовав довольно неповрежденный дом, научный сотрудник [Root.GetLeaderName] обнаружил кое-что очень любопытное. Стены с внутренней стороны, которые почти не обветрились, покрыты рельефами животных, некоторые из которых двуногие. Это может указывать на цивилизацию млекопитающих, которая также использовала сельскохозяйственных животных. Но помимо этого, есть повторяющиеся ссылки на что-то, что можно перевести как «§YЗолотой жезл§!». или что-то подобное.\n\nУ остальных членов команды были аналогичные результаты в других зданиях..§!"
lv_arcsite_events.32.a: "Найдите это!"
lv_arcsite_events.33.name: "В гору"
lv_arcsite_events.33.desc: "§LГруппа во главе с научным сотрудником [Root.GetLeaderName] покинула город и направилась по сильно выветриваемой дороге, ведущей в гору. Оттуда они могли обозревать весь город и делать дополнительные заметки. Население города могло составлять от 30 000 до 80 000 человек, что кажется средним показателем для цивилизации такого уровня технологий. Планировка города также выявила большую рыночную площадь с разрушенной статуей в центре.\n\nВ конце концов команда зашла в тупик на плато на склоне горы..§!"
lv_arcsite_events.34.name: "Попадание внутрь"
lv_arcsite_events.34.desc: "§LУбрав слои лозы, команда нашла вход: большую дверь с резными изображениями животных и знаками на ней. Отсутствие рычага или чего-либо подобного говорит о том, что его можно открыть либо только изнутри, либо с помощью скрытого курка. Не желая тратить время на поиски того, чего там может и не быть, команда разгрузила плазменные резаки и начала вскрывать дверь..§!"
lv_arcsite_events.35.name: "Внутри"
lv_arcsite_events.35.desc: "§LДверь была взломана и уступила место огромному туннелю, сделанному из мрамора с самой впечатляющей каменной кладкой, которую мы когда-либо видели. На удивление пещера хорошо освещена светящимися грибами, покрывающими потолок, а частые просветы также пропускают частички солнечного света.\n\nПеред командой лежит очевидная тропа, ведущая вглубь горы, поэтому они решают идти по ней..§!"
lv_arcsite_events.36.name: "Любопытные статуи"
lv_arcsite_events.36.desc: "§LВдоль пути теперь слева и справа стоят статуи. Они двуногие и млекопитающие и, вероятно, основаны на своих бывших владельцах. Большинство из них выглядят как те, кого мы назвали бы «лошадями», и одеты в то, что представляет собой красивую одежду. Можно с уверенностью предположить, что население носило что-то подобное.\n\nСледуя по пути статуй, команда заметила уменьшение одежды. Чем дальше они идут, тем меньше одежд покрывает тело статуи, пока она не станет полностью обнаженной..§!"
lv_arcsite_events.37.name: "это оно?"
lv_arcsite_events.37.desc: "§LПуть статуй закончился, и большой туннель вел к огромной пещере. Несколько массивных каменных статуй, используемых в качестве колонн, поддерживают очень высокий потолок, в то время как эта часть пещеры все еще хорошо освещена светящимся грибком. К центру комнаты дорожка превращается в лестницу, ведущую к довольно большой пирамиде. На пути к вершине команда замечает массивный трон с другой статуей, сидящей на нем, и огромной чашей перед ней.\n\nКогда они достигают вершины, они оба потрясены и удивлены. В голых телах статуй нет ничего нового, но эта уникальна. У него массивный золотой конский пенис! Это все? Это §YЗолотой жезл§!? Это не то, что мы ожидали, но пока это единственная золотая вещь, которую мы нашли, и она определенно играет центральную роль в этом месте..§!"
lv_arcsite_events.37.a: "это оно?"
lv_arcsite_events.38.name: "Инцидент"
lv_arcsite_events.38.desc: "§LПытаясь подтвердить подлинность «§YЗолотого жезла§!» как лошадиный пенис на коленях статуи, команда исследовала трон и его окрестности, когда их прервал крик. Один из археологов по имени «Бонни» забрался в на статую и закричала: «Посмотрите на это!».\n\nНаучный сотрудник [Root.GetLeaderName] убеждает ее спуститься и сохранять профессионализм, но у нее есть другие планы. Она проигнорировала всех, сорвала с себя одежду и оседлала §YЗолотой Жезл§!. Даже к своему удивлению, она соскользнула на него и за считанные секунды поглотила его огромные размеры. Затем она издает громкий стон, и в этот момент золотой ребристый пенис и глаза статуи начинают светиться..§!"
lv_arcsite_events.38.a: "Что происходит?"
lv_arcsite_events.39.name: "Трансформация"
lv_arcsite_events.39.desc: "§LУ нее начались множественные оргазмы, а потом случилось непредвиденное. Ее клитор начал быстро расти, пока не достиг размера ее предплечья и не принял форму конского пениса. Все еще испытывая оргазм, ее недавно выросший член эякулирует прямо в чашу перед троном. Затем она потеряла сознание, пока мы пытались ее спустить.\n\nМы точно не знаем, что только что произошло, но некоторые вещи теперь имеют больше смысла, а другие вызывают больше вопросов. Из того, что мы можем сказать, это какой-то странный ритуал, чтобы каким-то образом вырастить конский пенис! Это говорит о том, что статуи представляют не своих создателей, а вид, полученный после церемонии. Общественная роль церемонии также остается загадкой. Было ли это для каждого члена или избранных?\n\nНам нужно будет продолжить расследование, но сейчас мы должны решить, что делать с §YЗолотым жезлом§!.§!"
lv_arcsite_events.39.a: "Забрать артефакт."
lv_arcsite_events.39.a.tooltip: "§LПолучите §Золотой жезл§! как реликвию.§!"
lv_arcsite_events.39.b: "Все в порядке. Откройте храм для публики."
lv_arcsite_events.39.b.tooltip: "§LДобавляет Храм как планетарную особенность со специальными заданиями..§!"

###########################
###     Observation     ###
###########################

lv_observation_events.2.name: "Пропавший ученый"
lv_observation_events.2.desc: "§LНесколько наших ученых, работающих на наблюдательной станции, находящейся на орбите §B[From.GetName]§! пропали без вести. Детальный поиск на станции не позволил обнаружить их, но он обнаружил пропавшую спасательную капсулу.§!"
lv_observation_events.2.a: "Мы должны найти их немедленно."

lv_observation_events.3.name: "Смерть ученых"
lv_observation_events.3.desc: "§LНашей поисковой команде потребовался всего час, чтобы найти спасательную капсулу. Сразу стало ясно, что капсула каким-то образом вышла из строя и ударилась о землю на большой скорости. Удивительно, но один ученый выжил в катастрофе и сумел уползти в дикую местность, оставляя за собой кровавый след. Несколько часов спустя поисковая группа обнаружила его тело.§!"
lv_observation_events.3.a: "Почему они это сделали?"

lv_observation_events.5.name: "Странные отчёты с [From.GetName]"
lv_observation_events.5.desc: "§LМы получаем странные сообщения от наших ученых на станции §B[From.GetName]§!. Одно из местных королевств объединилось под руководством таинственного религиозного деятеля, и мы видели свидетельства того, что они используют передовые технологии, намного превосходящие их нынешний уровень развития. Мы также являемся свидетелями быстрых изменений в культуре, поскольку религия, которую наши ученые называют "культом секса", набирает силу. Может ли это быть связано с нашим пропавшим ученым?§!"
lv_observation_events.5.a: "Занимательно."

lv_observation_events.7.desc: "§LЗдравствуйте, друзья. Возможно, вы узнаете во мне одного из ученых, пропавших без вести на §B[From.GetName]§!. Уверяю вас, мое внезапное исчезновение было совершенно преднамеренным.\n\nМестные жители стали видеть во мне что-то вроде бога... А почему бы и нет? После долгих размышлений я решил принести этим дикарям настоящую цивилизацию.§!"
lv_observation_events.7.a: "Что на тебя нашло?!"
lv_observation_events.7.a.response: "§LЯ устал. Устал от недальновидных этических ограничений, устал от насмешек, которым я подвергался от своих колег. Больше всего я устал от пассивного наблюдения.\n\nХА! Что за чушь! Наш ДОЛГ - вмешиваться в примитивные культуры - направлять и формировать их во что-то полезное! Тихое наблюдение со стороны - это просто постыдный способ уклониться от ответственности.§!"
lv_observation_events.7.b: "Мы отзываем вас обратно на станцию!"
lv_observation_events.7.b.response: "§LБоюсь, для этого уже слишком поздно. Я устал подчиняться приказам тех, кто ниже меня по положению. Мой интеллект был в твоем распоряжении, но ты предпочел растратить его впустую.\n\nЗдесь ко мне относятся с уважением, которого я заслуживаю. Теперь это мой дом. С моими знаниями и техническими схемами, которые я привез с собой, я положу начало этой культуре и превращу ее во что-то великое.§!"
lv_observation_events.7.c: "Ты просто хотел трахнуть их."
lv_observation_events.7.c.response: "§LКонечно! Не так ли? Это проблема в культуре §Y[Root.GetName]§!. Слишком много ограничений. Почему мы должны испытывать стыд из-за нашего естественного стремления к размножению?\n\nЯ расскажу тебе. Мы не должны этого делать. Я создам здесь утопию. Присоединяйтесь ко мне или оставьте нас в покое.\n\nМне больше нечего сказать. Я прощаюсь с вами.§!"

lv_observation_events.9.name: "Ученый-Мошенник Консолидирует Власть"
lv_observation_events.9.desc: "§LМы получили тревожные сообщения с поверхности §B[From.GetName]§!. Похоже, наш ученый-мошенник консолидирует власть, предоставляя одному из феодальных королевств доступ к передовому оружию, которое сейчас находится в процессе завоевания остальной части планеты от его имени.\n\nБыл выдвинут план отстранения его от власти, но для этого потребуются значительные сухопутные силы. Неизвестно, какой эффект это окажет на местное население, поскольку многие стали воспринимать ученого как бога.§!"
lv_observation_events.9.a: "Начать подготовку к операции."
lv_observation_events.9.b: "Это только ухудшило бы ситуацию..."

lv_observation_events.10.name: "Успешный захват"
lv_observation_events.10.desc: "§LМы успешно захватили ученого-мошенника из §B[From.From.GetName]§!! Сотни местных жителей были трагически расстреляны, когда попытались совершить самоубийственные атаки против наших войск в тщетной попытке защитить своего "бога".\n\nТеперь ученого будут судить, но влияние этих событий на цивилизацию [From.From.GetPlanetMoon]'  должно быть огромным. Они все еще владеют некоторыми из наших технологий, все еще невероятно сексуально либеральны, и их божество только что было похищено захватчиками из космоса..§!"
lv_observation_events.10.a: "По крайней мере, одна проблема решена."

lv_observation_events.12.name: "Религиозные конфликты на [From.GetName]"
lv_observation_events.12.desc: "§L§B[From.GetName]§! перерос в масштабную войну после успешного извлечения нашего ученого-изгоя. Империя, которую они построили, распалась на несколько враждующих фракций, каждая из которых по-своему интерпретировала свои религиозные догмы.\n\nБои были особенно ожесточенными из-за разрушительного оружия, которое сейчас используют местные жители. Противоборствующие группировки уже взорвали несколько радиоактивных"грязных бомб", и, похоже, конфликт только начинается. "Сексуальный культ" по-прежнему силен, но принял мрачный оборот. Сексуальное насилие и изнасилование заменили секс по обоюдному согласию по мере обострения конфликта.§!"
lv_observation_events.12.a: "Волнительно."

lv_observation_events.14.name: "Ситуация устаканивается на [From.GetName]"
lv_observation_events.14.desc: "§LСитуация на §B[From.GetName]§! кажется, все немного успокоилось после успешного извлечения нашего ученого-мошенника. Без него, стало некому рашифровывать  технические схемы, которые он принес с собой. Они начали возвращаться к своим старым привычкам, хотя по-прежнему довольно либеральны в сексуальном плане.§!"
lv_observation_events.14.a: "Хорошо что все кончилось."

lv_observation_events.16.name: "Ракетный удар По Наблюдательному посту!"
lv_observation_events.16.desc: "§LШквал ракет класса "земля-космос" был запущен с поверхности §B[From.GetName]§! на нашем Наблюдательном Посту! Станция была разрушена, выживших не осталось.\n\nЭто похоже что примитивная цивилизация [From.GetPlanetMoon] продолжает развиваться с невероятной скоростью - даже несмотря на то, что мы устранили влияние их так называемого "бога". Технологии, которые они им дал, должно быть, вызвали научную революцию.§!"
lv_observation_events.16.a: "Вот почему нам нужна Директива о невмешательстве."

lv_observation_events.18.desc: "§LДухи защитят меня! Ты похож на нашего Святого Спасителя, но различия бросаются в глаза. Он говорил о демонах, которые будут имитировать Его внешность, и которые однажды могут спуститься с небес, чтобы украсть Его. Пророчество сбылось, и у меня нет никаких сомнений в том, что это твоих рук дело.\n\nГде наш Святой Спаситель, несчастное создание? Я требую Его немедленного освобождения!§!"
lv_observation_events.18.a: "Ваш "Святой Спаситель" был всего лишь ученым."
lv_observation_events.18.a.response: "§LВ моем мире клевета на имя Святого Спасителя - непростительный грех, караемый смертью. Только благодаря Его волшебным изобретениям нашей цивилизации удалось достичь всего, что у нее есть. Я прощу твое богохульство, если ты вернешь нам Святого Спасителя.§!"
lv_observation_events.18.b: "Он был казнен за свои преступления против вашего народа."
lv_observation_events.18.b.response: "§LТы... ты убил Святого Спасителя? Я... ты... мы... мы не можем...\n\nЭто... это преступление не останется безнаказанным, демон. Хотя это может занять тысячу лет, мой народ увидит, как ваша демоническая империя превратится в прах.!§!"
lv_observation_events.18.c: "Очень хорошо. Он будет передан под вашу опеку."
lv_observation_events.18.c.response: "§LПусть Святой Спаситель простит твои преступления, демон. Возможно, для вас еще есть надежда.§!"

lv_observation_events.19.desc: "§LГм. Полагаю, я должен быть благодарен вам за то, что вы вернули меня к моим ученикам после всех этих лет, которые я провел, мотаясь по психиатрическим лечебницами...\n\nОчень хорошо. Я собираюсь оставить прошлое в прошлом. Пока ты оставляешь моих людей в покое, я уверен, мы сможем прекрасно поладить. В конце концов, космос очень велик.§!"
lv_observation_events.19.a: "Посмотрим."

lv_observation_events.20.desc: "§LШквал ракет класса "земля-космос" был запущен с поверхности [From.From.GetName] по нашему наблюдательному посту на высокой орбите! Станция была разрушена, выживших не осталось.\n\nПохоже что примитивная цивилизация на §B[From.From.GetPlanetMoon]§! развивается с невероятной скоростью - без сомнения, благодаря усилиям нашего ученого-мошенника. Их больше нельзя считать примитивными, и возможность отстранить ученого от власти более невозможна.§!"

lv_observation_events.22.name: "Пропавшие ученые Захвачены примитивами"
lv_observation_events.22.desc: "§LНашим беспилотникам и орбитальным спутникам не потребовалось много времени, чтобы выяснить судьбу наших пропавших ученых. Они, кажется, добровольно работают на §B[From.GetName]§!,или, по крайней мере, настолько добровольно, насколько это возможно, учитывая, что они были захвачены примитивами. Неясно, что примитивы намерены делать с нашими учеными, и, к сожалению, ситуация слишком нестабильна, чтобы пытаться выполнить миссию по спасению.§!"
lv_observation_events.22.a: "Нам просто нужно подгодать момент."

lv_observation_events.24.name: "Ученые проданы"
lv_observation_events.24.desc: "§LНаша наблюдательная станция на орбите §B[From.GetName]§! сообщила, что подавляющее большинство наших захваченных ученых были проданы в рабство. Национальные лидеры и богатые люди со всего мира бросились приобретать то, что они называли "Подарками со звезд". Это сделает спасение наших ученых еще более трудным теперь, когда они были разделены. По крайней мере, у нас будет возможность увидеть, как различные культуры [From.GetName] будут обращаться с нашими людьми.§!"
lv_observation_events.24.a: "Нам просто нужно подгодать момент."

lv_observation_events.26.name: "Использованы как ездовые животные"
lv_observation_events.26.desc: "§LНаша наблюдательная станция на орбите §B[From.GetName]§! опубликовала отчет, в котором говорится, что на нескольких наших захваченных ученых ездили верхом, как на лошадях, пока их новые владельцы отправлялись на родину. Наши ученые, те, кто все еще находится на станции, не уверены, является ли это просто проявлением доминирования над "Дарами Звезд", или они действительно рассматривают наших людей как животных, либо в этом поведении есть какие-то сексуальные элементы. Наши ученые, находящиеся на станции, быстро указывают на то, что раздевание захваченных ученых и насильственный пирсинг многих из них, хотя и имеют сексуальный подтекст в нашей культуре, могут не иметь такого подтекста в их культуре.§!"
lv_observation_events.26.a: "Нам просто нужно подгодать момент."
lv_observation_events.26.b: "Дикари!"
lv_observation_events.26.c: "По крайней мере, мы можем узнать об их культуре."

lv_observation_events.28.name: "Содержатся в качестве домашних рабов"
lv_observation_events.28.desc: "§LНаша наблюдательная станция на орбите §B[From.GetName]§! сделала еще один репортаж о наших захваченных ученых. Те, кого увозят в более развитые страны на [From.GetName] используются в качестве домашних рабов. Их основные обязанности, по-видимому, связаны с ведением домашнего хозяйства и развлечениями, хотя многие из них также используются в качестве секретарей или помощников в административных обязанностях.Большое количество этих домашних рабынь также используется для удовлетворения сексуальных потребностей своих хозяев. Хотя ясно, что два вида не могут производить потомство, обитатели §B[From.GetName]§! могут решить намеренно разводить наших захваченных ученых.§!"
lv_observation_events.28.a: "Нужно начать действовать как можно скорее!."
lv_observation_events.28.b: "Может быть, эта ситуация не так уж и плоха..."

lv_observation_events.30.name: "Начало разведения"
lv_observation_events.30.desc: "§LСтало ясно, что люди с планеты §B[From.GetName]§! поняли, что больше не будут получать "Подарков от Звезд", и поэтому решили просто сделать их побольше самостоятельно. Различные страны по всему миру придумали свои собственные способы разведения наших захваченных ученых. Некоторые культуры заставляют мужчин насиловать женщин. Другие "позволяют природе идти своим чередом", обеспечивая самцам и самкам широкие возможности для размножения. Независимо от используемых методов, нам стало ясно, что скоро наши захваченные ученые произведут на свет своих детей.\n\\nМы должны действовать сейчас. Наши генералы подготовили план. Мы развернем группы спецназа по всему миру, чтобы одновременно вернуть наших ученых.§!"
lv_observation_events.30.a: "Начать операцию!."
lv_observation_events.30.b: "Время пришло!"
lv_observation_events.30.c: "Слишком рисково."

lv_observation_events.31.name: "Успех эвакуации"
lv_observation_events.31.desc: "§LМиссия прошла лучше, чем ожидалось. Все наши ученые были эвакуированы, и нам удалось свести потери местных жителей к минимуму. Наша наблюдательная станция сообщает, что местные жители понятия не имеют, что произошло: одни считают, что "Дары со Звезд" вознеслись на "Небеса", а другие считают, что наши захваченные ученые всегда были просто плодом их воображения. Конечно, некоторые из более рациональных туземцев верят в правду, что мы вывезли наших людей, но у них нет никаких доказательств, подтверждающих их утверждения.§!"
lv_observation_events.31.a: "Передайте мои наилучшие пожелания нашим спецназовцам."

lv_observation_events.32.name: "Обреченные на жизнь в качестве животных"
lv_observation_events.32.desc: "§LНам не удалось извлечь наших ученых до того, как они начали производить потомство. Теперь мы, скорее всего, никогда не вернем наших людей, по крайней мере, до тех пор, пока не захотим полностью вторгнуться в страну для этого.§!"
lv_observation_events.32.a: "Что сделано, то сделано."

lv_observation_events.202.name: "Близкие контакты зондирующего характера"
lv_observation_events.202.desc: "§LНаши ученые на орбите планеты §B[From.GetName]§! начали экспериментировать на аборигенах, чтобы получить четкое представление об их сексуальных особенностях. До сих пор это в основном включало отправку дроидов, оснащенных фаллоимитаторами и другими сексуальными игрушками, и использование их для "зондирования" местных жителей. Реакция местных жителей на дроидов была разделена: многие боятся или ненавидят их, в то время как некоторым, похоже, нравится зондирование, они даже заходят так далеко, что изолируют себя в дикой местности в надежде привлечь наших дроидов-зондов..§!"
lv_observation_events.202.a: "Занимательно."

lv_observation_events.204.name: "Эксперименты по разведению"
lv_observation_events.204.desc: "§LНедавно наши ученые на орбите планеты §B[From.GetName]§! начали экспериментировать на местных жителях, чтобы лучше понять, как они реагируют сексуально при различных обстоятельствах. Эти эксперименты варьируются от простого помещения двух обнаженных субъектов разного пола в одну комнату до принуждения самцов к половому акту с самками. Наши ученые уверяют нас, что они узнают много интересного и полезного.§!"
lv_observation_events.204.a: "Занимательно."
lv_observation_events.204.b: "Мы можем чему-то научиться даже у нецивилизованных дикарей."
lv_observation_events.204.c: "Вперед! Ради науки!"

lv_observation_events.206.name: "Зондирование продолжается"
lv_observation_events.206.desc: "§LЧувствуя, что их эксперименты по разведению зашли в тупик, наши ученые решили продолжить сексуальное зондирование местных жителей §B[From.GetName]§!.В то время как они утверждают, что делают великие прорывы, некоторые критики утверждают, что наши ученые просто исследуют местных жителей ради забавы. Несмотря на это, наши ученые отметили что подопытные начали получать больше удовольствия.§!"
lv_observation_events.206.a: "Что бы это могло значить?"
lv_observation_events.206.b: "Конечно, отвратительные ксеносы хотят, чтобы их исследовали."
lv_observation_events.206.c: "Вперед! Ради науки!"

lv_observation_events.208.name: "Мазохистские наклонности"
lv_observation_events.208.desc: "§LНаши ученые не уверены почему, но их продолжающееся исследование местных жителей §B[From.GetName]§!  привели к тому, что они стали очень покорными и заметно более мазохистскими. Теперь они тоскуют по стрессу, вызванному нашими похищениями, и по боли, которая иногда сопровождала их. Некоторые из наших ученых утверждают, что местные жители всегда были такими, просто со временем эти черты притупились. Другие считают, что местные жители стали покорными и мазохистскими, чтобы справиться с нашими экспериментами. Независимо от причины, это, вероятно, стало для них постоянным изменением.§!"
lv_observation_events.208.a: "Интересно."
lv_observation_events.208.a.tooltip: "Все поселения на [From.GetName] приобретают черты покорные, мазохисты и становятся ксенофилами."

lv_observation_events.209.name: "Эксперименты по разведению продолжаются"
lv_observation_events.209.desc: "§LНаши ученые на орбите планеты §B[From.GetName]§! перевели свои эксперименты по разведению на следующую фазу. Они начали проводить эксперименты, чтобы посмотреть, как местные жители реагируют на половые сношения с нашими и другими видами. Некоторые критики отметили, что мы уже знаем, что местные жители не смогут родить детей от любого существа, не родного для их мира, но дело не в этом. Наши ученые пытаются понять, как именно гениталии местных жителей взаимодействуют и управляются с гениталиями существ, чуждых их биосфере.§!"
lv_observation_events.209.a: "Продолжайте."
lv_observation_events.209.b: "Значит, кто-то из наших людей действительно трахнул их? Отвратительно!"
lv_observation_events.209.c: "Ради науки!"

lv_observation_events.211.name: "Окончание эксперимента по разведению"
lv_observation_events.211.desc: "§LНаши ученые на орбите планеты §B[From.GetName]§! узнали все, что могли, из своих экспериментов по разведению с местными жителями. Они точно знают, что местные жители считают наиболее сексуально возбуждающим, а также всю подноготную их половых органов. Они также теперь окончательно знают, что местные жители могут размножаться только со своим собственным видом без каких-либо изменений. Наши ученые сообщили, что они прекращают свои эксперименты по разведению и переходят к новым проектам.§!"
lv_observation_events.211.a: "Интересно."
lv_observation_events.211.b: "Наконец-то. Мы можем прекратить трахать этих отродий."
lv_observation_events.211.c: "Полагаю, наши ученые достигли 'кульминации'."

lv_observation_events.213.name: "Сексуальная Модификация"
lv_observation_events.213.desc: "§LПосле десятилетий исследований наши ученые начали разбираться в генетическом коде обитателей §B[From.GetName]'s§! . Они предложили смелый план, который с помощью комбинации селективных вирусов, генной инженерии и хирургии позволил бы нам изменить местных жителей, чтобы они лучше соответствовали нашим стандартам красоты. Хотя на первый взгляд это звучит сомнительно, многочисленные ученые со всей нашей империи рассмотрели предложенную тему и заявили, что она выглядит многообещающей.§!"
lv_observation_events.213.a: "Давайте сделаем это."
lv_observation_events.213.b: "Звучит как пустая трата времени."

lv_observation_events.1213.name: "Сексуальная Модификация Завершена"
lv_observation_events.1213.desc: "§LНаш проект по изменению местных жителей §B[From.GetName]§! ради лучшего соответствовния нашим стандартам красоты, была успешно завершена.§!"
lv_observation_events.1213.a: "Они выглядят намного лучше!"

#lv_observation_events.302.name: "Похотливые Махинации"
#lv_observation_events.302.desc: "§LНаше проникновение в §B[From.GetName]§!  произошло быстрее, чем мы ожидали, когда наши агенты начали использовать свои кибер-секс-игрушки, чтобы привлечь некоторых местных лидеров на нашу сторону. Возможно, не стоит слишком удивляться тому, что наши самосмазывающиеся "массажные" машины оказались настолько успешными, учитывая, что они могут довести местных жителей до вершин экстаза, которые немногие из них когда-либо испытывали раньше.§!"
#lv_observation_events.302.a: "Секс продаёт!"

#####################
###     Fleet     ###
#####################

lv_fleet_events.1.name: "Садистский праздник"
lv_fleet_events.1.desc: "§LВо время последнего победоносного сражения с врагом адмиралу [officer.GetName] удалось захватить в плен вражеского командира. Часы физического, психического и сексуального насилия которым садист [officer.GetName] вероятно, подвергнет новую "игрушку" [officer.GetHerHis] заставят пожалеть, что он вообще записался в армию.§!"
lv_fleet_events.1.a: "Такова природа войны."
lv_fleet_events.1.b: "Естественно, сильные доминируют над слабыми."
lv_fleet_events.1.c: "[officer.GetShehe] заслужил эту награду."
lv_fleet_events.1.d: "Ужасы войны!"

#######################
###     Colony      ###
#######################

lv_colony_events.1.name: "Незванные гости"
lv_colony_events.1.desc: "§LНескольким ксеноформам жизни каким-то образом удалось проникнуть на одну из наших планет. Это не было бы проблемой , если бы не тот факт, что они неоднократно пытаются насильно скрещиваться с нашими колонистами. Люди напуганы, и местное правительство ищет помощи.§!"
lv_colony_events.1.a: "Мы сделаем все, что в наших силах, чтобы помочь."
lv_colony_events.1.b: "Пошлите туда спецназ!"
lv_colony_events.1.c: "Они не желают нам зла!"
lv_colony_events.1.d: "Вот почему мы не можем доверять ксеносам!"
lv_colony_events.1.e: "Они - божественные существа!"

lv_colony_events.2.name: "Побег из Ксено-зоопарка"
lv_colony_events.2.desc: "§LНекоторые животные, содержащиеся в зоопарке на §B[Root.GetName]§! вырвались из своих вольеров. Сотрудникам зоопарка потребовалось довольно много времени, чтобы справиться с ситуацией. Только после того, как животные успешно изнасиловали нескольких посетителей зоопарка, они были усмирены и, наконец, возвращены в свои вольеры.§!"
lv_colony_events.2.a: "Как ужасно!"

lv_colony_events.3.name: "Фута садисты"
lv_colony_events.3.desc: "§LУчитывая сравнительно большое количество садистов на §B[Root.GetName]§!, а также учитывая способность этих садистов изменять себя и других, неудивительно, что произошла массовая фута БДСМ оргия. Отчеты показывают, что большинство принявших участие сделали это добровольно, однако существует высокая вероятность того, что многих людей заставили или заставили принять участие, и им слишком стыдно сообщать об этом.§!"
lv_colony_events.3.a: "Жестоко но возбуждающе."

lv_colony_events.4.name: "Садисты веселятся"
lv_colony_events.4.desc: "§LУчитывая численность садистов на §B[Root.GetName]§!, неудивительно, что в нескольких населенных пунктах планеты произошла своего рода массовая БДСМ-оргия. Отчеты показывают, что большинство принявших участие сделали это добровольно, однако существует высокая вероятность того, что многих людей заставили или заставили принять участие, и им слишком стыдно сообщать об этом.§!"
lv_colony_events.4.a: "Жестоко но возбуждающе."
lv_colony_events.4.b: "Это противоречит ценностям нашего общества."

lv_colony_events.5.name: "Мазохисты веселятся"
lv_colony_events.5.desc: "§LУчитывая, что существует значительное число мазохистов на §B[Root.GetName]§!, не должно вызывать удивления, что время от времени можно увидеть одну или две БДСМ-вечеринки. Мазохисты привыкли связывать себя и друг друга и причинять себе боль. Любые садисты, которых они могли найти, были "завербованы", чтобы помочь им в их начинаниях.§!"
lv_colony_events.5.a: "Рад, что они наслаждаются жизнью."

lv_colony_events.9.name: "Похабные Титаны"
lv_colony_events.9.desc: "§LНаш губернатор на §B[Root.GetName]§! Сначала я не поверил поступающим сообщениям о титанических формах жизни, пытающихся спариться с нашими колонистами. Однако вскоре большое количество видео- и фотографических свидетельств не оставило никаких сомнений в том, что они действительно пытаются спариваться с нашими людьми. К счастью, только несколько наших самок были ранены во время этих попыток спаривания, и сами травмы были незначительными. Местное правительство все еще пытается определить, как лучше всего справиться с этой ситуацией.§!"
lv_colony_events.9.desc_phile: "§LНа планете §B[Root.GetName]§! Колонисты стали называть местных титанических форм жизни  "Сексуальными титанами" после того, как некоторые из них попытались спариться с добровольными колонистами. Те немногие женщины, которым посчастливилось принять участие в этом акте, утверждают, что Сексуальные Титаны - очень заботливые и нежные любовники, даже если их массивные фаллосы оказываются немного неудобными при введении.§!"
lv_colony_events.9.desc_phobe: "§LПервоначальные сообщения о похотливых титанических формах жизни на §B[Root.GetName]§! об изнасилование наших колонистов оказались правдой. К счастью, число изнасилований было довольно низким, хотя большое количество людей получили ранения либо во время инцидентов с изнасилованиями, либо во время бегства от этих хищных монстров. Ужасы, которые приходится терпеть нашим женщинам на планете, постоянный страх проникновения массивных фаллосов титанических форм жизни, ужасны. К сожалению, местные власти не знают, как справиться с этой ситуацией.§!"
lv_colony_events.9.a: "Мы ничего не можем с этим поделать."
lv_colony_events.9.b: "Похоже, у некоторых из наших людей были лучшие моменты в их жизни."
lv_colony_events.9.c: "Омерзительно!"

lv_colony_events.10.name: "Восхождение титанов"
lv_colony_events.10.desc: "§LОтчеты с §B[Root.GetName]§! указывают на то, что титанические формы жизни находят наших колонистов все более привлекательными партнерами. Почему так происходит, вызывает много споров; нам известно то что увеличилось число зарегистрированных "инцидентов", связанных с местной титанической жизнью . Правительство расколото между двумя вариантами,  решения этой проблемы: одни чиновники хотят ничего не делать, в то время как другие хотят уничтожить или, по крайней мере, сдержать титаническую жизнь. Независимо от их мнений по этому вопросу, все наши официальные лица  [Root.GetName] согласны, что они не знают, как справиться с этой проблемой.§!"
lv_colony_events.10.desc_phile: "§LОтчеты с §B[Root.GetName]§! указывают на то, что титанические формы жизни находят наших колонистов все более привлекательными партнерами. Почему так происходит, вызывает много споров; нам известно то что увеличилось число сообщений о сексуальных контактах с Секс-титанами. Многие из наших граждан поспешили присоединиться к "Клубу Титанов": люди, имевшие половой акт с Сексуальным Титаном, очень похожи на тех, кто в прошлые века пытался заняться сексом в самолёте.§!"
lv_colony_events.10.desc_phobe: "§LОтчеты с §B[Root.GetName]§! указывают на то, что титанические формы жизни находят наших колонистов все более привлекательными партнерами.  Почему так происходит, вызывает много споров; нам известно то что увеличилось число зарегистрированных изнасилованиq, связанные с участием местной титанической жизни. Многие наши женщины боятся покидать город или даже покидать свои дома. Чиновники местного правительства разработали план по сокращению количества титанических форм жизни на планете и последущей их переработке, чтобы накормить наших людей.§!"
lv_colony_events.10.a: "Пока мы ничего не будем делать."
lv_colony_events.10.b: "Мы любим Секс-титанов."
lv_colony_events.10.c: "Уберите этих мерзких тварей!"

lv_colony_events.11.name: "Похабные Титаны Содержаны"
lv_colony_events.11.desc: "§LНаши усилия по сдерживанию и предотвращению спаривания местных титанических форм жизни с нашими гражданами увенчались успехом.§!"
lv_colony_events.11.a: "Эти стейки великолепны на вкус!"
lv_colony_events.11.b: "Мы должны извлечь из этого все, что можем."

lv_colony_events.12.name: "Разъяренные Похабные Титаны"
lv_colony_events.12.desc: "§LНаши попытки сдержать местные титанические формы жизни оказались, мягко говоря, безуспешными. Даже сейчас наши местные силы обороны пытаются сдержать их, чтобы они не обрушили свой гнев на наших граждан.§!"
lv_colony_events.12.a_tooltip: "Титанические твари насилуют всех подряд!"

lv_colony_events.13.name: "Титанические перемены"
lv_colony_events.13.desc: "§LМы получили несколько тревожных сообщений с §B[Root.GetName]§!. Мы не уверены, почему и как, если уж на то пошло, но повторяющиеся половые сношения с титаническими формами жизни начали изменять наших женщин на генетическом уровне. Их половые органы начали приспосабливаться к невероятным размерам фаллоса титана. Не только это, но и некоторые местные ученые сообщают, что, если пройдет достаточно времени, генетические изменения позволят нашим самкам произвести на свет детенышей титанов. Они уверяют нас, что если мы будем действовать быстро, то сможем предотвратить это.§!"
lv_colony_events.13.desc_phile: "§LМы получили несколько восхитительных сообщений с §B[Root.GetName]§!. Мы не знаем точно, почему и как, если уж на то пошло, но повторяющиеся половые сношения с Титанами Секса начали изменять наших женщин на генетическом уровне. Их половые органы начали приспосабливаться к невероятным размерам фаллоса титана. Не только это, но и некоторые местные ученые сообщают, что, если пройдет достаточно времени, генетические изменения позволят нашим самкам произвести на свет детенышей титанов. Они уверяют нас, что если мы будем действовать быстро, то сможем предотвратить это, хотя зачем нам это делать?§!"
lv_colony_events.13.desc_phobe: "§LМы получили ужасающие новости с §B[Root.GetName]§!. Мы не знаем точно, как, но повторяющиеся изнасилования титаническими формами жизни начали изменять наших женщин на генетическом уровне. Их половые органы начали приспосабливаться к невероятным размерам фаллоса титана. Не только это, но и некоторые местные ученые сообщают, что, если пройдет достаточно времени, генетические изменения позволят нашим самкам произвести на свет детенышей титанов. Этим отвратительным существам больше нельзя позволять делать то, что им заблагорассудится!§!"
lv_colony_events.13.a: "Мы позволим природе идти своим чередом."
lv_colony_events.13.b: "Почему бы нам не позволить природе идти своим чередом?!"
lv_colony_events.13.c: "Мы должно положить этому конец."
lv_colony_events.13.d: "Нам нужно предотвратить скрещивание, чтобы сохранить этих удивительных существ."
lv_colony_events.13.e: "Надо прекратить это.СЕЙЧАС ЖЕ!."

lv_colony_events.14.name: "Титаническая эволюция"
lv_colony_events.14.desc: "§LКак и предсказывали наши ученые и врачи, колонисты с §B[Root.GetName]§! были навсегда изменены их продолжающимися сексуальными взаимодействиями с титаническими формами жизни. Только время покажет, к лучшему это или к худшему.§!"
lv_colony_events.14.desc_phile: "§LУдивительно! Сексуальные Титаны превратили наших колонистов в своих партнеров. Хотя изменения носят постоянный характер, наши ученые уверяют нас, что эти изменения к лучшему.§!"
lv_colony_events.14.desc_phobe: "§LНаши опасения сбылись. Титанические насильники изменили наших колонистов, чтобы они действительно были их парами. К счастью, дети этих несчастных пар не титаны, хотя нет никаких гарантий, что это не произойдет в будущем.§!"
lv_colony_events.14.a: "Что есть, то есть."
lv_colony_events.14.b: "Восхитительно!"
lv_colony_events.14.c: "Я думаю, что меня сейчас вырвет."

lv_colony_events.15.name: "Титаническое Веселье"
lv_colony_events.15.desc: "§LТитаны с §B[Root.GetName]§! продолжают вступать в половые сношения с нашими колонистами. Все вновь прибывшие в колонию почти наверняка были генетически изменены, чтобы удовлетворить потребности титанов.§!"
lv_colony_events.15.desc_phile: "§LСекс-титаны с §B[Root.GetName]§! продолжают вступать в половые сношения с нашими колонистами. Все вновь прибывшие в колонию почти наверняка претерпели те же удивительные изменения, что и наши предыдущие колонисты.§!"
lv_colony_events.15.desc_phobe: "§LОтвратительные хищные титаны продолжают насиловать наших колонистов на §B[Root.GetName]§!. Что еще хуже даже самым новым колонистам на планете изменили их тела против их воли!§!"
lv_colony_events.15.a: "Что есть, то есть."
lv_colony_events.15.b: "Звучит весело!"
lv_colony_events.15.c: "Омерзительно!."

lv_colony_events_1.1.name: "Похотливые растения"
lv_colony_events_1.1.desc: "§LМы знаем о формах жизни со щупальцами на §B[Root.GetName]§! в течение довольно долгого времени и смогли жить бок о бок с ними с момента основания нашей колонии. Конечно, иногда формы жизни похищали одну из наших самок, но эти случаи были довольно редкими и не оказывали большого влияния на колонию. Колонисты назвали их похотливыми растениями, хотя вопрос о том, являются ли эти формы жизни на самом деле растениями или нет, остается предметом споров.§!"

lv_colony_events_1.2.name: "Похотливые растения"
lv_colony_events_1.2.desc: "§LВ последнее время похотливые растения стали особенно агрессивными и начали похищать все большее количество женщин. Похищенные самки были найдены после того, как колония начала масштабные поисковые работы. Похотливые растения явно использовали женщин в репродуктивных целях и использовали их молоко для собственного питания. Интересно, что мы узнали, что похотливые растения делают планету более пригодной для жизни наших людей. Возможно, это попытка обмена с их стороны?§!"
lv_colony_events_1.2.a: "Нельзя допустить, чтобы это продолжалось."
lv_colony_events_1.2.b: "Если Похотливые Растения хотят заключить сделку, они ее заключат."
lv_colony_events_1.2.c: "Они похитили наших людей в последний раз."

lv_colony_events_1.3.name: "Аборигены с щупальцами"
lv_colony_events_1.3.desc: "§LМы знаем о формах жизни со щупальцами на §B[invasion_location.GetName]§! в течение довольно долгого времени и смогли жить бок о бок с ними с момента основания нашей колонии. Конечно, иногда некоторые из наших людей были похищены формами жизни, но эти случаи были довольно редкими и не оказали большого влияния на колонию.§!"

lv_colony_events_1.4.name: "Аборигены с щупальцами"
lv_colony_events_1.4.desc: "§LОднако что-то в нашем присутствии здесь, на планете, вызвало быстрые изменения в этих существах. Их уровень рождаемости взлетел до небес, и, хотя они далеки от разумных, наши ученые заметили заметный рост их интеллекта.§!"
lv_colony_events_1.4.a: "Занимательно."
lv_colony_events_1.4.b: "Наш народ полюбит своих примитивных соседей, их щупальца и все такое."
lv_colony_events_1.4.c: "Нам нужно убить как можно больше этих тварей с щупальцами."

lv_colony_events_1.5.name: "Фестиваль щупалец"
lv_colony_events_1.5.desc: "§LСнова пришло время праздновать и благодарить наших любимых Щупалец! По мере того, как начинаются общепланетные праздники, скоро состоится главное событие, где мы предлагаем наши тела и умы в качестве постоянных матерей-выводков, размножаемся и рождаем новые Щупальца в бесконечной оргии секса.\n\nХотя мы делаем это более чем охотно, наши любящие Щупальца вознаграждают нас за то, что мы такие хорошие домашние животные! Нашим лидерам решать, какую форму примут их благословения на этот раз.\n\n§ПРЕДУПРЕЖДЕНИЕ: при этом вы потеряете либо одно поселение, либо лидера.!§!§!"
lv_colony_events_1.5.a: "Благословение потомства"
lv_colony_events_1.5.a.tooltip: "§L§Y1§! Поселение становится постоянными матерями-выводка, и в обмен их первое потомство будет отправлено жить среди нас, добавляя §Y1§! Поселение щупалец!§!\n"
lv_colony_events_1.5.b: "Благословение цветения"
lv_colony_events_1.5.b.tooltip: "§L§Y1§! Поселение становится постоянными матерями-выводка, и в обмен, щупальца случайным образом преобразуют одну из наших физических черт, чтобы лучше удовлетворить их похотливые потребности в будущем!§!\n"
lv_colony_events_1.5.c: "Благословение разложения"
lv_colony_events_1.5.c.tooltip: "§L§Y1§! Поселение становится постоянными матерями-выводка, и в обмен, щупальца случайным образом изменят наше сознание, так что мы станем идеальными размножающимися шлюхами!§!\n"
lv_colony_events_1.5.d: "Благословение очищения"
lv_colony_events_1.5.d.tooltip: "§L§Y1§! Поселение становится постоянными матерями-выводка, и в обмен, Щупальца будут случайным образом исцелять наши тела и умы, удаляя нежелательные черты!§!\n"
lv_colony_events_1.5.e: "Благословение привязанности"
lv_colony_events_1.5.e.tooltip: "§LНаш нынешний правитель посвящает себя тому, чтобы стать Королевской матерью Выводка, навсегда покидая свое место. Щупальца имеют почти первобытную природу, но они также очень умны. Они признают и жаждут наших лидеров, чтобы доминировать и ломать их умы. Во время так называемой церемонии оргии только для посвященных симбиоты-щупальца случайным образом присоединяются к некоторым из участвующих будущих лидеров!§!\n"
lv_colony_events_1.5.f: "Можно ненадо..."

lv_colony_events_1.6.name: "Лидеры Получают Симбиотов С Щупальцами"
lv_colony_events_1.6.desc: "§LОргия началась! Проворные, скользкие маленькие существа с щупальцами проникают в своего хозяина через любые отверстия, в которые они могут пролезть, не причиняя вреда своим новым любовникам. Некоторые симбионты даже ведут территориальные споры из-за хозяина, который им особенно нравится, пытаясь показать хозяину, кто из них может сексуально удовлетворить их больше. Эти симбиоты, однажды довольные своими новыми мягкими домами, со временем начнут улучшать своих хозяев как умственно, так и физически.!§!"
lv_colony_events_1.6.a: "Они такие милые!"

lv_colony_war_events.1.name: "Военные трофеи"
lv_colony_war_events.1.desc: "§LНаши солдаты победили! Даже сейчас последние остатки вооруженного сопротивления на §B[lv_attacked_planet.GetName]§! за ним охотятся. Наши войска в основном ведут себя хорошо, но такова природа солдат и конфликтов, некоторые пользуются своей новообретенной властью над местными жителями.§!"
lv_colony_war_events.1.a: "Такова природа войны."
lv_colony_war_events.1.b: "Победитель получает все."
lv_colony_war_events.1.c: "Накажите отвественных за это."

lv_colony_war_events.2.name: "Военные трофеи"
lv_colony_war_events.2.desc: "§LНаши солдаты потерпели поражение! Даже сейчас последние остатки вооруженного сопротивления на §B[lv_attacked_planet.GetName]§! за ним охотится враг. Женщины наших вооруженных сил даже сейчас получают очень интимный урок о значении словосочетания 'военные трофеи'..§!"
lv_colony_war_events.2.a: "Такова природа войны."
lv_colony_war_events.2.b: "Вот почему тмы сражаемся до последнего."
lv_colony_war_events.2.c: "Мы получили наглядный урок о зле войны."

##########################
###     Pop Events     ###
##########################

lv_pop_events.1.name: "Инвазивное Размножение"
lv_pop_events.1.desc: "§LЧерез некоторое время наше население из §Y[lv_aggressively_sexing_pop.GetSpeciesName]§! оплодотворил достаточное количество самок других местных видов, чтобы вызвать резкое изменение местной демографии.§!"
lv_pop_events.1.a: "Вот как мы эволюционировали."
lv_pop_events.1.b: "Возможно, нам придется остановить это... или нет."
lv_pop_events.1.c: "Не показывайте это снова."
lv_pop_events.1.c.tooltip: "Это скроет всплывающие окна для этого события. Перейдите на страницу параметров Lustful Void на вкладке Edicts, чтобы снова включить их отображение."
lv_pop_events.1.d: "Отключите эти события."
lv_pop_events.1.d.tooltip: "Это остановит это событие. Перейдите на страницу параметров Lustful Void на вкладке Edicts, чтобы снова запустить эти события."

lv_pop_events.3.name: "Паразитическое размножение"
lv_pop_events.3.desc: "§LНаше население §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! оплодотворяет самок §B[Root.GetName]§! со своим паразитическим потомством в планетарном масштабе, вызывая быстрый рост численности их видов и сокращение числа хозяев.§!"
lv_pop_events.3.a: "Мы всегда можем найти больше утроб."
lv_pop_events.3.b: "Вся галактика подчинится нам."
lv_pop_events.3.c: "Используйте наше население, чтобы заразить еще больше утроб!"
lv_pop_events.3.d: "Стать живым инкубатором ОБЯЗАТЕЛЬНО!"
lv_pop_events.3.e: "Приказать §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! пощадить их утробы..."
lv_pop_events.3.f: "§RПоместите наши яйца в каждое их отверстие!§!"

lv_pop_events.5.name: "Сексуальное завоевание"
lv_pop_events.5.desc: "§LНаше население §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! продолжает использовать представителей других рас в качестве инкубаторов для своих детенышей. Это привело к снижению количества местных жителей на §B[Root.GetName]§! достигнув критической точки. В то время как последние самки §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! забеременеют против своей воли, остатки их цивилизации «наслаждаются» своими последними днями на этой планете.§!"
lv_pop_events.5.a: "Как и должно быть."
lv_pop_events.5.b: "Еще одна победа нашей расы."
lv_pop_events.5.c: "Их тела всегда принадлежали нам"
lv_pop_events.5.d: "По крайней мере, эта ксено-мразь нам пригодилась"
lv_pop_events.5.e: "Это было здорово. Давайте сделаем это снова!"
lv_pop_events.5.f: "Через рабство они возвысились."
lv_pop_events.5.g: "Дайте им немного времени, чтобы вырастить собственное потомство."

lv_pop_events.6.name: "Сексуальное завоевание"
lv_pop_events.6.desc: "§LЧисла §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! достигли критической точки, так как последние остатки их женского населения на §B[Root.GetName]§! используются нашим населением §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§!, добровольно или нет.§!"

lv_pop_events.7.name: "Контролируемое размножение паразитов"
lv_pop_events.7.desc: "§LНаше население §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! оплодотворяет самок §B[Root.GetName]§! со своим паразитическим потомством, вызывая умеренный рост численности их видов, сохраняя при этом количество хозяев под контролем.§!"
lv_pop_events.7.a: "Разводите тех, кто этого хочет."
lv_pop_events.7.b: "Лучшие виды заслуживают своих самок."
lv_pop_events.7.c: "Используйте осужденных в качестве размножающихся шлюх."
lv_pop_events.7.d: "Допустить некоторые нарушения в процедурах контроля."
lv_pop_events.7.e: "Повысить эффективность контроля размножения"

lv_pop_events.8.name: "Контролируемое инвазивное разведение"
lv_pop_events.8.desc: "§LЧерез некоторое время наша популяция §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! оплодотворила достаточно самок §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! чтобы вызвать умеренные изменения в демографии на §B[Root.GetName]§.§!"
lv_pop_events.8.a: "Попробуем их не истребить."
lv_pop_events.8.b: "Ну, если они хотят быть разведенными нами..."
lv_pop_events.8.c: "Использовать осужденных для принудительного оплодотворения."
lv_pop_events.8.d: "Допускать нарушения в процедурах контроля."
lv_pop_events.8.e: "Повысить эффективность контроля размножения"

lv_pop_events.9.name: "Наши граждане нарушены"
lv_pop_events.9.desc: "§LСоответствующие отчеты исходят от планетарного губернатора §B[Root.GetName]§!. Местное население §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! использует наших ксено-граждан как средство для вынашивания собственных детей, что часто приводит к потере фертильности или даже к смерти матери инопланетного ребенка. Это вызывает заметный сдвиг в популяции, увеличивая количество §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! и уменьшающееся количество §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§!§!"
lv_pop_events.9.a: "Мы ничего не можем с этим поделать"
lv_pop_events.9.b: "Звучит не так уж плохо..."
lv_pop_events.9.c: "Просто позвольте им делать все, что они хотят"
lv_pop_events.9.d: "Увеличьте присутствие силовиков, чтобы держать ситуацию под контролем"

lv_pop_events.10.name: "Сексуальное завоевание"
lv_pop_events.10.desc: "§LКак и наше население на планете §B[Root.GetName]§! продолжает использоваться §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! в качестве размножающихся шлюх, наша численность сократилась до точки невозврата. Остатки нашей расы все еще пытаются противостоять сексуальным завоеваниям §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§!, но без нашей помощи они обречены..§!"
lv_pop_events.10.a: "Мы не можем им помочь."
lv_pop_events.10.b: "это ужасно!"
lv_pop_events.10.c: "В этом есть что-то горячее..."
lv_pop_events.10.d: "Ввести военное положение и посадить виновных в тюрьму!"

lv_pop_events.11.name: "Потребность в разведении"
lv_pop_events.11.desc: "§LНаш вид жил в мире, где сосуществовали многие разумные расы. Из-за некоторых странных мутаций наши предки эволюционировали таким образом, что позволили нам размножаться со всем, что обладает репродуктивной системой, хоть чем-то похожей на нашу. У представителей нашего вида было много способов привлечь желающих самок других рас и достаточно сил, чтобы трахать противных против их воли. Однако, хотя это было благословением для нашей расы, предотвращая войны между собой, у него была и обратная сторона — нам всегда нужно было иметь кого-то, кто удовлетворял бы наши сексуальные потребности. А поскольку получающееся потомство всегда принадлежало нашей расе, мы со временем сократили численность других рас до такой степени, что они больше не могли сопротивляться нашим достижениям. Оставшиеся использовались как живые секс-игрушки, пока не вымерли полностью. Это вызвало массовые волнения сексуально неудовлетворенных мирных жителей и заставило наши власти вкладывать средства в космическую программу в надежде найти инопланетян для дальнейшего использования..§!"
lv_pop_events.11.a: "Мы найдем несколько самок для размножения среди звезд!"
lv_pop_events.11.b: "Мы найдем размножающихся шлюх для изнасилования среди звезд!"

######################
###     Crime      ###
######################

lv_crime_events.1.name: "Исчезновения"
lv_crime_events.1.desc: "§LПоступали сообщения о гражданах, пропавших без вести на §B[Root.GetName]§!. Хотя регулярные пропажи людей являются обычным явлением в любом обществе, в последнее время, похоже, их число увеличилось. Граждане массово пропадают без вести, и наши правоохранительные органы считают, что существует связь с ростом уровня преступности. Пока мы не сможем снизить этот уровень преступности, может пройти много времени, прежде чем мы сможем найти этих бедняг..§!"
lv_crime_events.1.a: "Мы ничего не можем поделать..."

lv_crime_events.2.name: "Силовики Атакованы!"
lv_crime_events.2.desc: "§LВо время обычного патрулирования группа наших сотрудников правоохранительных органов подверглась нападению и ограблению на §B[Root.GetName]§!. Нападение пошатнуло веру нашего народа в правительство, и нам нужно найти способ взять ситуацию под контроль, пока она не вышла из-под контроля.§!"
lv_crime_events.2.a: "Немедленно найдите всех подозреваемых!"

lv_crime_events.3.name: "Полицейский Патруль Изнасилован!"
lv_crime_events.3.desc: "§LНаши сотрудники правоохранительных органов снова попали в засаду, но на этот раз нападавшие забрали не только их снаряжение. Представители общественности просто наблюдали, как наших силовиков раздевали и насиловали на публике, а затем оставляли связанными их собственным снаряжением. Эта демонстрация силы сильно поколебала веру людей в наше правление.§!"
lv_crime_events.3.a: "Нам нужно разобраться с этим, быстро."

lv_crime_events.4.name: "Штаб силовиков разграбили!"
lv_crime_events.4.desc: "§LПохоже, что преступники на §B[Root.GetName]§! мы не просто довольствовались тем, что высмеивали наши правоохранительные органы. Сегодня рано утром члены этой банды совершили нападение на штаб-квартиру силовиков. Это был спланированный и организованный рейд, который должен был произойти только тогда, когда персонал либо ушел, либо устал после дежурства. После этого успешного нападения члены банды решили втереться в доверие, устроив трехдневную вечеринку в штаб-квартире. СМИ распространили видео, в котором эти члены банды в форме силовиков насилуют и пытают наших силовиков в тюрьме штаб-квартиры, которая была освобождена от преступников и заполнена силовиками, которых члены банды не взяли с собой после вечеринки.§!"
lv_crime_events.4.a: "Нет слов..."

lv_crime_events.5.name: "Повторное появление"
lv_crime_events.5.desc: "§LСиловики, которых забрали из нашей штаб-квартиры на §B[Root.GetName]§! появились вновь, но уже не на службе у правительства. Эти шлюхи ходят по улицам и соблюдают закон банды, а не администрации. Кроме того, они носят фетишизированную униформу и позволяют членам банды оскорблять и унижать их по своей прихоти, терроризируя местных жителей. Эти трофеи будут возвращены со временем и возвращены их семьям, но пока они не более чем игрушки и инструменты для преступников, с которыми мы пытаемся бороться..§!"
lv_crime_events.5.a: "Живо поймайте их."

########################
###     Country      ###
########################

lv_country_events.2.name: "Межзвездный обмен"
lv_country_events.2.desc: "§LДо нашего сведения дошло, что несколько предприятий начали обслуживать ксеносов. Что нам делать?§!"
lv_country_events.2.a: "Обложите их налогом, как и любой другой бизнес."		
lv_country_events.2.b: "Ксенобизнесмены?! Классно! Давайте обложим налогом бизнес." 
lv_country_events.2.c: "Отвратительно! Разрушьте эти предприятия и продайте их активы!"
lv_country_events.2.d: "Казните всех, кто в этом замешан. Отвратительным ксеносам нет места в нашей империи."
lv_country_events.2.e: "Отличная инвестиционная возможность!"

lv_country_events.3.name: "Роботы-насильники"
lv_country_events.3.desc: "§LГубернаторы нескольких наших городов сообщили о тревожной тенденции. Молодые женщины подвергались нападениям со стороны различных типов роботов. Некоторые из этих роботов были простыми гуманоидами и небольшими моделями размером с домашних животных, но несколько задействованных дроидов были крупными промышленными моделями. Излишне говорить, что это вызывает большую озабоченность. Мы считаем, что эти атаки никак не связаны между собой и представляют собой просто случайный набор ошибочных программ, хакеров и редкие случаи проявления искусственного интеллекта.§!"
lv_country_events.3.a: "Расследуйте этот вопрос и попросите нашу пиар-команду заняться этим вопросом."
lv_country_events.3.b: "Давайте узнаем, что мы можем извлечь из этих атак."
lv_country_events.3.c: "Эти машины - чума для нашего общества!"
lv_country_events.3.d: "Мы поймаем всех, кто стоит за этими нападениями."

# Military Gangbang
lv_country_events.4.name: "Модуль Развлекательных Вечеринок"
lv_country_events.4.desc: "§LЭти так называемые "вечеринки для отдыха в подразделениях" стали довольно распространенным явлением в наших вооруженных силах. У каждого взвода, корабля или авиакрыла есть своя версия, но, как правило, на этих вечеринках группа высших чинов занимается принудительным групповым сексом с одним или несколькими новобранцами. Некоторые из наших военачальников утверждают, что это просто способ выпустить пар для войск, хотя другие предупреждают, что позже это может вызвать проблемы с дисциплиной.§!"
lv_country_events.4.a: "Для тебя это жизнь в армии."
lv_country_events.4.b: "Найдите нескольких вовлеченных офицеров и сделайте из них пример."
lv_country_events.4.c: "Войны и армии - корень всего зла."
lv_country_events.4.d: "Наши солдаты предлагают свои тела своей стране и лидерам."
lv_country_events.4.e: "Солдаты не должны относиться к своим товарищам как к куску мяса."
lv_country_events.4.f: "Давайте изучим этот увлекательный кусочек военной культуры!"

lv_country_events.5.name: "Насильники военнопленных наказаны"
lv_country_events.5.desc: "§LМы ожидаем лучшего от наших солдат. Те, кто стоял за изнасилованием захваченных в плен солдат или гражданских лиц, понесли соответствующее наказание. На этом мы не остановились. Те, кто знал об этих ужасных деяниях и ничего не сделал, также были соответственно наказаны. Мы знаем, что со временем это снова станет проблемой, но в обозримом будущем наши солдаты будут вести себя очень хорошо..§!"
lv_country_events.5.a: "Хорошо"
lv_country_events.5.b: "Мы ожидали лучшего от наших войск."
lv_country_events.5.c: "Мы выше этого."

lv_country_events.6.name: "Фестиваль любви"
lv_country_events.6.desc: "§LБольшая часть наших граждан начала участвовать в том, что они называют "Фестивалем любви". Кажется, существует много различных определений того, что на самом деле представляет собой "Праздник любви", но, насколько мы можем установить, он включает в себя большие группы людей, предающихся половым сношениям в течение дня и, как правило, проявляющих доброту друг к другу.§!"
lv_country_events.6.a: "Все что угодно ради их счастья."
lv_country_events.6.b: "Настоящий праздник любви!"
lv_country_events.6.c: "Это прекрасная возможность инвестировать в рынок контрацепции!"
lv_country_events.6.d: "Неприемлемо! Немедленно запретите этот фестиваль!"
lv_country_events.6.e: "Мы не поддерживаем такого рода фестивали."

lv_country_events.7.name: "Восхождение футанари"
lv_country_events.7.desc: "§LСпособность изменять наши гены вызывает рябь в самом обществе. "Фута", женщины с мужскими гениталиями, сейчас начинают появляться в нашем обществе. Только время покажет, каковы будут долгосрочные последствия этого.§!"
lv_country_events.7.a: "Люди странные."
lv_country_events.7.b: "Это еще больше распространит нашу любовь."
lv_country_events.7.c: "Странно, но очень интересно."
lv_country_events.7.d: "Мы должны объединиться против этих мерзких изменений."
lv_country_events.7.e: "Наконец-то Равенство!"
lv_country_events.7.f: "Это незаконная генетическая модификация! Запретите эту практику."
lv_country_events.7.g: "Мы не допускаем такого рода генетических модификаций."

lv_country_events.8.name: "Наука ушла не туда"
lv_country_events.8.desc: "§LЧто-то пошло ужасно неправильно на одном из наших сверхсекретных научных объектов. Несколько систем сдерживания объектов вышли из строя, что позволило существам, над которыми проводились эксперименты, вырваться наружу. Многие ученые были убиты, в то время как другие использовались для удовлетворения сексуальных потребностей существ. Повторно. Хорошая новость заключается в том, что мы действительно кое-чему научились из этого события. К сожалению, похоже, что некоторые сущности сбежали в близлежащие районы, так что это может вызвать у нас дополнительные проблемы позже.§!"
lv_country_events.8.a: "Могло быть хуже."
lv_country_events.8.b: "Это выставляет нас в плохом свете."
lv_country_events.8.c: "Мы извлечем из этого все, что сможем."

lv_country_events.9.name: "Нелегальные Секс-Роботы"
lv_country_events.9.desc: "§LВ связи с полицейским расследованием, касающимся некоторых украденных деталей роботов, на заброшенном складе было обнаружено несколько незарегистрированных роботов. По прибытии офицеры подверглись нападению со стороны того, что они назвали "сексуально одержимыми" роботами.\n\nК счастью, за исключением того, что некоторые офицеры, по сообщениям, необъяснимо устали после вмешательства, нашим полицейским силам удалось обезвредить их без каких-либо серьезных инцидентов. После тщательного расследования эти секс-боты, похоже, были сильно модифицированы, чтобы походить на гуманоидных женщин. Они также перепрограммированы так, чтобы их привлекали фаллические формы и доставляли сексуальное удовольствие их владельцам.\n\nОднако нам еще предстоит выяснить, кто несет ответственность за создание этих роботов.§!"
lv_country_events.9.a: "Зарегистрируйте модифицированных роботов и позвольте им интегрироваться в наше общество."
lv_country_events.9.b: "Удалите изменения и перепрограммируйте их в соответствии с нашими стандартами."
lv_country_events.9.c: "Демонтируйте роботов и верните украденные детали."
lv_country_events.9.d: "Очаровательно! Мы должны попытаться перепроектировать одного из них."
lv_country_events.9.e: "Неприемлемо! Искорените эту роботизированную мерзость!"
lv_country_events.9.f: "Похоже, мы ликвидировали роботизированную сеть проституции!"

lv_country_events.11.name: "Клиенты ксеносы"
lv_country_events.11.desc: "§LПроститутки нашей страны нашли открытый рынок в §Y[event_target:lv_neighbour_target.GetName]§!и воспользовались этим в полной мере. Было много туристов из  §Y[event_target:lv_neighbour_target.GetName]§! нанимать наших проституток, находясь в наших мирах. Независимо от того, где именно происходит бизнес, ясно одно: мы наблюдаем увеличение налоговых поступлений!§!"
lv_country_events.11.a: "Хорошо."
lv_country_events.11.b: "Замечательно!"
lv_country_events.11.c: "Это закончится сейчас."
lv_country_events.11.d: "Естественно, что люди с более низким воспитанием будут участвовать в этих действиях."
lv_country_events.11.e: "Именно поэтому мы используем наших рабынь для проституции."

lv_country_events.12.name: "За Деньги Можно Купить Счастье"
lv_country_events.12.desc: "§LВ последнее время мы наблюдаем приток проституток из §Y[event_target:neighbour_target.GetName]§! промышляют своей торговлей в наших городах. Это увеличение числа работников секс-индустрии увеличило счастье населения в целом, но привело к тому, что часть нашего богатства перекачивается на §Y[event_target:neighbor_target.GetName]§!§!."
lv_country_events.12.a: "Хорошо."
lv_country_events.12.b: "Пресечь этот незаконный акт!"

######################
###     Leader     ###
######################

lv_leader_events.101.name: "Зависимость от костюма для удовольствий"
lv_leader_events.101.desc: "§L§E[event_target:lv_suit_slut.GetName]§! безнадежно пристрастился к удовольствиям ношения костюма удовольствий и больше не может без него жить. Его постоянное состояние возбуждения начало сказываться на их способностях.§!"
lv_leader_events.101.a: "По крайней мере, он счастлив."

lv_leader_events.103.name: "Восстановление зависимости от костюма для удовольствий"
lv_leader_events.103.desc: "§L§E[event_target:lv_suit_slut.GetName]§! ему удалось преодолеть свою зависимость от костюма для удовольствий, и он снова могжет нормально функционировать, хотя его тело никогда по-настоящему не забудет это ощущение.§!"

lv_leader_events.105.name: "Костюмы удовольствий запрещены"
lv_leader_events.105.desc: "§LЗнаменательный день! С запретом костюмов для развлечений, вызывающих привыкание, все наши лидеры публично отказались от своих личных костюмов, которые должны уберечь их от опасностей зависимости от костюмов, по крайней мере на данный момент. Нашему населению может потребоваться некоторое время, чтобы привыкнуть к отсутствию.§!"
lv_leader_events.105.a.tooltip: "§LЗависимые лидеры теряют §YЗависимость от косюмов удовольствий§! и получают §YСнятие костюма удовольствий§!. Они также получают §Y1§! уровень.\n\nВсе планеты, находящиеся в собственности, получают §YСнятие костюма удовольствий§! в качестве модификатора на 6 месяцев.§!"

############################
###     Neuter Purge     ###
############################

lv_neuter_purge_event.1.name: "Нежелательные с выгодой"
lv_neuter_purge_event.1.desc: "§LНаша политика стерилизации [PREV.FROMFROM.GetName] люди пришли с некоторыми непреднамеренными, но очень желательными последствиями. По какой бы то ни было причине, хотели ли они оставить после себя какое-то потомство или надеялись получить благосклонность от наших лояльных граждан, многие из [PREV.FROMFROM.GetName] не только общались с нашими гражданами, но и предлагали родить их потомство.§!"
lv_neuter_purge_event.1.a: "Мне почти жаль, что они теперь ушли."

lv_neuter_purge_event.2.name: "Детские печи"
lv_neuter_purge_event.2.desc: "§LС помощью гормонов, генной терапии, мощных афродизиаков, искусственного оплодотворения и строгого соблюдения обязательного полового акта с лояльными гражданами нам удалось привлечь большое количество нежелательных лиц. [PREV.THIS.GetName] в "детские печи", обнажая детенышей не их собственного вида, а лояльных граждан..§!" 
lv_neuter_purge_event.2.a: "Они выполнили свою задачу."

#########################################
###     Special Research Projects     ###
#########################################

LV_RAUNCHY_TITANIC_LIFE_REMOVAL_MEAN: "Титанический Сбор Урожая"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_MEAN_DESC: "Сдерживая и используя их в качестве домашнего скота, мы можем предотвратить появление титанических форм жизни на [Root.GetName] и их попытки спариваться с нашими гражданами."

LV_RAUNCHY_TITANIC_LIFE_REMOVAL: "Изоляция титанов"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_DESC: "Изолируя их в заповедниках, мы можем предотвратить появление титанических форм жизни на [Root.GetName] и их попытки спариваться с нашими гражданами."

LV_RAUNCHY_TITANIC_LIFE_REMOVAL_NICE: "Сохранение титанов"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_NICE_DESC: "Приняв новые законы, ограничивающие общение с ними, мы сможем сохранить титанические формы жизни на [Root.GetName]."

LV_RESCUE_CAPTURED_CREW_MEMBERS: "Спасите Захваченных Женщин"
LV_RESCUE_CAPTURED_CREW_MEMBERS_DESC: "Мы разработали план по спасению ваших похищенных членов экипажа и готовы приступить к нему как можно скорее."

lv_hidden_flesh_pit.3.name: "Яма с щупальцими:успех"
lv_hidden_flesh_pit.3.desc: "§LНам удалось вернуть женщин с минимальными трудностями. Тем не менее, мы нанесли некоторый ущерб формам жизни, и в результате то, что мы можем узнать о них, уменьшается.§!"
lv_hidden_flesh_pit.4.name: "Яма с щупальцими:успешно"
lv_hidden_flesh_pit.4.desc: "§LНаш план по спасению членов экипажа удался на славу! Мы не встретили никакого сопротивления со стороны форм жизни, и нам не пришлось использовать более жестокие методы, чтобы вернуть женщин. Огромное количество биологических исследований может быть получено от этих пассивных, но похотливых организмов.§!"
lv_hidden_flesh_pit.5.name: "Яма с щупальцими:провал"
lv_hidden_flesh_pit.5.desc: "§LНесмотря на все наши усилия, нам не только не удалось спасти наш первоначальный экипаж, но и еще больше людей было захвачено в плен. Видеозаписи от нашей спасательной команды все еще поступают, и на них видно, как женщин насилуют и используют для размножения. Хотя больше никаких попыток спасения не рассматривается, мы надеемся, что с помощью этих видеопотоков еще можно что-то извлечь из этой полной неудачи.§!"

LV_EXTRACT_ROGUE_SEXY_SCIENTIST: "Извлечение Ученого-мошенника"
LV_EXTRACT_ROGUE_SEXY_SCIENTIST_DESC: "Один из наших ученых сошел с ума, и туземцы поклоняются ему как богу на [From.GetName]. Должна быть начата операция по их удалению - при необходимости с применением силы."

LV_EXTRACT_ENSLAVED_SCIENTISTS: "Извлеките порабощенных ученых"
LV_EXTRACT_ENSLAVED_SCIENTISTS_DESC: "Несколько наших ученых были порабощены туземцами на [From.GetName]. Необходимо начать операцию по их спасению, прежде чем туземцы успешно рамножат их."

LV_SEXY_MODIFICATION_PROJECT: "Сексуальная Модификация"
LV_SEXY_MODIFICATION_PROJECT_DESC: "С помощью комбинации селективных вирусов, генной инженерии и хирургии мы изменим местных жителей [From.GetName] чтобы лучше соответствовать нашим стандартам красоты."

######################
###     Relics     ###
######################

lv_relic_events.11.name: "Ритуал с золотым жезлом"
lv_relic_events.11.desc: "§LМы подготовили '§YЗолотой жезл§!' для ритуала и теперь должны решить, что с ним делать.\n\nПозволим ли мы одному из наших лидеров насадить себя на жезл? Или мы должны сделать его общедоступным на ограниченное время на планете, чтобы каждый мог его использовать??§!"
lv_relic_events.11.a.name: "Позволить одному из наших лидеров попасть на кол."
lv_relic_events.11.a.tooltip: "Случайный лидер получит черту §Лошадиный пенис§!."
lv_relic_events.11.b.name: "Подготовьте §YЗолотой жезл§! для отправки на планету."
lv_relic_events.11.b.tooltip: "Позволяет принять решение на одной планете преобразовать все население. Когда закончите, все народы на этой планете получат черту §EЛошадиный пенис§! ."

lv_relic_events.21.name: "Многообещающее предложение"
lv_relic_events.21.desc: "§LБонни, ученый, замешанный в «инциденте с храмом» во время одного из наших последних раскопок, стал настоящей знаменитостью. Многие люди очарованы тем, что с ней произошло, и наносят ей очень «личные» визиты.\n\nМы не можем игнорировать научный аспект этого. Многие в научном сообществе хотели бы узнать больше о том, что с ней случилось и как она работает. Все больше людей соглашаются с тем, что ей следует предоставить должность главного научного сотрудника, чтобы она могла тесно сотрудничать с другими, чтобы узнать больше об этой тайне и о том, как «§YЗолотой жезл§!» работает.\n\nДругая небольшая группа ученых категорически не согласна. Они называют все это большой ошибкой и скорее забудут об этом инциденте, чем предаются еще одному «вырождению»..§!"
lv_relic_events.21.a: "Конечно. Немедленно дайте ей место!"
lv_relic_events.21.a.tooltip: "§LПолучите Бонни, ученого 5-го уровня..§!"
lv_relic_events.21.b: "Это вырождение должно закончиться сейчас."

lv_relic_events.22.name: "Храм открыт!"
lv_relic_events.22.desc: "§LПосле небольшой реставрации и очистки Храм §YЗолотого Жезла§! наконец был открыт для публики. Ученые со всей империи стремятся изучить его, в то время как население в целом, кажется, очаровано трансформацией, которую претерпел археолог во время его открытия.\n\nМы должны ожидать увеличения результатов исследований и туризма в этом месте.!§!"
lv_relic_events.22.a: "Отлично!"
lv_relic_events.22.a.tooltip: "Скоро все §H$job_lv_rod_temple_initiate_plural$§! на планете пройдет церемония и вырастет §EКонский пенис§!!\n\nЦеремония будет проходить каждые §B5 лет§!."

MESSAGE_LV_HORSIFICATION_POPS_HORSIFIED_TITLE: "Церемония вручения золотого жезла завершена"
MESSAGE_LV_HORSIFICATION_POPS_HORSIFIED: "$VALUE|Y$ £pops£ Поселения на $PLANET|Y$ завершили церемонию в §Храме Золотого Жезла§!"

