# Decisions #
#############

decision_planet_lv_breeding_planet: "Направленность на размножение - Долгосрочная"
decision_planet_lv_breeding_planet_desc: "Поощряйте население этого мира уделять приоритетное внимание зачатию потомства в течение длительного периода, увеличивая прирост населения за счет других областей в течение 12 лет."

decision_planet_lv_breeding_frenzy: "Фокус на размножении"
decision_planet_lv_breeding_frenzy_desc: "Сосредоточьте эту планету на размножении, сделав главным приоритетом этой планеты выкачивание как можно большего количества потомства в течение 6 лет.."

decision_planet_lv_fuck_fest: "Безумное размножение"
decision_planet_lv_fuck_fest_desc: "Позвольте вашим людям быть полностью поглощенными своими сексуальными желаниями в течение 3 лет!"

decision_planet_lv_breeding_planet_hive: "Фокусировка на размножении - Долгосрочная"
decision_planet_lv_breeding_planet_hive_desc: "Спровоцировать дронов этого мира уделять приоритетное внимание зачатию потомства на длительный период, увеличивая прирост населения за счет других сфер деятельности в течение 12 лет."

decision_planet_lv_breeding_frenzy_hive: "Фокусировка на размножении"
decision_planet_lv_breeding_frenzy_hive_desc: "Сосредоточьте эту планету на размножении, сделав главным приоритетом этой планеты получение как можно большего количества потомства в течение 6 лет."

decision_planet_lv_fuck_fest_hive: "Безумное размножение"
decision_planet_lv_fuck_fest_hive_desc: "Заставьте своих дронов быть полностью поглощенными похотью в течение 3 лет!"

decision_planet_lv_public_exhibitionism: "Публичный эксгибиционизм"
decision_planet_lv_public_exhibitionism_desc: "Поощряйте население этого мира демонстрировать публичный эксгибиционизм в течение 5 лет, повышая общественное мнение населения, а также вызывая всплеск потомства.."

decision_planet_lv_tentacles_festival: "Фестиваль щупалец"
decision_planet_lv_tentacles_festival_desc: "Начинается общепланетный фестиваль, посвященный нашим любимым Щупальцам!"
decision_planet_lv_tentacles_festival_custom: "Открывает меню фестиваля."

decision_planet_lv_suit_law: "Принудительные костюмы удовольствий"
decision_planet_lv_suit_law_desc: "Заперев все население планеты в костюмах удовольствий с дистанционным управлением, они станут слишком рассеянными, чтобы сопротивляться нашему правлению!"

decision_planet_lv_end_suit_law: "Прекратить принудительные костюмы удовольствий"
decision_planet_lv_end_suit_law_desc: "Освободите население от костюмов, позволив жизни вернуться в нормальное русло, как только они снова смогут ходить прямо."

# Mono Gender Conversion #

decision_planet_lv_mono_gender_conversion: "Моногендерная конверсия"
decision_planet_lv_mono_gender_conversion_desc: "Теперь, когда у нас есть технология, позволяющая полностью изменить пол человека, мы можем распространять наркотики воздушно-капельным путем по всей планете, чтобы изменить население в соответствии с нашими потребностями!"
decision_mono_gender_conversion_custom: "Открывает меню преобразования."

# Milking World #

decision_planet_lv_milking_world: "Превратите планету в дойный мир"
decision_planet_lv_milking_world_desc: "Молочные миры - это планеты, вся инфраструктура которых построена вокруг молочного животноводства, отбрасывая любые другие сферы экономики."

decision_planet_lv_no_milking_world: "Удалить Мир доения"
decision_planet_lv_no_milking_world_desc: "Этот Мир доения для нас бесполезен. Любая другая область экономики сейчас имеет большее значение."

# Breeding World #

decision_planet_lv_breeding_world: "Превратите планету в мир размножения"
decision_planet_lv_breeding_world_desc: "Миры размножения - это планеты, вся инфраструктура которых построена вокруг разведения, отбрасывая любые другие сферы экономики."

decision_planet_lv_no_breeding_world: "Удалить мир размножения"
decision_planet_lv_no_breeding_world_desc: "Этот Мир размножения бесполезен для нас. Любая другая область экономики сейчас имеет большее значение."

# Sexopolis #

decision_planet_lv_sex_supply: "Встроенный процессор Обработки жидкостей"
decision_planet_lv_sex_supply_desc: "Начинается строительство жидкостного процессора."
decision_planet_lv_sex_supply_effects: "добовляет $d_lv_sex_supply$ на [Root.GetName]."

decision_planet_lv_sworld_project: "Проект "Сексополис""
decision_planet_lv_sworld_project_desc: "Каждый дюйм этой планеты будет покрыт разросшимися городами, предназначенными для удовольствия наших граждан."
decision_planet_lv_sworld_project_requirements: "£trigger_no£ §RВсе районные слоты на планете должны быть заполнены§! §Y$district_city_plural$§! §Ror their equivalent§!"
decision_planet_lv_sworld_project_effects: "Превращает [Root.GetName] в §Y$pc_lv_sworld$§!."

decision_planet_lv_sworld_project_srelic: "Восстановить Сексополис"
decision_planet_lv_sworld_project_srelic_desc: "Каждый дюйм этой планеты когда-то был покрыт разросшимися городами, предназначенными для удовольствия ее граждан, и так будет снова."
decision_lv_sworld_project_effects: "Превращает планету в §Y$pc_lv_sworld$§!, увеличивая £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YPop Growth§!, и разблокировка специальных £district£ §YSexopolis Districts§! за счет природных ресурсов планеты, становящихся §Rinaccessible§!, предотвращение любого дальнейшего строительства £district£ §YGenerator§!, §YMining§! и §YAgriculture Districts§!."
decision_lv_sworld_project_effects_short: "Увеличивает £housing£ §Y$PLANET_HOUSING_TITLE$§! и §YPop Growth§!\nРазблокирует £district£ §YSexopolis Districts§!\nОтключает построение £district£ §YGenerator§!, §YMining§! и §YAgriculture Districts§!"

decision_planet_lv_stent: "Поселить щупальца"
decision_planet_lv_stent_desc: "Начинается создание новой колонии щупальцеобразных форм жизни на этой планете."
decision_planet_lv_stent_effects: "Добавляет $d_lv_tentacles$ на [Root.GetName]"

