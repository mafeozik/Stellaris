tr_lv_nurturing_1_pamper_subroutines_delayed: "Дипломатические подразделения запрограммированы на удовлетворение базовых потребностей большинства разумных существ. Анализ показывает значительный рост доверия, когда подразделения активируют подпрограммы "борьба за объятия"."

tr_lv_nurturing_2_chat_ai: "Чат с искусственным интеллектом"
tr_lv_nurturing_2_chat_ai_desc: "§Y$MOD_COUNTRY_TRADE_FEE$§! reduced by §G5%§!\n§Y$MOD_DIPLO_WEIGHT_MULT$§! increased by §G5%§!."
tr_lv_nurturing_2_chat_ai_delayed: "Специализированное программное обеспечение для искусственного интеллекта-помощника, способное поддерживать дружеские отношения в обмен на дипломатические услуги."

tr_lv_nurturing_3_sleep_mode: "Спящий режим"
tr_lv_nurturing_3_sleep_mode_desc: "$mod_planet_pops_robotics_upkeep_mult$: §G-10%§!."
tr_lv_nurturing_3_sleep_mode_delayed: "Перевод некоторых устройств в спящий режим при низком спросе существенно повышает нашу энергоэффективность."

tr_lv_nurturing_4_triboelectric_casings: "Трибоэлектрические корпуса"
tr_lv_nurturing_4_triboelectric_casings_desc: "$mod_planet_jobs_energy_produces_mult$: §G+5%§!\n§YUpkeep§! of all £job£ §YPop Jobs§! is reduced by §G5%§!."
tr_lv_nurturing_4_triboelectric_casings_delayed: "Высокоэффективные материалы, добавленные к внешнему слою блоков, обеспечивают трибоэлектрическую зарядку за счет трения."

tr_lv_nurturing_5_interlocking_units: "Блокирующие устройства"
tr_lv_nurturing_5_interlocking_units_desc: "$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+5%§!\n§Y$MOD_POP_RESETTLEMENT_COST_MULT$§! reduced by §G25%§!."
tr_lv_nurturing_5_interlocking_units_delayed: "Модели дронов дополнительно оптимизированы для длительного массового хранения, что позволяет повысить эффективность производства и логистику."

# Breeding #

tradition_lv_breeding: "Размножение"
tradition_lv_breeding_desc: "Поскольку ограничения, связанные с тем, что мы застряли в одном мире, больше не являются проблемой, наша новая проблема заключается в том, что в духовках недостаточно булочек или, если уж на то пошло, недостаточно духовок. Давайте изменим это..."

tr_lv_breeding_adopt: "Традиции размножения"

tr_lv_breeding_finish: "Традиции размножения завершены"
tr_lv_breeding_finish_desc: "Разблокирует §EПланетарные решения размножения§! чтобы быстро увеличить население планеты при высоких затратах ресурсов. Также разблокирует возвышение §YПревосходство размножения§! .\nколичество перков возвышения: §G+1§!"

tr_lv_breeding_1_incentives: "Стимулы"
tr_lv_breeding_1_incentives_desc: "§Y$MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$§! §G+25%§!"
tr_lv_breeding_1_incentives_delayed: "Предоставление стимулов и других льгот для разведения позволит увеличивать нашу численность, особенно в новых мирах."
tr_lv_breeding_1_brood_mothers_hive: "Выводковые матери"
tr_lv_breeding_1_brood_mothers_hive_desc: "§Y$MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$§! §G+25%§!"
tr_lv_breeding_1_brood_mothers_hive_delayed: "Добавление группы специально выведенных матерей-выводков на каждый колониальный корабль увеличит нашу численность, особенно на новых мирах."
tr_lv_breeding_1_incentives_machines: "Стимулы"
