civic_lv_pleasure_suits_desc: "Производители высокотехнологичных секс-игрушек, специализирующиеся на механизированных костюмах для удовольствия, заняли видное место в этом обществе, оказывая значительное влияние на политику правительства."
civic_tooltip_lv_pleasure_suits_effects: "Если взято в начале: открыта технология §YМеханизированные костюмы удовольствий§!.\n\n§BКастомные костюмы:§!\nЛидеры с меньшей вероятностью станут зависимыми от костюмов для удовольствий.\n§RНельзя запрещать костюмы удовольствий.§!\n"
