# Metallurgist Specialist #

job_lv_gem_incubator: "Инкубатор драгоценных камней"
job_lv_gem_incubator_plural: "Инкубаторы драгоценных камней"
job_lv_gem_incubator_desc: "Достижения в сексологии, связанные со спермой, позволяют нам создать вещество, которое вызывает образование яйцеобразных камней в телах тех, кого оно оплодотворяет. Эти драгоценные камни заставляют тела своих хозяев реагировать так, как будто они беременны настоящими яйцеклетками, которые они рождают, когда достигают определенного размера. Сексуальная стимуляция также, по-видимому, заставляет их расти быстрее, но такие родовые камни, как этот, занимают место для настоящих младенцев, что немного снижает прирост населения.."
job_lv_gem_incubator_effect_desc: "£job_lv_gem_incubator£ $job_lv_gem_incubator_plural$ Рожают камни богатые £minerals£ §Y$minerals$§! которые затем обрабатываются в £alloys£ §Y$alloys$§! специалистами на месте. Мы также можем выбрать хранение драгоценных камней вместо того, чтобы сразу же обрабатывать их через §BПланетарный указ§!"
