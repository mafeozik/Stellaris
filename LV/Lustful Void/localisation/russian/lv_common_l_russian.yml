job_lv_experimenter_drone: "Дрон эксперементатор"
job_lv_experimenter_drone_plural: "Дроны эксперементаторы"
job_lv_experimenter_drone_desc: "Сложные дроны с задачей исследовать все, что связано с сексом. Будь то изучение любых встречающихся экосистем или разработка новых методов достижения еще более высокого сексуального удовольствия, эти похотливые трутни пытаются заняться сексом со всем, с чем они сталкиваются!"
job_lv_experimenter_drone_effect_desc: "£job_lv_experimenter_drone£ $job_lv_experimenter_drone_plural$ превращают £consumer_goods£ §Y$consumer_goods$§! в £physics£ £society£ £engineering£ §YОчки исследований§! для новых технологий. Мы также можем позволить им сосредоточиться на создании экзотических секс-игрушек и других сопутствующих товаров, чтобы превратить £minerals£ §Y$minerals$§! в £consumer_goods£ §Y$consumer_goods$§! через §BПланетарный указ§!"
