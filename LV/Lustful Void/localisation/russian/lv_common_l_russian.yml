# Milking #

tradition_lv_milking: "Доение"
tradition_lv_milking_desc: "Доение нашего населения имеет важное значение для нашей экономики, и нам необходимо продолжать совершенствовать его."

tr_lv_milking_adopt: "Традиции доения"
tr_lv_milking_adopt_desc: "£job_lv_milk_cow£ §YMilk Cows§! £consumer_goods£ §Y$consumer_goods$§! upkeep reduced by §G-50%§!"

tr_lv_milking_finish: "Традиции доения завершены"
tr_lv_milking_finish_desc: "§HРазблокирует строение:§! §YКоровья клиника§!\nДойные коровы на планетах с §YКоровьеё клиникой§! постепенно приобретут черты, более подходящие для доения.\n(§RТребуется исследовать генную адаптацию!§!)\n§HАмбиции вознесения разблокированны:§! §G+1§!"

tr_lv_milking_1_cow_trend: "Коровий тренд"
tr_lv_milking_1_cow_trend_desc: "Даёт §G+1§! £job_lv_milk_cow£ §YМолочную корову§! за каждые §Y10§! населения."
tr_lv_milking_1_cow_trend_delayed: "Тенденции разумной лактации стали настолько популярными, что все больше и больше населения в целом хотят вести образ жизни дойной коровы."
tr_lv_milking_1_cow_trend_hive: "Коровий тренд"

tr_lv_milking_2_nourishing_milk: "Питательное молоко"
tr_lv_milking_2_nourishing_milk_desc: "£job_lv_milk_cow£ §YМолочные коровы§! повышают производительность £job_lv_sexologist£ §YСексологов§! на §G+1%§!."
tr_lv_milking_2_nourishing_milk_delayed: "Благодаря целенаправленным генетическим манипуляциям наше молоко стало очень питательным и стимулирует рост нейронов у тех, кто употребляет его регулярно."

tr_lv_milking_3_orgasmic_lactation: "Оргазмическая лактация"
tr_lv_milking_3_orgasmic_lactation_desc: "£job_lv_milk_cow£ §YМолочные коровы§! создает дополнительно §Y3§! £food£ $food$ если пригодная для размножения фауна или население имеют черту §YЛошадиный пенис§! или §Y1§! £food£ $food$ если хотя бы что-то используется для постоянной стимуляции."
tr_lv_milking_3_orgasmic_lactation_delayed: "Оргазмы стимулируют дополнительную лактацию у наших коров, а это означает, что при постоянном разведении молоко постоянно поступает."

tr_lv_milking_4_rich_calcium: "Богат кальцием"
tr_lv_milking_4_rich_calcium_desc: "£job_lv_milk_cow£ §YМолочные коровы§! повыщают производительность £pop_cat_worker£ §Y$pop_cat_worker$§! на §G+1%§!."
tr_lv_milking_4_rich_calcium_delayed: "Наше молоко богато кальцием и укрепляет жизнестойкость наших работников."
tr_lv_milking_4_rich_calcium_hive: "Богат кальцием"
tr_lv_milking_4_rich_calcium_hive_desc: "£job_lv_milk_cow£ §YМолочные дроны§! повыщают производительность £pop_cat_simple_drone£ §Y$pop_cat_simple_drone$§! на §G+1%§!."
tr_lv_milking_4_rich_calcium_hive_delayed: "Наше молоко богато кальцием и укрепляет жизнестойкость наших простых трутней."

tr_lv_milking_5_milking_worlds: "Доильные миры"
tr_lv_milking_5_milking_worlds_desc: "§HОткрывает планетарное решение:§! Превратите планету в доильный мир\n\nДойный мир добавляет планетарный модификатор, который увеличивает производительность £job_lv_milk_cow£ §YМолочных коров§! на §G+100%§! но уменьшает прочую производительность на §R-75%§!"
tr_lv_milking_5_milking_worlds_delayed: "Используя и оптимизируя доступное пространство на планете для молочных ферм и перерабатывающих мощностей, мы можем значительно увеличить продуктивность наших коров за счет других производственных секторов."


