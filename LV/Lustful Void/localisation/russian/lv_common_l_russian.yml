##########

army_lv_slime: "Армия слизи"
army_lv_slime_plural: "Армии слизи"
army_lv_slime_desc: "Огромная орда слизняков, специально созданная для того, чтобы нанести как можно больше урона зданиям и населению, вместо того, чтобы просто уничтожить вражескую армию как можно быстрее, как это сделало бы большинство войск.."
army_lv_slut: "Slut Army"

army_lv_slut_plural: "Шлюшьи армии"
army_lv_slut_desc: "Армия помешанных на сексе шлюх с фетишем на войну. Очень "мотивированные", лояльные и дешевые в содержании, но не самые лучшие в реальном бою."

army_lv_pleasure_suit: "Армия в костюмах удовольствий"
army_lv_pleasure_suit_plural: "Армии в костюмах удовольствий"
army_lv_pleasure_suit_desc: "Армия, оснащенная костюмами удовольствий, встроенными в их униформу. Послушные почти до невозможности, они с готовностью выполняют любой отданный приказ."

