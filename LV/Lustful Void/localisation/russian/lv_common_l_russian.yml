job_lv_gem_incubator_drone: "Дрон Инкубатор драгоценных камней"
job_lv_gem_incubator_drone_plural: "Дроны Инкубаторы драгоценных камней"
job_lv_gem_incubator_drone_desc: "Достижения в сексологии, связанные со спермой, позволяют нам создать вещество, которое вызывает образование яйцеобразных камней в телах тех, кого оно оплодотворяет. Эти драгоценные камни заставляют тела своих хозяев реагировать так, как будто они беременны настоящими яйцеклетками, которые они рождают, когда достигают определенного размера. Сексуальная стимуляция также, по-видимому, заставляет их расти быстрее, но такие родовые камни, как этот, занимают место для настоящих младенцев, что немного снижает прирост населения.."
job_lv_gem_incubator_drone_effect_desc: "£job_lv_gem_incubator_drone£ $job_lv_gem_incubator_drone_plural$ Рожают камни богатые £minerals£ §Y$minerals$§! которые затем обрабатываются в £alloys£ §Y$alloys$§! местными специалистами. Мы также можем выбрать хранение драгоценных камней вместо того, чтобы сразу же обрабатывать их с помощью §BПланетарного указа§!"
