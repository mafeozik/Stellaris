d_lv_cum_blocker_2_desc: "Первоначальные эксперименты по получению ресурсов из жидкостей организма не всегда заканчивались так, как мы ожидали."
d_lv_cum_blocker_3: "Засоренные спермой сточные воды"
d_lv_cum_blocker_3_desc: "Старые канализационные линии не были подготовлены к таким огромным объемам, с которыми им пришлось бы иметь дело, что привело к засорению и даже затоплению в некоторых районах."
d_lv_cum_blocker_4: "Озеро ядовитой спермы"
d_lv_cum_blocker_4_desc: "Дикие щупальца в этой области, по-видимому, производят редкий вид спермы, который токсичен для всей местной дикой природы."
d_lv_cum_blocker_5: "Разумная Сперма"
d_lv_cum_blocker_5_desc: "По какому-то чуду природы, скопление спермы, кажется, стало разумным. К большому разочарованию наших колонистов, он недружелюбен и очень энергично защищает свою территорию."
d_lv_cum_blocker_6: "Непослушные Щупальца"
d_lv_cum_blocker_6_desc: "В то время как большая часть дикой природы, по-видимому, находится в симбиозе с нашим видом, эта область, в частности, является домом для некоторых очень территориальных и жестоких щупалец."
d_lv_stentacle_core: "Ядро щупальца"
d_lv_stentacle_core_desc: "Это ядро обеспечивает необходимые материалы для поддержания специализированных частей организма."
