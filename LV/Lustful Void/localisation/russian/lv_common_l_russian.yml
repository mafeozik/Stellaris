job_lv_nurture_drone: "Дрон няня"
job_lv_nurture_drone_plural: "Дроны няни"
job_lv_nurture_drone_desc: "Усовершенствованные обслуживающие дроны, адаптированные для особого ухода за другими дронами, сохраняя при этом способность выполнять свои другие важные обязанности."
job_lv_nurture_drone_effect_desc: "£job_lv_nurture_drone£ $job_lv_nurture_drone_plural$ лучше заботятся о потребностях других дронов, повышая производительность рабочих мест  увеличивая £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§! и с правильными характеристиками и технологиями они также могут кормить других дронов молоком или спермой напрямую, производя £food£ §Y$food$§!"
