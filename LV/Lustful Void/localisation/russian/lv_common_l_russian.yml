tr_lv_breeding_4_breeding_focus_machines_delayed: "Программы органического разведения работают с эффективностью 81%."

tr_lv_breeding_5_mandatory_breeding: "Обязательное Разведение"
tr_lv_breeding_5_mandatory_breeding_desc: "Позволяет улучшить §EФабрики размножения§! "
tr_lv_breeding_5_mandatory_breeding_delayed: "Обязательная воинская повинность гарантирует, что у нас никогда не будет недостатка в желающих заводчиках."
tr_lv_breeding_5_forced_breeding_hive: "Принудительное Размножение"
tr_lv_breeding_5_forced_breeding_hive_desc: "Позволяет улучшить §EФабрики размножения§!"
tr_lv_breeding_5_forced_breeding_hive_delayed: "Все дроны будут выведены как часть наших ежедневных задач, без каких-либо исключений."
tr_lv_breeding_5_forced_breeding_machines: "Принудительное Размножение"
