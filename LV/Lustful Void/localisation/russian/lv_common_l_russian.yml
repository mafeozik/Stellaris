edict_lv_pleasure_enhancers_desc: "Сделайте мощные препараты, усиливающие гедонизм, доступными для потребления широкой общественностью. Это должно сделать наших граждан счастливее и продуктивнее, при условии, что мы сможем удовлетворить их почти ненасытные желания."

