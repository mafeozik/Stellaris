councilor_lv_pleasure_suits_desc: "$TITLE$ поручено постоянно совершенствовать прогулочные костюмы нашего лидера, адаптируя их к каждому человеку.."

civic_lv_sexculture: "Сексуализированная культура"
civic_lv_sexculture_desc: "Это общество рассматривает секс и эротику как форму художественного самовыражения. Порнография рассматривается как высокое искусство, а проституция - это просто еще один способ, с помощью которого художники продаются ради славы и богатства."
civic_tooltip_lv_sexculture_effects: "Добавляет §Y1§! дополнительное £unity£ единство от всех секс должностей."
councilor_lv_sexculture: "Галактическая шлюха"
councilor_lv_sexculture_female: "$councilor_lv_sexculture$"
councilor_lv_sexculture_desc: "$TITLE$ каждый день набирает миллиарды преданных подписчиков по всей Экстранете. Иногда они даже правильно произносят свои имена!"

# Megacorp #

civic_lv_franchised_prostitution: "Проституция по франшизе"
civic_lv_franchised_prostitution_desc: "Эта мегакорпорация преуспевает в продаже секса во всех формах, и их секс-работники пользуются большим спросом."
civic_tooltip_lv_franchised_prostitution_effects: "Все рабочие места, которые производят £trade_value£ §Y$TRADE_VALUE$§! дополнительно производят §G2§! £trade_value£ §Y$TRADE_VALUE$§!."
councilor_lv_franchised_prostitution: "Рекрутер в ThrobHub"
councilor_lv_franchised_prostitution_female: "$councilor_lv_franchised_prostitution$"
councilor_lv_franchised_prostitution_desc: "$TITLE$ ищет по всей галактике только лучшие таланты, предлагая выгодные контракты и интенсивные, но в то же время инклюзивные программы обучения. Вы когда-нибудь занимались сексом с блогером? Неважно, ваш контракт обязывает вас сделать это в ближайшее время, несмотря ни на что!"

civic_lv_sex_contractors: "Секс-Подрядчики"
civic_lv_sex_contractors_desc: "Эта мегакорпорация верит, что секс продается в буквальном смысле, и всегда использует его в рекламе или в качестве дополнительных сексуальных услуг в виде дополнительных льгот и бонусов, независимо от того, что обменивается."
civic_tooltip_lv_sex_contractors_effects: "Добавляет дополнительные должности §Y1§! £job_lv_escort£ §Y$job_lv_escort$§! для всех корпоративных секс зданий.\nСроки и стоимость строительства новых сексуальных корпоративных зданий сокращены на §G25%§!."
councilor_lv_sex_contractors: "Контролер сексуального поведения"
councilor_lv_sex_contractors_female: "$councilor_lv_sex_contractors$"
councilor_lv_sex_contractors_desc: "$TITLE$ следит за тем, чтобы все наши руководители соблюдали строгие стандарты поведения, от непристойной униформы до организации крайне откровенных новостных мероприятий. Ничто не бывает слишком дешевым, если продается больше товаров!"

# Robutts #

civic_lv_machine_nurture_protocols: "Протоколы воспитания"
civic_lv_machine_nurture_protocols_desc: "Наш машинный интеллект уделяет приоритетное внимание регулярному техническому обслуживанию наших агрегатов. Заботьтесь о дронах регулярно модернизируйте и настраивайте наши устройства для достижения максимальной эффективности и совместимости."
civic_tooltip_lv_machine_nurture_protocols_effects: "£job_lv_nurture_drone£ §Y$job_lv_nurture_drone_plural$§! также производят §Y1§! £unity£ единство."

