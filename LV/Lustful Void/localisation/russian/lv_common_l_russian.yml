job_lv_stimulator_drone: "Дрон стимулятор"
job_lv_stimulator_drone_plural: "Дроны стимуляторы"
job_lv_stimulator_drone_desc: "Стимуляторы помогают направлять и поддерживать обширные мягкие сети трения, используя специальные феромоны и их собственные тела, чтобы побудить червеобразные щупальца расширяться в новые или более удобные области."
