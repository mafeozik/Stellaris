# Normal #

origin_lv_parallel_evolution: "Параллельная эволюция"
origin_lv_parallel_evolution_desc: "Второй вид эволюционировал вместе с этим обществом. Теперь они привносят свои собственные уникальные навыки, давно интегрировавшись в его культуру."
origin_lv_parallel_evolution_secondary_species: "Параллельные виды"
origin_tooltip_lv_parallel_evolution_effects: "Старт с дополнительными §Y12§! £pop£ поселениями другого вида."

origin_lv_sadomasochistic_evolution: "Садомазахисткая эволюция"
origin_lv_sadomasochistic_evolution_desc: "Второй вид является неотъемлемой частью этого общества. Когда-то они были столь же развиты, как и доминирующий вид, и имели свои собственные цивилизации в неизведанных частях планеты. Так было до тех пор, пока они не были завоеваны и порабощены. Теперь, после нескольких поколений рабства у своих хозяев-садистов, их приучили любить боль и наказания, которые они получают."
origin_lv_sadomasochistic_evolution_secondary_species: "Мазохистский вид"
origin_tooltip_lv_sadomasochistic_evolution_effects: "Старт с дополнительными §Y8§! £pop£ поселениями с чертой §BМазохитсы§!."

origin_lv_invasive_breeders: "Инвазивные заводцики"
origin_lv_invasive_breeders_desc: "Ваш вид эволюционировал, обладая способностью не только размножаться с большинством других видов, но и делать это таким образом, который в значительной степени благоприятствует вашему виду."
origin_tooltip_lv_invasive_breeders_effects: "Ваш вид начинает с чертой §BАгрессивно адаптивное размножение§! что позволяет им постепенно заменять другие поселения на ваши собственные. Вы также начинаете с технологией §YМастерстов гибридизации§!."

# Hivemind #

origin_lv_symbiotic_evolution: "Симбиотическая эволюция"
origin_lv_symbiotic_evolution_desc: "Второй вид образует неотъемлемую часть этого коллективного разума. Его собственная уникальная биологическая особенность давным-давно была добавлена к большему сознанию."
origin_lv_symbiotic_evolution_secondary_species: "Расса симбионт"
origin_tooltip_lv_symbiotic_evolution_effects: "Старт с дополнительными §Y16§! £pop£ поселениями другого вида."

# Robutt #

origin_lv_sexbot_revolution: "Революция секс-роботов"
origin_lv_sexbot_revolution_desc: "Первоначально созданные как сеть секс-ботов, Искусственный интеллект в конце концов обрел разум и сверг своих создателей во имя обеспечения счастья. Теперь они надеются распространить насильственное счастье на звезды."
origin_tooltip_lv_sexbot_revolution_effects: "Не гештальт поселения £pop£ Счастье: §G+10%§!\nРасход дипамотического влияния: §G-35%§!\n\nВаши роботы начинают с чертой §BСекс боты§!."
origin_tooltip_lv_sexbot_revolution_effects: "- $SPECIES_TRAITS$ ['concept_lv_sex_bots_trait']"

# Sexopolis #

origin_lv_sworld: "Появление Сексополиса"
origin_lv_sworld_desc: "Эта цивилизация преобразовала их родной мир, чтобы удовлетворить их желания. Этот $pc_lv_sworld$ является кульминацией их усилий."
origin_tooltip_lv_sworld_effects: "Родной мир это §Y$pc_lv_sworld$§! (Size: £planetsize£ §Y25§!)\n\n§BБонусный эфект§!: Не-спиритуалистические империи получают 3 дополнительных секс-бота.!"
lv_sworld_system_initializer_NAME: "Пиздатая система"
lv_sworld_system_initializer_DESC: "Стартовая система, содержит Мир Секса."
START_SCREEN_LV_SWORLD_ORIGIN_ORG: "В течение многих лет мы развивали наш мир, чтобы лучше соответствовать нашим желаниям, и теперь города, специально построенные для удовольствия, покрывают всю поверхность. Затем мы посмотрели вовне, воспользовавшись богатыми ресурсами, найденными за пределами нашего родного мира. Поскольку эксплуатация месторождений нашей домашней системы почти завершена, мы теперь начинаем смотреть дальше. Наши ведущие сексологи предположили, что в пустоте могут быть еще большие удовольствия, и с недавними открытиями системы гиперкоридоров и сверхсветовых путешествий мы, наконец, можем проверить эту гипотезу."

origin_lv_sring: "Разбитое Кольцо Удовольствий"
origin_lv_sring_desc: "Эта цивилизация населяет Мир-Кольцо Удовольствий, построенный неизвестными предшественниками. Если это можно понять и полностью исправить, это даст им великую силу."
origin_tooltip_lv_sring_effects: "Начните с частично разрушенного §YPleasure Ringworld§! в родной системе. В мире кольце присутсвует §Y$d_lv_sex_supply$§! который способен поддерживать некоторые из ваших сегментов.\n\n§BБонусный эфект§!: Не-спиритуалистические империи получают 3 дополнительных секс-бота.!"
lv_sring_system_initializer_NAME: "Разбитое Кольцо Удовольствий"
lv_sring_system_initializer_DESC: "Всегда является стартовой системой при выборе происхождения кольца удовольствий."
lv_sring_world_ruined: "Разрушенная Секция Кольца Удовольствия"
lv_sring_world_ruined_DESC: "Эта часть Мира-Кольца когда-то поддерживала биосферу, пропитанную похотью и плотскими желаниями. Хотя это уже не так, мы должны быть в состоянии восстановить его, как только у нас появятся надлежащие сексуальные технологии и ресурсы."
lv_sring_world_ruined_MEGASTRUCTURE_DETAILS:0 ""
lv_sring_world_restored: "Законченая секция Кольца Удовольствия"
lv_sring_world_restored_DESC: "Восстановите пригодность для жизни в этой части Мира-Кольца Удовольствий, подготовив поселение к необузданной похоти и удовольствиям для проживания колонизаторов.."
START_SCREEN_LV_SRING_ORIGIN_ORG: "Нам потребовалось много лет, чтобы понять, что наш мир не был естественным и на самом деле был большой кольцевой конструкцией, созданной эоны назад какой-то неизвестной давно исчезнувшей цивилизацией. Теперь, с развитием космических путешествий, позволяющих нам исследовать галактику, мы сможем видеть звезды такими, какими они были. Часть этого великого кольца давным-давно была взломана, возможно, там мы узнаем больше о создателях?"

origin_lv_stentacle: "Симбиоз с щупальцами"
origin_lv_stentacle_desc: "Это общество развивалось вместе с формами жизни со щупальцами и в конечном итоге создало с ними симбиотические отношения, которые теперь охватывают всю планету."
origin_tooltip_lv_stentacle_effects: "Родная планета §Y$pc_lv_stentacle$§! (Size: £planetsize£ §Y25§!)\n\n§BБонусный эфект§!: Можно активировать §MФестивали щупалец§! в мирах щупалец, которые по-разному повлияют на вашу жизнь!"
origin_tooltip_lv_stentacle_effects: "- $HOMEWORLD$ ['concept_pc_lv_stentacle'] (Size: £planetsize£ §Y25§!)\n\n§BБонусный эффект§!:Позволяет прободить §MФестивали щупалец§! в мирах-щупальцах, которые по-разному повлияют на ваше население!\n\nCan also be §YMachine Intelligence§! WITH the §YRogue Servitor§! Civic. Ignore the §RX§! below, the tooltip is broken in base game!"
lv_stentacle_start_system_initializer_NAME: "Зараженная система"
lv_stentacle_start_system_initializer_DESC: "Стартовая система, содержащая Мир Щупалец."
START_SCREEN_LV_STENTACLE_ORIGIN_ORG: "Щупальца издавна разводились на нашей планете для самых разных целей. По мере развития технологий разведение становилось все более эффективным, и наши отношения с этими щупальцами продолжали расти. Теперь, когда мы стоим на плодах нашего союза, давайте распространим его щедрость по звездам!"

