tr_lv_breeding_4_breeding_culture: "Культура размножения"
tr_lv_breeding_4_breeding_culture_desc: "Разблокирует §EФабрики размножения§! которые дают £job_lv_breeder£ деятельность заводчиков"
tr_lv_breeding_4_breeding_culture_delayed: "Годы сосредоточения внимания на разведении сделали это настолько обычным делом, что наш народ считает это частью своей культуры и традиций."
tr_lv_breeding_4_breeding_focus_hive: "Фокус на размножение"
tr_lv_breeding_4_breeding_focus_hive_desc: "Разблокирует §EФабрики размножения§! которые дают £job_lv_breeder£ деятельность заводчиков"
tr_lv_breeding_4_breeding_focus_hive_delayed: "Годы сосредоточенности на разведении сделали это основной частью наших инстинктивных привычек."
tr_lv_breeding_4_breeding_focus_machines: "Фокус на размножение"
