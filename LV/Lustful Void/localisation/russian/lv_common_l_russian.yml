tr_lv_breeding_1_incentives_machines_delayed: "Проверка на беременность: ПОЛОЖИТЕЛЬНЫЙ результат - Раздача лакомств."

tr_lv_breeding_2_aphrodisiac_additives: "Добавки-афродизиаки"
