# Society #

tech_lv_tentacle_symbiosis: "Симбиоз с щупальцами"
tech_lv_tentacle_symbiosis_desc: "Может быть, они просто хотят обнимашек..."
tech_lv_tentacle_symbiosis_modifier_desc: "£job_lv_breeder£ Заводчики: §G+6§! от тентаклей\n\n§H$decision_planet_lv_stent$:§!\nСелит $d_lv_tentacle_symbiosis$ новое месторождение на планете, на которой оно используется."

tech_lv_tentacle_purge: "Очищение от щупалец"
tech_lv_tentacle_purge_desc: "Сожечь еретиков. Убить щупальца. Очиститить все нечистое."
tech_lv_tentacle_purge_modifier_desc: "§H$decision_planet_lv_ptent$:§!\nУничтожить все щупальцевые формы жизни на планете."

tech_lv_stentacle_world: "Засев Мира Щупальцами"
tech_lv_stentacle_world_desc: "После долгого сосуществования и изучения щупалец мы разработали способ терраформирования целых планет в живые миры с щупальцами."
tech_lv_stentacle_world_effect_title: "§HРазблокирует возможность:§! Засев Мира Щупальцами"
tech_lv_stentacle_world_effect_desc: "§HTentacle World Seeding:§!\nПозволяет нам терраформировать миры в Миры-Щупальца."

tech_lv_tentacular_awakening: "Пробуждение щупалец"
tech_lv_tentacular_awakening_desc: "Мы должны пробудить первобытные умы некоторых из наших хозяев щупалец, чтобы они могли непосредственно направлять и любить нас сквозь звезды!"
tech_lv_tentacular_awakening_effect_title: "§HРазблокирует решение:§! $decision_planet_lv_tentacular_awakening$"
tech_lv_tentacular_awakening_effect_desc: "§H$decision_planet_lv_tentacular_awakening$:§!\nПланетарное решение, которое создает новый набор щупалец для каждого месторождения щупалец на планете, на которой оно используется."

tech_lv_lactation_drugs: "Препараты для кормления грудью"
tech_lv_lactation_drugs_desc: "Новые относительно вызывающие привыкание препараты, которые вызывают лактацию у большинства биологических видов при введении непосредственно в грудь или соски. Размер молочной железы оказывает большое влияние на то, насколько эффективны эти препараты."
tech_lv_lactation_drugs_modifier_desc: "§HUnlocks Building:§! Молочное ранчо разумных"

tech_lv_milk_cow_specialization: "Специализации на молочных коровах"
tech_lv_milk_cow_specialization_desc: "Благодаря новым высокоэффективным препаратам для лактации и усовершенствованиям в технике доения, получение большей отдачи от наших дойных коров позволит значительно увеличить производство молока!"
tech_lv_milk_cow_specialization_modifier_desc: "Производительность коров: §G+10%§!\n§HРазблокируется решение:§! Специализация молочных коров"

tech_lv_prostitution_industry: "Индустрия межзвездной проституции"
tech_lv_prostitution_industry_desc: "Новые бизнес-модели, контрацептивы, "ксено-эскорт" и новые секс-игрушки позволяют создать новый вид индустрии проституции."
tech_lv_prostitution_industry_modifier_desc: "Производительность секс работ: §G+10%§!"

tech_lv_sex_slavery: "Сексуальное рабство"
tech_lv_sex_slavery_desc: "Рабов по закону можно заставить совершать сексуальные действия для своих хозяев."
tech_lv_sex_slavery_modifier_desc: "Производительность секс работ: §G+5%§!"

tech_lv_temple_of_love: "Храм любви"
tech_lv_temple_of_love_desc: "Храм Любви - это место, куда люди приходят, чтобы научиться любить не только себя, но и, что более важно, любить других."

tech_lv_nudity_worship: "Поклонение наготе"
tech_lv_nudity_worship_desc: "Обнаженному телу во всех его чудесных формах следует поклоняться без стыда и стеснения!"

tech_lv_repopulation_effort: "Усилия по репопуляции"
tech_lv_repopulation_effort_desc: "Лучшее понимание того, как мыслят наши граждане, позволяет нам еще больше поощрять их к производству потомства."

tech_lv_xeno_pornography: "Ксено порно"
tech_lv_xeno_pornography_desc: "Новые бизнес-модели, контрацептивы, "ксеноактеры" и новые секс-игрушки позволяют создавать новый вид порнографии."

tech_lv_aphrodisiacs_perfumes: "Духи-афродизиаки"
tech_lv_aphrodisiacs_perfumes_desc: "Духи, обладающие свойствами афродизиака, не только облегчат нашим лидерам успех за столом переговоров, но и побудят людей мигрировать в наши колонии."

tech_lv_battle_slut: "Тренировка боевого удовольствия"
tech_lv_battle_slut_desc: "Эксперты уверяют нас, что обучение наших солдат ассоциировать сражение с удовольствием технически не считается промыванием мозгов."
gateway_lv_brainwashing: "§HПуть промывания мозгов§!\n§EЭта технология приведет к дальнейшим достижениям в области промывания мозгов.§!"

tech_lv_advanced_pleasure_training: "Продвинутая тренировка удовольствия"
tech_lv_advanced_pleasure_training_desc: "При правильной мотивации даже самый непокорный ум можно сделать похотливым и уступчивым."
tech_lv_advanced_pleasure_training_modifier_desc: "§HОткрывает здание:§! Центр промывания мозгов"

tech_lv_hedonic_enhancers: "Усилители гедонизма"
tech_lv_hedonic_enhancers_desc: "Мощные целенаправленные нейростимуляторы временно блокируют способность субъекта снижать чувствительность к стимуляции, повышая концентрацию внимания, страсть и желание. Длительное употребление может привести к бесконечной жажде новых впечатлений, как в переносном, так и в буквальном смысле."

tech_lv_advanced_feminization: "Передовые методы феминизации"
tech_lv_advanced_feminization_desc: "Благодаря нашим достижениям в области генетики и медицины мы нашли способы применить эти методы для феминизации и изменить тело так, как мы хотим."
tech_lv_advanced_feminization_modifier_desc: "§HРазблокирует политику:§! Степень феминизации\n§HРазблокирует политику:§! Диапазон феминизации"

tech_lv_synth_sexbots: "Секс-боты синтетики"
tech_lv_synth_sexbots_desc: "Благодаря изысканным шаблонам того, что считается самыми совершенными формами тела в нашем обществе, и практически безграничной индивидуальности, эти сочные синттики мастерски созданы, чтобы стать идеальными компаньонами и любовниками для тех, кто может себе это позволить.."
tech_lv_synth_sexbots_modifier_desc: "Очки модификации роботов: §G+2§!\n§HUnlocks Feature:§! Секс бот асситсенты для лидеров"

tech_lv_hybridization_mastery: "Мастерство гибридизации"
tech_lv_hybridization_mastery_desc: "Теперь у нас есть средства для создания удивительных существ и созданий по нашему собственному дизайну! Или невыразимых ужасов... если мы так решим."
tech_lv_hybridization_mastery_modifier_desc: "§WРазмер империи от поселений: §G-25%§!§!\n§HРазболкирует черты:§! Совместимая матка/Сперма и агрессивно адаптивное размножение\n§HРазблокирует политику:§! Межвидовой Контроль Численности населения"

# Transformation Candy #

tech_lv_transformation_candy: "Трансформирующие конфеты"
tech_lv_transformation_candy_desc: "Теперь, когда инструменты редактирования генов стали обычным явлением, наши сексологи могут разработать новую забавную и вкусную линейку лекарств, похожих на конфеты, которые физически преображают тех, кто их ест.."
tech_lv_transformation_candy_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"

tech_lv_transformation_candy_apple: "Секвенирование полового биогенеза"
tech_lv_transformation_candy_apple_desc: "Наши исследования в области преобразований на генетическом уровне теперь позволяют полностью контролировать не связанные с полом характеристики. Мы сможем применить наши знания к традиционной генной терапии, методам трансформации или любым другим методам, которые мы разработаем в будущем.."
tech_lv_transformation_candy_apple_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"

tech_lv_transformation_candy_strawberry: "Секвенирование женского биогенеза"
tech_lv_transformation_candy_strawberry_desc: "Наши исследования преобразований на генетическом уровне теперь позволяют полностью контролировать специфические женские характеристики. Мы сможем применить наши знания к традиционной генной терапии, методам трансформации или любым другим методам, которые мы разработаем в будущем.."
tech_lv_transformation_candy_strawberry_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"

tech_lv_transformation_candy_blueberry: "Секвенирование мужского биогенеза"
tech_lv_transformation_candy_blueberry_desc: "Наши исследования преобразований на генетическом уровне теперь позволяют полностью контролировать специфические мужские характеристики. Мы сможем применить наши знания к традиционной генной терапии, методам трансформации или любым другим методам, которые мы разработаем в будущем.."
tech_lv_transformation_candy_blueberry_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"

tech_lv_transformation_candy_orange: "Экзотическое секвенирование биогенеза"
tech_lv_transformation_candy_orange_desc: "Наши исследования трансформаций на генетическом уровне теперь позволяют получить особые и экзотические характеристики. Мы сможем применить наши знания к традиционной генной терапии, методам трансформации или любым другим методам, которые мы разработаем в будущем.."
tech_lv_transformation_candy_orange_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"

tech_lv_biological_mimicry: "Биологическая мимикрия"
tech_lv_biological_mimicry_desc: "Оборудование для биологического воспроизводства - это... увлекательно. Более глубокое понимание позволило бы нам сделать наших синтетиков лучше имитирующими и доставляющими удовольствие."

# Machine Empire Traits Unlock #

tech_lv_biological_mimicry: "Биологическая мимикрия"
tech_lv_biological_mimicry_desc: "Оборудование для биологического воспроизводства - это... завораживающе. Более глубокое понимание позволило бы нашему разуму лучше имитировать и испытывать удовольствие."

# Engineering #

tech_lv_cyber_sextoys: "Кибер-Секс-игрушки"
tech_lv_cyber_sextoys_desc: "Разработанные для того, чтобы доставлять интенсивное удовольствие, этот ассортимент секс-игрушек является лучшим с точки зрения развлечений для взрослых."

tech_lv_cyber_milker: "Кибер-Доение"
tech_lv_cyber_milker_desc: "Внедрение гормональных добавок и высокоразвитых доильных аппаратов позволяет нашим дойным коровам производить еще больше молока для наших продовольственных запасов."
tech_lv_cyber_milker_modifier_desc: "Производительность коров: §G+5%§!"

tech_lv_sex_supply: "Перепрофилирование жидкости в Организме"
tech_lv_sex_supply_desc: "Достижения в области сексологии позволяют нам генерировать стратегические ресурсы из избытка жидкостей организма, выделяемых во время секса."
tech_lv_sex_supply_effect_title: "§HРазблокирует решение:§! $decision_planet_lv_sex_supply$"
tech_lv_sex_supply_effect_desc: "§H$decision_planet_lv_sex_supply$:§!\nA planetary decision that adds a $d_lv_sex_supply$ deposit to the planet it's used on."

tech_lv_gem_incubation_insight: "Инкубация драгоценных камней"
tech_lv_gem_incubation_insight_desc: "Последние исследования странных, богатых минералами камней яйцевидной формы, которые мы обнаружили, дали нам большое представление о его довольно противоречивом создании."
tech_lv_gem_incubation_insight_modifier_desc: "§HРазблокирует:§! £job_lv_gem_incubator£ Инкубаторы кристаллов и их §BBuildings§!, §BDistricts§! and §BPolicies§!"

tech_lv_mechanized_pleasure_suits: "Механизированные костюмы удовольствий"
tech_lv_mechanized_pleasure_suits_desc: "В комплекте с системами автоматического мониторинга, стимуляции и рециркуляции жидкости, приводимыми в действие собственным телом пользователя, эти костюмы являются идеальным мотивационным инструментом и могут носиться практически бесконечно.\n\nСообщения о том, что люди становятся зависимыми от костюмов и становятся неспособными функционировать без них, рассматриваются как особенность, а не ошибка.\n"
tech_lv_mechanized_pleasure_suits_modifier_desc: "§HРазблокирует:§! Легализация костюмов удовольствия §BПолитика§!\n\n§RЛидеры могут стать зависимыми от костюмов для удовольствий!§!"

tech_lv_self_contained_life_support_miniaturization: "Миниатюризация автономного жизнеобеспечения"
tech_lv_self_contained_life_support_miniaturization_desc: "Эти портативные контейнеры удерживают субъекта в состоянии комы, вызванной удовольствием, что делает их меньше и дешевле традиционных криогенных камер для транспортировки живых существ на межзвездные расстояния."
tech_lv_self_contained_life_support_miniaturization_effect: "§HШлюха в коробке!:§!\n\nТорговая защита: §G+5§!\nСтоимость переселения: §G-20%§!\nПоселения при основании колонии: §G+1§!"

tech_lv_interchangeable_cybernetics: "Взаимозаменяемая кибернетика"
tech_lv_interchangeable_cybernetics_desc: "Опыт работы в индустрии секс-роботов позволяет быстро заменять аксессуары по мере необходимости."
 
