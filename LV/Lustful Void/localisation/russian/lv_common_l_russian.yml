job_lv_comfort_worker: "Работник комфорта"
job_lv_comfort_worker_plural: "Работники комфорта"
job_lv_comfort_worker_desc: "Эти обычно милые работники посвящают себя заботе и комфорту наших людей. Они обучены заботиться как о психическом, так и о физическом здоровье населения, а также об общем обслуживании, чтобы все шло гладко. Пока они работают на правительство, их поощряют просить чаевые, обычно предлагая сексуальную разрядку одиноким или испытывающим стресс пациентам."
job_lv_comfort_worker_effect_desc: "£job_lv_comfort_worker£ $job_lv_comfort_worker_plural$ они лучше заботятся о потребностях других поселениях, повышают производительность рабочих мест, производят блага, а при наличии правильных качеств и технологий они также могут кормить других молоком или спермой напрямую, производя £food£ §Y$food$§!"
