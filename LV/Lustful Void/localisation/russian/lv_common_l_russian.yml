# Regular #

building_lv_comfort_zone: "Зоны комфорта"
building_lv_comfort_zone_desc: "Район зданий, предназначенных для обеспечения и обучения работников сферы комфорта. Процесс отбора может быть очень строгим из-за необходимости как ума, так и внешнего вида для работы."
building_lv_comfort_megaplex: "Мегакомплекс комфорта"
building_lv_comfort_megaplex_desc: "Большая площадь зданий, предназначенных для обеспечения и обучения работников сферы комфорта, с современными мастерскими и клиниками. Процесс отбора может быть очень строгим из-за необходимости как ума, так и внешнего вида для работы."

# Gestalt #

building_lv_nurture_zone: "Зоны воспитания"
building_lv_nurture_zone_desc: "Район зданий, предназначенных для обеспечения и создания воспитательных дронов."
building_lv_nurture_megaplex: "Мегакомплекс по воспитанию"
building_lv_nurture_megaplex_desc: "Большая площадь зданий, предназначенных для обеспечения и создания воспитательных дронов, с современными мастерскими и клиниками."

# Manufacturing #

building_lv_gem_incubation_foundries: "Литейные цеха для инкубации драгоценных камней"
building_lv_gem_incubation_foundries_desc: "Минералы и высококачественные сплавы производятся здесь в инкубаторах для драгоценных камней."
building_lv_gem_incubation_mega_forges: "Мега-кузницы для инкубации драгоценных камней"
building_lv_gem_incubation_mega_forges_desc: "Эти массивные кузницы для драгоценных камней могут помочь в конечной стадии производства минералов и сплавов в отраслях промышленности по всей планете."
building_lv_gem_incubation_nano_plants: "Наноустановки для инкубации драгоценных камней"
building_lv_gem_incubation_nano_plants_desc: "Крупные промышленные предприятия, нацеленные на увеличение производства минералов и сплавов в инкубаторах для драгоценных камней."

# Resource #

building_lv_sapient_dairy_ranch: "Молочные Ранчо"
building_lv_sapient_dairy_ranch_desc: "Крупный сектор, посвященный в основном молочным ранчо, специализирующимся на разумном животноводстве."
building_lv_sapient_dairy_estates: "Молочные латифундии"
