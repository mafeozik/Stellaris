civic_lv_sex_slaves: "Узаконенное Сексуальное рабство"
civic_lv_sex_slaves_desc: "В нашем обществе существует очень давняя традиция использования рабов в качестве сексуальных партнеров, что привело к потере некоторых недостатков рабства, сделав счастливее и раба, и владельца."
