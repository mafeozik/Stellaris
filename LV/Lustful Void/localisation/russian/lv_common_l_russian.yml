tr_lv_breeding_2_aphrodisiac_additives_delayed: "Делая афродизиаки обязательным условием практически для всех видов продукции, мы всегда создаем нужное настроение."
tr_lv_breeding_2_aphrodisiac_additives_machines: "Добавки-афродизиаки"
tr_lv_breeding_2_aphrodisiac_additives_machines_desc: "Уменьшает штраф за размер империи со стороны систем и колоний на §G-15%§!"
tr_lv_breeding_2_aphrodisiac_additives_machines_delayed: "Слишком низкий уровень возбуждения - ввсести стимуляторы."

tr_lv_breeding_3_pheromonal_dispersion: "Феромонная дисперсия"
tr_lv_breeding_3_pheromonal_dispersion_desc: "Использование жилья населением §G-10%§!"
tr_lv_breeding_3_pheromonal_dispersion_delayed: "Использование феромонного газа в системах вентиляции общественного пользования сближает наших людей... гораздо ближе."
tr_lv_breeding_3_pheromonal_dispersion_hive: "Феромонная дисперсия"
tr_lv_breeding_3_pheromonal_dispersion_hive_desc: "Использование жилья населением §G-10%§!"
tr_lv_breeding_3_pheromonal_dispersion_hive_delayed: "Мутация некоторых трутней, чтобы они производили постоянный феромональный газ вокруг себя, укрепляет сплоченность улья."
tr_lv_breeding_3_pheromonal_dispersion_machines: "Феромонная дисперсия"
