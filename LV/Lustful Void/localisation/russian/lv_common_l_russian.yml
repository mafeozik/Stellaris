# Aggressive Breeding #

policy_lv_aggressively_adaptive_reproduction: "Агрессивно адаптивное размножение"
policy_lv_aggressively_adaptive_reproduction_desc: "Наши тела идеально приспособлены для размножения за счет других рас. Эксплуатируя другие виды, мы можем увеличить свою численность, постепенно уничтожая их. Этого можно достичь с помощью соблазнения, рабства или даже грубой силы. Это никак не повлияет на агрессивных соз, которые пытаются размножать представителей нашего первоначального вида."
lv_aggressively_adaptive_reproduction_stopped: "Не оплодотворять"
lv_aggressively_adaptive_reproduction_stopped_name: "Не оплодотворять"
lv_aggressively_adaptive_reproduction_stopped_desc: "Оплодотворение другими видами не допускается. Хотя это позволит ксеносам свободно размножаться, наше собственное население было бы очень недовольно тем, что мы идем против самой нашей природы."
lv_aggressively_adaptive_reproduction_consentual: "Контролируемое размножение"
lv_aggressively_adaptive_reproduction_consentual_name: "Контролируемое размножение"
lv_aggressively_adaptive_reproduction_consentual_desc: "Хотя мы не будем идти против своих инстинктов, нам следует установить строгий контроль за межвидовым размножением. Вероятность конверсии сильно снижается, даже если у нас огромное присутствие на планете."
lv_aggressively_adaptive_reproduction_normal: "Естественный путь"
lv_aggressively_adaptive_reproduction_normal_name: "Естественный путь"
lv_aggressively_adaptive_reproduction_normal_desc: "Следуя естественным путем, мы будем постепенно истреблять другие расы, размножая их самок до того, как это смогут сделать их самцы. Это даст базовую скорость преобразования, если меньше 15 популяций, двойную скорость преобразования, если между 15-30 и тройную скорость преобразования, если выше или равно 30 популяций нашего вида.."
lv_aggressively_adaptive_reproduction_rape: "Принудительное преобразование"
lv_aggressively_adaptive_reproduction_rape_name: "Принудительное преобразование"
lv_aggressively_adaptive_reproduction_rape_desc: "TГалактика полна возможностей для размножения нашего вида, и нет необходимости в каких-либо ограничениях. Мы трахнем каждого ксено, которого сможем найти! Дополнительные поселения будут преобразованы с каждым событием, до 5 поселений, если у нас есть 45 поселений нашей расы на планете.."

