trait_lv_all_female: "Все женщины"
trait_lv_all_female_desc: "§LЛибо в результате катастрофы, либо по замыслу, либо в результате эволюции этот вид полностью состоит из самок. Они изобрели такой способ размножения, как партеногенез, но это сильно снизило рождаемость, поэтому всегда ищутся альтернативные методы.§!\n"
trait_lv_all_female_effect: "§LВсегда ищут альтернативу:§!\n§WСкорость прироста населения: §R-15%§!§!\n\n§LТолько женщины:§!\n§WУрон армии: §R-10%§!§!\n§Продолжительность жизни лидера: §G+20§!§!\n\n§BБонус за синергию:§!\n§WДругие не женские виды и роботы с чертой §YМодуль производства спермы§!.§!\n\n§YNote:§!\n§WВы можете разрешить удаление этого признака в меню параметров LV.§!\n"

trait_lv_femboy01: "Стадия феминизации I"
trait_lv_femboy01_desc: "Это поселение выбрано для феминизации."
trait_lv_femboy01_effect: "Поселение постепенно феминизируется."

trait_lv_femboy02: "Стадия феминизации II"
trait_lv_femboy02_desc: "Это поселение тренируют и вводят эстроген, чтобы оно стало женственным."
trait_lv_femboy02_effect: "Поселение постепенно феминизируется."

trait_lv_femboy03: "Стадия феминизации III"
trait_lv_femboy03_desc: "Это поселение уже прошло через множество тренировок и модификаций, чтобы стать похожим на женщину."
trait_lv_femboy03_effect: "Поселение постепенно феминизируется."

trait_lv_femboy04: "Стадия феминизации IV"
trait_lv_femboy04_desc: "Это поселение уже очень похоже на женщин."
trait_lv_femboy04_effect: "Поселение постепенно феминизируется."

trait_lv_femboy05: "Стадия феминизации V"
trait_lv_femboy05_desc: "Это поселение было обучено и модифицировано таким образом, чтобы быть настолько близким к женщине, насколько позволяет наш уровень технологий."
trait_lv_femboy05_effect: "Поселение было феминизировано настолько, насколько нам позволяют наши технологии."

trait_lv_brood_parasite: "Паразитическое потомство"
trait_lv_brood_parasite_desc: "§LЭтот вид нуждается в хозяине для высиживания своих яиц. Они способны имплантировать значительное количество этих яиц своему хозяину, что может быть крайне неудобно, если, конечно, вы не являетесь ксенофилом.§!\n"
trait_lv_brood_parasite_effect: "§LВсегда откладывает яйца:§!\n§WСкорость прироста населения: §G+10%§!§!\n§WИсползование благ поселениями: §R+10%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n\n§BБонус за синергию:§!\n§WНеграждане, ксенофилы или трутни могут быть заполнены яйцами.§!\n\n§YNote:§!\n§WВы можете разрешить удаление этого признака в меню параметров LV.§!\n"

trait_lv_intercompatible_womb: "Совместимая матка"
trait_lv_intercompatible_womb_desc: "§LЯйцеклетки этого вида способны к успешной гибридизации со сперматозоидами совершенно неродственного вида.§!\n"
trait_lv_intercompatible_womb_effect: "§LТяжело не забеременеть:§!\n§WСкорость прироста населения: §G+20%§!§!\n\n§BБонус за синергию:§!\n§WСоздает случайных гибридов, когда занимается сексом с поселениями с чертой §YСовместимая сперма§! .§!\n\n§YNote:§!\n§WЭто §ОТКЛЮЧЕНО§! по умолчанию! Вы можете включить его в любое время, а также разрешить удаление этой функции в меню параметров LV.§!\n"

trait_lv_nano_forge_womb: "Матка нано кузница"
trait_lv_nano_forge_womb_desc: "§LСамки этого вида наполнили свои матки живым металлом, превратив их в передовые нанолитейные заводы. Способные создавать постоянный запас живого металла, эти женщины могут производить широкий ассортимент потребительских товаров и деталей внутри себя.§!\n"
trait_lv_nano_forge_womb_effect: "§LНе могут иметь нормальных детей:§!\n§WСчастье:: §R-15%§!§!\n§WСкорость прироста населения: §R-25%§!§!\n§WЕдинство от деятельности: §R-10%§!§!\n§LНужно много 'Топлива':§!\n§WПотребление пищи: §R+50%§!§!\n\n§WПроизводительность секс-работ: §G+5%§!§!\n\n§BПродвинутая черта:§!\n§WПоселения с этой чертой производят §YЖивой металл§! когда работают на LV зданиях.§!\n\n§BБонус за синергию:§!\n§WСоздают рандомных роботов при сексе с робатами имеющими §YМодуль производства спермы§!.§!\n\n§YNote:§!\n§WВы можете отключить эту черту в меню мода.§!\n"

