############

# Psychological #

trait_lv_dominant: "Доминант"
trait_lv_dominant_desc: "§LУ этого вида развился напористый и властный характер, и им очень нравится играть роль Хозяина. Они стремятся осуществлять контроль над другими и в сексуальном плане очень властны.§!\n"
trait_lv_dominant_effect: "§LЛюбит быть главным:§!\n§WУрон армии: §G+25%§!§!\n§WПравитель производство: §G+25%§!§!\n§WСпециалист производство: §G+15%§!§!\n§WРабочий производство: §R-15%§!§!\n§WРаб производство: §R-25%§!§!\n§WВремя на переход в низший социальный слой на §R25%§ больше! .§!\n\n§LТребует большего:§!\n§WПотребление благ: §R+5%§!§!\n§WИспользование жилья населением: §R+5%§!§!\n§WРазмер империи от поселений: §R+10%§!§!\n\n§B-Бонус за синергию-§!\n\n§LПокорные поселения:§!\n§WИспользование жилья поселениями: §G-5%§!§!\n§WЕдинство от деятельности: §G+10%§!§!\n§WПотребности удовлетворены.§!\n\n§LКрайне покорные специалисты:§!\n§WСчастье: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n\n§LКрайне покорные правители:§!\n§WСчатье: §G+10%§!§!\n§WПолитическая власть: §G+2§!§!\n"

trait_lv_sadistic: "Садист"
trait_lv_sadistic_desc: "§LЭтот вид имеет склонность причинять боль и отчаяние другим. Они получают от этого сексуальное удовлетворение и могут пойти на крайние меры, чтобы удовлетворить свою похоть. Привычки могут включать похищение людей, а также физические и психические пытки.§!\n"
trait_lv_sadistic_effect: "§LНаслаждается мучениями:§!\n§WУрон армии: §G+30%§!§!\n§WУрон морали наступательной армии: §G+20%§!§!\n§WМораль армии: §R-10%§!§!\n\n§LПлохие рабы:§!\n§WСчастье рабочих: §R-5%§!§!\n§WСчастье рабов: §R-10%§!§!\n§WПроизводительность рабов: §R-10%§!§!\n\n§WПроизводительность секс-работ: §R-10%§!§!\n"

trait_lv_lewd_mind: "Похотливое сознание"
trait_lv_lewd_mind_desc: "§LЭтот вид обладает более сильным половым влечением, чем большинство других видов, и может превратить самые невинные мысли во что-то непристойное и развратное. Это серьезное отвлечение внимания, которое может привести к несчастным случаям и незаконченной работе, но в основном проявляется в виде тупого взгляда в пространство или непристойных высказываний.§!\n"
trait_lv_lewd_mind_effect: "§LОбычно думает о извращенном сексе:§!\n§WСкорость прироста населения: §G+5%§!§!\n§WПроизводительность от деятельности: §R-10%§!§!\n§WПривелкательность руководящих принципов: §R-25%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n"

trait_lv_sex_crazed: "Помешанные на сексе"
trait_lv_sex_crazed_desc: "§LЭтот вид сексуально одержим, проводя большую часть дней в борьбе со своими желаниями. Попытки сосредоточиться мало помогают сдерживать их необузданное либидо в узде. Склонны к спонтанным проявлениям бесстыдной похоти. Это маленькое чудо, что им удается удержаться на работе или даже не забывать спать, когда они занимаются сексом не с одним, а, как правило, с несколькими партнерами.§!\n"
trait_lv_sex_crazed_effect: "§LПожалуйста выеби меня!:§!\n§WСкорость прироста населения: §G+50%§!§!\n§WПроизводительность от деятельности: §R-50%§!§!\n§WПривелкательность руководящих принципов: §R-50%§!§!\n\n§WПроизводительность секс-работ: §G+50%§!§!\n§WОтношение: §Y20§!§!\n"

trait_lv_sexually_inept: "Сексуально неумелые"
trait_lv_sexually_inept_desc: "§LДля этого вида секс - это средство достижения цели, и эта цель - продолжение рода. Сексуальные связи носят очень деловой характер, часто столь же формальный, как рукопожатие, и столь же краткий. Любая длительная помолвка обычно требует предварительной записи и составления расписания.§!\n"
trait_lv_sexually_inept_effect: "§LДела важнее удовольствий:§!\n§WСчастье:: §R-10%§!§!\n§WСкорость прироста населения: §R-25%§!§!\n§WПроизводительность от деятельности: §G+10%§!§!\n\n§WПроизводительность секс-работ: §R-50%§!§!\n"

trait_lv_sexually_repressed: "Сексуально подавленые"
trait_lv_sexually_repressed_desc: "§LЭтот вид культивировал куда более сдержанный взгляд на практику секса, по сравнению с другими видами. Хотя они и не совсем целомудренны, их легко оскорбить тем, что они считают "низменным и животным" поведением.§!\n"
trait_lv_sexually_repressed_effect: "§LЗвенящая пошлость!:§!\n§WСчастье:: §R-15%§!§!\n§WСкорость прироста населения: §R-10%§!§!\n\n§WПроизводительность секс-работ: §R-25%§!§!\n§WОтношение: §R-20§!§!\n"

# Physical #

trait_lv_scary: "Жуткие"
trait_lv_scary_desc: "§LЭтот нервирующий вид вызывает первобытный страх у тех, с кем они сталкиваются. Обладая ужасающей внешностью или вызывающими беспокойство манерами, они, кажется, всегда окружают тех, к кому проявляют извращенный интерес.§!\n"
trait_lv_scary_effect: "§LТеррор:§!\n§W§WУрон морали армии: §G+25%§!§!\n§WМораль армии: §G+25%§!§!\n\n§LНе подходи слишком близко:§!\n§WРост населения от иммиграции: §R-5%§!§!\n§WИспользование жилья населением: §R+10%§!§!\n§WРазмер империи от поселений: §R+10%§!§!\n\n§WПроизводительность секс работ: §R-15%§!§!\n\n§B-Бонус за синергию-§!\n\n§LМилые поселения:§!\n§WУрон армии: §G+25%§!§!\n§WИспользование благ поселениями: §R+10%§!§!\n\n§LОчаровательные лидеры:§!\n§WСчастье: §G+15%§!§!\n§WУрон оборонительных армий: §G+50%§!§!\n§WПроизводительность рабочих: §G+5%§!§!\n"

trait_lv_erogenous_anus: "Эрогеный анус"
trait_lv_erogenous_anus_desc: "§LАнальные стенки этого вида имеют гораздо больше нервных окончаний, чем в половых органах, поэтому они рассматривают влагалище исключительно как репродуктивный орган. Их прямая кишка настолько чувствительна, что эротические романы Брайля в форме свечей стали довольно популярными.§!\n"
trait_lv_erogenous_anus_effect: "§Lанальные пробки браиля:§!\n§WСчастье:: §G+5%§!§!\n§WИсползование благ поселениями: §R+5%§!§!\n\n§Lпредпочитают анальный секс:§!\n§WСкорость роста населения: §R-20%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n"

trait_lv_seasonal_breeders: "Сезонное спаривание"
trait_lv_seasonal_breeders_desc: "§LЭтот вид выроботал свой цикл размножения в соответствии с сезонными изменениями на своих планетах ради достижения максимальной продуктивности. В то время как обычно спокойные и прилежные там работают большую часть года, они выделяют время для безудержных, похотливых оргий, где они постоянно спариваются с безрассудной самоотверженностью, прежде чем вернуться к своей спокойной жизни.§!\n"
trait_lv_seasonal_breeders_effect: "§Lтяжело адаптироваться:§!\n§WСкорость прироста населения: §R-40%§!§!\n§WПриспособленность: §R-20%§!§!\n§WПроизводительность от деятельности: §G+20%§!§!\n\n§WПроизводительность секс-работ: §R-20%§!§!\n"

