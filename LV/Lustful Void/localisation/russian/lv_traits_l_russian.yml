trait_lv_submissive: "Покорные"
trait_lv_submissive_desc: "§LЭтот вид обладает удивительной покорностью которая пронизывает почти каждый аспект их существования, особенно их сексуальную жизнь. Неспособные справиться с положением во власти, они предпочитают более рабские роли и часто находят любую авторитетную фигуру очень возбуждающей.§!\n"
trait_lv_submissive_effect: "§LНенавидят быть во главе:§!\n§WМораль армии: §R-75%§!§!\n§WПравитель производство: §R-25%§!§!\n§WСпециалист производство: §R-15%§!§!\n§WРабочие производство: §G+15%§!§!\n§WРабы производство: §G+25%§!§!\n§WСкорость перехода поселения в низщий социальный слой на §G50%§! быстрее.§!\n\n§B-Бонус за синергию-§!\n\n§LДоминантные поселения:§!\n§WИспоьзование благ поселением: §G-5%§!§!\n§WИспользование жилья поселением: §G-10%§!§!\n§WРазмер империи от поселений: §G-25%§!§!\n\n§LДоминантные специалисты:§!\n§WСчастье: §G+5%§!§!\n§WСтоимость переселения: §G-25%§!§!\n\n§LДоминтные правители:§!\n§WСчастье: §G+10%§!§!\n§WСтоимость переселения: §G-75%§!§!\n"

trait_lv_masochistic: "Мазохисты"
trait_lv_masochistic_desc: "§LУ этого вида развилась зависимость от боли. Их естественная химическая реакция на опасные ситуации и боль постепенно превратилась в нечто вроде сексуального наслаждения, но также значительно улучшила их производительность в тяжелых физических видах деятельности. Хотя это ни в коем случае не опасно, большинство представителей этого вида щеголяют с различными свежими отметинами на своих телах.§!\n"
trait_lv_masochistic_effect: "§LЛюбит немного боли:§!\n§WСчастье рабочих: §G+5%§!§!\n§WСчастье рабов: §G+10%§!§!\n\n§LОтшлепай меня сильнее!:§!\n§WЗдоровье армии: §G+10%§!§!\n§WПриспособленность: §G+5%§!§!\n\n§WПроизводительность секс-работ: §G+5%§!§!\n"

trait_lv_adorable: "Милые"
trait_lv_adorable_desc: "§LВ качестве тактики выживания этот вид очень хорошо преуспел в том, чтобы казаться симпатичным другим видам и даже животным. Прискорбным недостатком является то, что теперь они потеряли способность казаться устрашающими при переговорах с другими, и иногда к ним пристают или обнимают в открытую.§!\n"
trait_lv_adorable_effect: "§LХочется обнять:§!\n§W§WПрирост опыта лидера: §R-15%§!§!\n§WУрон морали наступательной армии: §R-15%§!§!\n§WМораль армии: §R-15%§!§!\n\n§LОбнимись или умри!:§!\n§WРост населения от иммиграции: §G+5%§!§!\n§WИспользование жилья населением: §G-10%§!§!\n§WПриспособленность: §G+5%§!§!\n§WРазмер империи от поселений: §G-10%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_nudist: "Нудисты"
trait_lv_nudist_desc: "§LОбладая естественной устойчивостью к воздействию окружающей среды и непогоды, этот вид предпочитает быть в чём мать родила. Отвергая почти всю одежду, они предпочитают украшения и все, что имеет практическое назначение или применение, иногда сочетая то и другое. Этот вид не стыдится своего тела и с удовольствием позволяет всему этому болтаться на виду.§!\n"
trait_lv_nudist_effect: "§LМеньше потребностей:§!\n§WИсползование благ поселениями: §G-5%§!§!\n§WПотребление товаров массового спроса населением: §G-5%§!§!\n\n§LПолностью природный образ жизни:§!\n§WПриспособленность: §G+5%§!§!\n\n§WПроизводительность секс-работ: §G+5%§!§!\n"

trait_lv_exhibitionist: "Эксбиционисты"
trait_lv_exhibitionist_desc: "§LЭтот вид считает наготу очень возбуждающей, особенно на публике. Когда это стало общественной нормой, одежда стала гораздо более утилитарной. Этот вид открыто поощряет публичные проявления привязанности и похоти, а также наблюдает за такими действиями ради удовольствия.§!\n"
trait_lv_exhibitionist_effect: "§LВозбуждабтся когда без одежды:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n\n§LЗнают, как "развлекать":§!\n§WМаксимальный уровень лидера: §G+1§!§!\n§Получемыемый лидером опыт: §G+10%§!§!\n\n§WПроизводительность секс-работ: §G+15%§!§!\n§WОтношение: §Y15§!§!\n"

trait_lv_sexually_gifted: "Сексуально Одаренные"
trait_lv_sexually_gifted_desc: "§LЭтот вид придает большое значение сексу и всем его аспектам, это большая часть их жизни и может даже повлиять на социальное положение. Терпение, выдержка и выносливость - важнейшие компоненты в их сложных брачных ритуалах, которые могут длиться часами.§!\n"
trait_lv_sexually_gifted_effect: "§LМастера дипломатии:§!\n§WЕдинство от деятельности: §G+5%§!§!\n§WИспользование жилья населением: §G-10%§!§!\n§WПолучемыемый лидером опыт: §G+15%§!§!\n\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y10§!§!\n"

trait_lv_sexual_pheromones: "Сексуальные феромоны"
trait_lv_sexual_pheromones_desc: "§LЭтот вид развил сложный феромонный язык, чтобы сообщать друг другу о своём состоянии или возбуждении, цикле течки и статусе спаривания. Хотя эти феромоны для внутривидовой стимуляции, также было отмечено, что другие виды также подвержены воздействию в меньшей или большей степени и, как известно, предпринимались попытки спаривания.§!\n"
trait_lv_sexual_pheromones_effect: "§LВозбуждающее присутствие:§!\n§WСкорость роста населения: §G+5%§!§!\n§WИспользование жилья населением: §G-5%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_targeted_pheromones: "Специализированные феромоны"
trait_lv_targeted_pheromones_desc: "§LЭтот вид использует феромоны не только для общения, но и для того, чтобы навязывать свою собственную волю и желания другим. Хотя невосприимчивость может появится с течением времени, эти феромоны обладают наркотическим эффектом, который может ввести неосознанных и восприимчивых людей в очень покорное состояние. Хотя они и не вызывают привыкания в традиционном смысле этого слова, они оказывают приятный эффект.§!\n"
trait_lv_targeted_pheromones_effect: "§LГипнотическое влияние:§!\n§WСкорость роста населения: §G+15%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n§WИспользование жилья населением: §G-10%§!§!\n\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y10§!§!\n\n§BРазвитая черта:§!\n§WНаселение с этой чертой производит §YЭкзотические Газы§! когда работает на секс-работе.§!\n"

# Physical #

trait_lv_soft: "Мягкие"
trait_lv_soft_desc: "§LЭтот вид очень приятный и мягкий на ощупь. Эта мягкость обычно является результатом появления некоторых натуральных волокон, из которых получаются превосходные товары для дома. Их мягкость настолько желанна, что их общество изобилует приставаниями как со стороны сапиенсов, так и со стороны животных.§!\n"
trait_lv_soft_effect: "§LПушистик!:§!\n§WТовары массового спроса от деятельности: §G+5%§!§!\n§WРост населения от иммиграции: §G+5%§!§!\n§WИспользование жилья населением: §G-15%§!§!\n\n§WПроизводительность секс-работ: §G+5%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_long_tongues: "Длинный язык"
trait_lv_long_tongues_desc: "§LЭтот вид обладает чрезвычайно длинными и ловкими языками, которые активно используются как дополнительная конечность при необходимости. В обществе он используется различными способами, чтобы показать привязанность или доверие, подобно тому, как молодые влюбленные идут рука об руку. В сексуальном плане это очень адаптируемый орган, способный играть множество различных ролей или несколько ролей одновременно.§!\n"
trait_lv_long_tongues_effect: "§LЦепкие языки:§!\n§WПроизводительность от деятельности: §G+5%§!§!\n§WПотребление товаров массового спроса населением: §R+5%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n"

trait_lv_neuron_saliva: "Нейро-слюна"
trait_lv_neuron_saliva_desc: "§LСлюна этого вида содержит квазинейронные клетки, которые передают сенсорную информацию в мозг существу. Они не только гораздо ярче ощущают вкусы и близость, так-же эта слюна активно используется в науке.§!\n"
trait_lv_neuron_saliva_effect: "§L'Глубокое' понимание:§!\n§WЕдинство от деятельности: §G+5%§!§!\n§WРазмер империи от поселений: §G-10%§!§!\n\n§WПродуктивность молочных коров: §G+5%§!§!\n§WПроизводительность секс-работ: §G+5%§!§!\n\n§BПродвинутая черта:§!\n§WПоселения с этой чертой производят §YИсследования§! на секс работах.§!\n"

trait_lv_elastic_orifices: "Эластичные Отверстия"
trait_lv_elastic_orifices_desc: "§LМягкие ткани этого вида обладают хорошей эластичностью, особенно у различных отверстий и вокруг них, также они могут похвастаться отличным мышечным контролем. Эта осбоненнсотсть существует в первую очередь для спаривания, которое может быть очень энергичным и часто включающее в себя несколько партнеров, не довольствующихся ожиданием своей очереди, и делает роды легкими, а иногда и приятными.§!\n"
trait_lv_elastic_orifices_effect: "§LВлезет что угодно:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n"

trait_lv_natural_anal_lube: "Естественная анальная смазка"
trait_lv_natural_anal_lube_desc: "§LНаличие очень эффективного пищеварительного тракта и спецефичного питания привело к тому, что у этого вида выработалась естественная анальная смазка, которая превратилась во вторичный половой признак. Значительно улучшив свой рацион питания, они теперь производят гораздо больше, чем необходимо для облегчения развлекательных брачных мероприятий. Химически нейтральный и нетоксичный, он очень востребован на рынке и часто используется в машиностроении.§!\n"
trait_lv_natural_anal_lube_effect: "§LСкользкая и липкая:§!\n§WСчастье:: §G+5%§!§!\n§WИсползование благ поселениями: §G-10%§!§!\n\n§LУниверсальная смазка:§!\n§WТовары массового спроса от деятельности: §G+10%§!§!\n§WСплавы от деятельности: §G+10%§!§!\n\n§WПродуктивность молочных коров: §G+5%§!§!\n§WПроизводительность секс-работ: §G+15%§!§!\n"

trait_lv_honey: "Мёд"
trait_lv_honey_desc: "§LВ качестве естественного побочного продукта пищеварения этот вид производит сладкий на вкус сироп, напоминающий мед. Затем он накапливается в специализированных железах, часто называемых молочными железами, которые могут начинать лактацию, если их регулярно не доить. Также было отмечено, что производство меда увеличивается во время спаривания при подготовке к оплодотворению.§!\n"
trait_lv_honey_effect: "§LВкусный мёд:§!\n§WПища от деятельности: §G+10%§!§!\n\n§LВосковое строительство:§!\n§WИспользование жилья населением: §G-10%§!§!\n\n§WПродуктивность молочных коров: §G+5%§!§!\n§WПроизводительность секс-работ: §G+5%§!§!\n"

trait_lv_exotic_honey: "Экзотичный мёд"
trait_lv_exotic_honey_desc: "§LУ этого вида активировался рецессивный ген, и теперь у них есть железа, соединенная с их репродуктивными органами, которые атрофировались на протяжении поколений. Теперь эта железа вырабатывает уникальный и экзотический вид меда, который выделяется при каждой эякуляции. Содержащий незначительно количество ценных пылинок, считается, что это был корм для отбора особей в больших количествах, чтобы произвести некоторый эффект или изменение.§!\n"
trait_lv_exotic_honey_effect: "§LВкуснейший мёд:§!\n§WПища от деятельности: §G+20%§!§!\n\n§LВосковая инфраструктура:§!\n§WИспользование жилья населением: §G-20%§!§!\n§WПриспособленность: §G+10%§!§!\n\n§WПродуктивность молочных коров: §G+10%§!§!\n§WПроизводительность секс-работ: §G+10%§!§!\n\n§BПрогрессивынй ген:§!\n§WНаселение с этой чертой проводит §YРедкие Пылинки§! на молочной ферме.§!\n"

trait_lv_oviposition: "Яйцекладущие"
trait_lv_oviposition_desc: "§LВ качестве альтернативы этот вид может размножаться, откладывая яйца. Хотя обычно их оплодотворяют еще внутри, способ инкубации может сильно варьироваться. Некоторые развивают яйцеклетку в течение определенного периода времени, в то время как другие могут отложить его в течение нескольких дней после полового акта. В некоторых крайних случаях яйцо можно инкубировать до тех пор, пока оно не станет размером примерно с маленького ребенка, прежде чем откладывать.§!\n"
trait_lv_oviposition_effect: "§LАльтрнативный способ размножения:§!\n§WСкорость прироста населения: §G+5%§!§!\n§WПотребление товаров массового спроса населением: §R+5%§!§!\n\n§LИзбыток яиц:§!\n§WПроизводительность пищи от переработки: §G+0.5§!§!\n"

