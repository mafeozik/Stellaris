trait_lv_titanic_evolution: "Титаническая эволюция"
trait_lv_titanic_evolution_desc: "§L§BКомбинированная черта!§! Этот признак сочетает в себе следующие черты, чтобы сохранить выбор признака: Упругие Отверстия, Огромная Грудь, Очень Питательное Молоко, Бедра Заводчика, Пометы и Помешанные на сексе.§!\n"
trait_lv_titanic_evolution_effect: "§WУрон морали армии: §G+15%§!§!\n§WСчастье:: §G+20%§!§!\n§WСкорость прироста населения: §G+115%§!§!\n§WРост населения от иммиграции: §G+45%§!§!\n§WИспользование жилья населением: §R+10%§!§!\n§WРазмер империи от поселений: §R+10%§!§!\n§WПриспособленность: §G+15%§!§!\n§WПроизводительность от деятельности: §R-55%§!§!\n§Продолжительность жизни лидера: §G+10§!§!\n§WПривелкательность руководящих принципов: §R-50%§!§!\n§WПроизводительность пищи от переработки: §G+1§!§!\n§WСодержание  коров: §R+50%§!§!\n\n§WПродуктивность молочных коров: §G+40%§!§!\n\n§WПроизводительность секс-работ: §G+90%§!§!\n§WОтношение: §Y45§!§!\n"

