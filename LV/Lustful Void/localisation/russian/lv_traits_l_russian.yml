trait_lv_perfect_hybrid: "Идеальный Гибрид"
trait_lv_perfect_hybrid_desc: "§L§BКомбинированная черта!§! Эта черта сочетает в себе следующие черты, чтобы сохранить выбор черт: Целевые Феромоны, Эластичные отверстия, Эксгибиционист, Сексуально Одаренный, Натуральная Анальная смазка и Нейронная Слюна..§!\n"
trait_lv_perfect_hybrid_effect: "§WСчастье: §G+15%§!§!\n§WСкорость прироста населения: §G+35%§!§!\n§WРост населения от иммиграции: §G+20%§!§!\n§WЕдинство от деятельности: §G+10%§!§!\n§WТовары массового спроса от деятельности: §G+10%§!§!\n§WСплавы от деятельности: §G+10%§!§!\n§WИспользование жилья населением: §G-20%§!§!\n§WИсползование благ поселениями: §G-10%§!§!\n§WРазмер империи от поселений: §G-10%§!§!\n§Максимальный уровень лидера: §G+1§!§!\n§Получемыемый лидером опыт: §G+25%§!§!\n\n§WПродуктивность молочных коров: §G+10%§!§!\n§WПроизводительность секс-работ: §G+85%§!§!\n§WОтношение: §Y35§!§!\n\n§BПродвинутая черта:§!\n§WПосления с этой чертой производят §YЭкзотические газы§! и §YИсследования§! при работе на LV зданиях.§!\n"

