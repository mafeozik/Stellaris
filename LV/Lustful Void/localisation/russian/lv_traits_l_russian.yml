# Physical #

trait_lv_futanari: "Футанари"
trait_lv_futanari_desc: "§LВ качестве стратегии выживания этот вид, вместо того чтобы разделяться на отдельные гендерные категории, обладает всем необходимым оборудованием для саморазмножения. Внешне они, по-видимому, имеют женский фенотип, но обладают полностью функционирующим набором мужских и женских половых органов.§!\n"
trait_lv_futanari_effect: "§LСамооплодотворение:§!\n§WСкорость прироста населения: §G+25%§!§!\n§WПотребление товаров массового спроса населением: §R+10%§!§!\n\n§WПроизводительность секс-работ: §G+5%§!§!\n\n§YNote:§!\n§WВы можете разрешить удаление этого признака в меню параметров LV.§!\n"

trait_lv_androgynous: "Андрогинные"
trait_lv_androgynous_desc: "§LЭтот вид обладает как мужскими, так и женскими признаками, из-за чего трудно определить его пол с первого взгляда.§!\n"
trait_lv_androgynous_effect: "§LСвобода выбора:§!\n§WЕдинство от деятельности: §G+15%§!§!\n\n§YПримечание:§!\n§WВы также можете разрешить удаление этого признака в меню параметров LV.§!\n"

trait_lv_aggressively_adaptive_reproduction: "Агрессивно адаптивное размножение"
trait_lv_aggressively_adaptive_reproduction_desc: "§LРепродуктивные органы этого вида эволюционировали или были генетически модифицированы, чтобы не только обеспечить успешное межвидовое размножение, но и сделать это таким образом, чтобы любое потомство было только их собственного вида.§!\n"
trait_lv_aggressively_adaptive_reproduction_effect: "§LПохотливые с рождения:§!\n§WСкорость прироста населения: §G+10%§!§!\n\n§BБонус за синергию:§!\n§WПостепенно вытесняет поселения других видов. Поселения с этим признаком, которые порабощены или иным образом не могут размножаться, не заменят другие поселения.§!\n\n§YNote:§!\n§WВы также можете разрешить удаление этого признака в меню параметров LV.§!\n"

