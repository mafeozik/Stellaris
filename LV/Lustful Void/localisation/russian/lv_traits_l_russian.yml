trait_lv_all_male: "Все мужчины"
trait_lv_all_male_desc: "§LЛибо из-за катастрофы, либо из-за замысла, либо из-за эволюции этот вид состоит исключительно из самцов. Не имея самок, этому виду пришлось изобрести искусственные средства размножения или оплодотворения. Они имели ограниченный успех, но рождений мало и они очень редки.§!\n"
trait_lv_all_male_effect: "§LВсегда ищут альтернативу:§!\n§WСкорость прироста населения: §R-15%§!§!\n\n§LТолько мужчины:§!\n§WУрон армии: §G+10%§!§!\n§Продолжительность жизни лидера: §R-20§!§!\n\n§BБонус за синергию:§!\n§WДругие не мужские виды, §YСекс боты§! или роботы с чертой §YСинтетичемкая вагина§! .§!\n\n§YNote:§!\n§WВы можете разрешить удаление этого признака в меню параметров LV.§!\n"

trait_lv_intercompatible_sperm: "Совместимая сперма"
trait_lv_intercompatible_sperm_desc: "§LСперматозоиды этого вида способны успешно оплодотворять яйцеклетки совершенно неродственного вида.§!\n"
trait_lv_intercompatible_sperm_effect: "§LТяжело не осеменить:§!\n§WСкорость прироста населения: §G+20%§!§!\n\n§BБонус за синергию:§!\n§WСоздаёт случайных гибридов при сексе с §YСовместимой маткой§! pops.§!\n\n§YNote:§!\n§WЭто §ОТКЛЮЧЕНО§! по умолчанию! Вы можете включить его в любое время, а также разрешить удаление этой функции в меню параметров LV.§!\n"

