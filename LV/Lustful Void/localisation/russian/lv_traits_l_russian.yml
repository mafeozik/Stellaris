trait_lv_small_penis: "Мелкий пенис"
trait_lv_small_penis_desc: "§LСамцы этого вида очень стесняются своих маленьких пенисов. Из-за мелкого пениса и ревности, эти самцы испытывают некоторую враждебность по отношению к другим видам, опасаясь, что они могут украсть их самок.§!\n"
trait_lv_small_penis_effect: "§LЩекотливая тема:§!\n§WСчастье:: §R-5%§!§!\n§WСкорость прироста населения: §R-10%§!§!\n§WРост населения от иммиграции: §R-20%§!§!\n§LПривлекательность ксенофобии: §Y+10%§!§!\n\n§LПониженная выработка спермы:§!\n§WПроизводительность пищи от переработки: §R-0.5§!§!\n\n§WПроизводительность секс-работ: §R-20%§!§!\n§WОтношение: §R-10§!§!\n"

