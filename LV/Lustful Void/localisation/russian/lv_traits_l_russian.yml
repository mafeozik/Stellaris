trait_lv_aphrodisiac_cum: "Сперма афродизиак"
trait_lv_aphrodisiac_cum_desc: "§LЧтобы обеспечить успешное оплодотворение, самцы этого вида производят сперму, насыщенную мощным афродизиаком. Выделяемые феромоны сами по себе довольно сильны, но наиболее эффективны при контакте с кожей и тем более при попадании внутрь.§!\n"
trait_lv_aphrodisiac_cum_effect: "§LНатуральный афродизиак:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§LФетиш на минет:§!\n§WМораль армии: §G+10%§!§!\n§WЕдинство от деятельности: §G+5%§!§!\n§WРазмер империи от поселений: §G-10%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y5§!§!\n\n§BПродвинутая черта:§!\n§WПоселения с этой чертой производят §YЗро§! При работе на молочной ферме.§!\n"

trait_lv_addictive_cum: "Восхитительная сперма"
trait_lv_addictive_cum_desc: "§LЧтобы сохранить своих партнеров по размножению, самцы этого вида развили особый вид эякуляции, чтобы производить вызывающие привыкание соединения. Семенная жидкость содержит натуральные наркотики, которые могут дать особые ощущения, но наиболее эффективны при потреблении или через анальный секс, вызывает эйфорию, ступор. Этот вызывающий привыкание эффект не ограничивается только самками этого вида, но и влияет на других в разлиной степени.§!\n"
trait_lv_addictive_cum_effect: "§LМощнейший афродизиак:§!\n§WСкорость прироста населения: §G+25%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§LПоклонение пенису:§!\n§WМораль армии: §G+20%§!§!\n§WСчастье:: §G+10%§!§!\n§WЕдинство от деятельности: §G+10%§!§!\n§WИспользование жилья населением: §G-10%§!§!\n§WРазмер империи от поселений: §G-20%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y15§!§!\n\n§BПродвинутая черта:§!\n§WПоселения с этой чертой производят §YТёмную Материю§! При работе на молочной ферме.§!\n"

# Physical #

trait_lv_excess_testosterone: "Избыток тестостерона"
trait_lv_excess_testosterone_desc: "§LУ этого вида вырабатывается слишком много тестостерона, выражающееся в хорошо выраженной мускулатуре, повышенном либидо и увеличенных пенисах. Это также вызвало появление альфа-менталитета который побуждает к неприрывной борьбе власть порождающую множество конфликтов.§!\n"
trait_lv_excess_testosterone_effect: "§LОчень мужественные:§!\n§WУрон армии: §G+15%§!§!\n§WМинералы от деятельности: §G+10%§!§!\n§WПища от деятельности: §R-10%§!§!\n§WЕдинство от деятельности: §G+10%§!§!\n\n"

trait_lv_large_penis: "Большой пенис"
trait_lv_large_penis_desc: "§LСамцы этого вида в среднем имеют большие пенисы. Хотя это и не доставляет неудобств, некоторые сексуальные партнеры могут счесть свой первый раз несколько пугающим.§!\n"
trait_lv_large_penis_effect: "§LПривлекает внимание:§!\n§WСкорость прироста населения: §G+5%§!§!\n§WРост населения от иммиграции: §G+5%§!§!\n\n§LПроизводят много спермы:§!\n§WПроизводительность пищи от переработки: §G+0.25§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y10§!§!\n"

trait_lv_huge_penis: "Огромный пенис"
trait_lv_huge_penis_desc: "§LСамцы этого вида имеют непропорционально огромные пенисы. Брачные ритуалы сложны, ради обеспечения максимального удовольствия при минимальной опасности для сексуальных партнеров.§!\n"
trait_lv_huge_penis_effect: "§LОчень сильно привлекают внимание:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+10%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n§WПроизводительность от деятельности: §R-5%§!§!\n\n§LПроизводят кучу спермы:§!\n§WПроизводительность пищи от переработки: §G+0.5§!§!\n\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y10§!§!\n"

trait_lv_multiple_penises: "Множество пенисов"
trait_lv_multiple_penises_desc: "§LСамцы этого вида обладают несколькими пенисами как для удовольствия, так и для генетической конкуренции. Во время спаривания самцы могут осеменять несколько самок одновременно или полностью занимать одну самку, чтобы предотвратить проникновение другого самца.§!\n"
trait_lv_multiple_penises_effect: "§LМножественные проникновения:§!\n§WСкорость прироста населения: §G+10%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§LПроизводят много спермы:§!\n§WПроизводительность пищи от переработки: §G+1§!§!\n\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_equine_penis: "Лошадиный пенис"
trait_lv_equine_penis_desc: "§LУ этого вида большие пенисы, похожие на лошадиные. В то время как их внушительный ребристый внешний вид заставляет окружающих чувствовать себя немного неуютно, обычно это происходит из-за скрытого желания.§!\n"
trait_lv_equine_penis_effect: "§LВпечатляющий обхват:§!\n§WСкорость прироста населения: §G+15%§!§!\n§WРост населения от иммиграции: §G+25%§!§!\n\n§LВстает на пути:§!\n§WРесурсы от деятельности: §R-5%§!§!\n\n§LОбильное производство спермы:§!\n§WПища от переработки: §G+1§!§!\n\n§WПроизводительность секс работ: §G+30%§!§!\n§WОтношение: §Y20§!§!\n"

trait_lv_high_volume_ejaculations: "Большой объём эякуляции"
trait_lv_high_volume_ejaculations_desc: "§LСамцы этого вида - машины для размножения, производящие неприличное количество спермы за раз. Их предки отдавали предпочтение количеству, а не качеству, при производстве потомства, эффективно заполняя утробу самки и раздувая ее, как если бы она была на ранней стадии беременности. Они требуют регулярного высвобождения и стремятся к нему очень часто.§!\n"
trait_lv_high_volume_ejaculations_effect: "§LДуш из спермы:§!\n§WСкорость прироста населения: §G+15%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§LВсе всегда липкое:§!\n§WСчастье:: §R-5%§!§!\n§WПроизводительность пищи от переработки: §G+2§!§!\n§WПотребление товаров массового спроса населением: §R+10%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n"

