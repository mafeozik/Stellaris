trait_lv_pheromone_generators: "Генератор феромонов"
trait_lv_pheromone_generators_desc: "§LЭти устройства оснащены сложными синтезаторами, способными воссоздавать сложные феромоны, используемые биологическими препаратами. Он в основном используется для связи и для смягчения любой враждебности, которая может быть направлена против подразделения.§!\n"
