trait_lv_aphrodisiac_milk: "Молоко афродизиак"
trait_lv_aphrodisiac_milk_desc: "§LЭтот вид имеет естественный, но низкий уровень лактации. Как неотъемлемая часть их цикла размножения, они также развили специализированные железы используюя их как часть брачного ритуала. При возбуждении эта железа выделяет мощный афродизиак в грудное молоко, которое затем скармливается одному или нескольким сексуальным партнерам.§!\n"
trait_lv_aphrodisiac_milk_effect: "§LНатуральный афродизиак:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n\n§LКультура объятий:§!\n§WЕдинство от деятельности: §G+10%§!§!\n§WИспользование жилья населением: §G-10%§!§!\n§WРазмер империи от поселений: §G-10%§!§!\n\n§WПродуктивность молочных коров: §G+5%§!§!\n§WПроизводительность секс-работ: §G+10%§!§!\n\n§BПродвинутая черта:§!\n§WПоселения с этой чертой производят §YЗро§! При работе на молочной ферме.§!\n"

# Physical #

trait_lv_excess_estrogen: "Избыток эстрогена"
trait_lv_excess_estrogen_desc: "§LУ этого вида вырабатывается слишком много эстрогена. Такие атрибуты, как грудь, бедра и так далее, стали чрезвычайно подчеркнутыми. Кожа гладкая, как шелк, грудь большая и упругая, бедра шире, а ляшки больше. Сотрудничащие, общительные и крайне дружелюбные, они кажутся такими же ручными и покорными, как домашние питомцы.§!\n"
trait_lv_excess_estrogen_effect: "§LОчень женственные:§!\n§WУрон армии: §R-15%§!§!\n§WМинералы от деятельности: §R-10%§!§!\n§WПища от деятельности: §G+10%§!§!\n§WЕдинство от деятельности: §G+10%§!§!\n\n§WПродуктивность молочных коров: §G+10%§!§!\n\n"

trait_lv_litters: "Выводковые"
trait_lv_litters_desc: "§LУ этого вида рождение чаще всего приводит к появлению нескольких детей, и из-за их сексуальных наклонностей каждый ребенок может быть зачат разными отцами. Таким образом, для самок этого вида характерно искать нескольких партнеров, которые, по ее мнению, дадут самое здоровое потомство.§!\n"
trait_lv_litters_effect: "§LМного детей:§!\n§WСкорость прироста населения: §G+35%§!§!\n§WИспользование жилья населением: §R+10%§!§!\n§WРазмер империи от поселений: §R+10%§!§!\n"

trait_lv_large_breasts: "Большая Грудь"
trait_lv_large_breasts_desc: "§LЭтот вид имеет большие груди для привлечения противопложного пола. Брачные традиции привели к тому, что у этого вида грудь больше, чем у большинства других видов, так-же у них имеется заметное увеличение количества и качества молока при наличии спейциальных добавок используемых на фермах.§!\n"
trait_lv_large_breasts_effect: "§LОтвлекают:§!\n§WУрон морали армии: §G+5%§!§!\n§WРост населения от иммиграции: §G+5%§!§!\n\n§LУлучшенное производство молока:§!\n§WПроизводительность пищи от переработки: §G+0.25§!§!\n\n§LКоровам нужно больше еды:§!\n§WСодержание  коров: §R+25%§!§!\n\n§WПродуктивность молочных коров: §G+10%§!§!\n§WПроизводительность секс-работ: §G+5%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_huge_breasts: "Гигансткая грудь"
trait_lv_huge_breasts_desc: "§LЭтот вид использует грудь в качестве демонстрации своего брачного потенциала, в результате конкуренции и селективного размножения они стали поистине огромными. Они также развили крепкую мускулатуру, чтобы компенсировать перевес, который вызывают эти колоссальные груди.§!\n"
trait_lv_huge_breasts_effect: "§LОчень отвлекают:§!\n§WСчастье:: §G+5%§!§!\n§WУрон морали армии: §G+15%§!§!\n§WРост населения от иммиграции: §G+15%§!§!\n§WПроизводительность от деятельности: §R-5%§!§!\n\n§WПроизводят больше молока:§!\n§WПроизводительность пищи от переработки: §G+1§!§!\n\n§LКоровам нужно больше еды:§!\n§WСодержание  коров: §R+50%§!§!\n\n§WПродуктивность молочных коров: §G+20%§!§!\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y15§!§!\n"

trait_lv_multiple_breasts: "Множество грудей"
trait_lv_multiple_breasts_desc: "§LЭтот вид обладает множеством грудей, которые обычно встречаются у видов, рождающих множество особей за раз. Хотя большинство из них в основном избыточны, они могут использоваться ради дойки молока, при соблюдении определенных гормональных условий и сексуальной активности.§!\n"
trait_lv_multiple_breasts_effect: "§LИногда отвлекают:§!\n§WУрон морали армии: §G+5%§!§!\n§WРост населения от иммиграции: §G+5%§!§!\n\n§WПроизводят больше молока:§!\n§WПроизводительность пищи от переработки: §G+1.5§!§!\n\n§LКоровам нужно больше еды:§!\n§WСодержание  коров: §R+75%§!§!\n\n§WПродуктивность молочных коров: §G+10%§!§!\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_fuckable_nipples: "'Fuckable' соски"
trait_lv_fuckable_nipples_desc: "§LЭтот вид разработал своеобразный метод грудного вскармливания, развив проход внутри молочных желез и растягивающиеся соски для накопления и выделения большого объема молока. Хотя они в основном используется в качестве вторичного хранилища для молока, они также очень часто используются для секса и могут даже хранить большое количество спермы.§!\n"
trait_lv_fuckable_nipples_effect: "§LЭрогенные груди:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §R-20%§!§!\n\n§LПревосходная производительность молока:§!\n§WПроизводительность пищи от переработки: §G+3§!§!\n\n§LКоровам требуется больше еды::§!\n§WСодержание  коров: §R+150%§!§!\n\n§WПродуктивность молочных коров: §G+40%§!§!\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y10§!§!\n"

trait_lv_high_volume_lactation: "Высокий Объем Лактации"
trait_lv_high_volume_lactation_desc: "§LЭтот вид производит чрезмерное количество молока. Гиперактивность молочных желез привела к тому, что грудь стала большой, упругой и нежной, требующей многократного доения в день. Несоблюдение этого требования приведет к постоянной протечке, которую можно легко измерить в литрах в час..§!\n"
trait_lv_high_volume_lactation_effect: "§LЭффективная производительность молока:§!\n§WСодержание  коров: §G-50%§!§!\n\n§LВечная лактация:§!\n§WПроизводительность пищи от переработки: §G+1§!§!\n§WПотребление товаров массового спроса населением: §R+10%§!§!\n\n§WПродуктивность молочных коров: §G+20%§!§!\n§WПроизводительность секс-работ: §G+5%§!§!\n"

trait_lv_highly_nutritious_milk: "Очень питательное молоко"
trait_lv_highly_nutritious_milk_desc: "§LЭтот вид специализировался на производстве молока. Гораздо более питательное чем у большинства видов, оно может похвастаться и другими преимуществами, такими как увеличение мышечной массы и снятие усталости. Оно теряет эффект пропорционально времени, поэтому большинство предпочитает пить 'прямо из-под крана'.§!\n"
trait_lv_highly_nutritious_milk_effect: "§LПолезное и питательное:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§WПриспособленность: §G+5%§!§!\n§Продолжительность жизни лидера: §G+10§!§!\n\n§WПродуктивность молочных коров: §G+20%§!§!\n"

trait_lv_fizzy_milk: "Газированное молоко"
trait_lv_fizzy_milk_desc: "§LГруди этого вида являются домом для многих полезных бактерий. Эти бактерии атакуют чужеродные организмы и даже убивают раковые клетки. Побочными эффектами их ингибирования являются постоянно индуцируемая лактация и низкий уровень нейтральных газов, в результате чего у этого вида молоко получается немного более густым и шипучим. В результате скопления газов этот вид также подвержен случайному выбросу струек молока.§!\n"
trait_lv_fizzy_milk_effect: "§LПокалывание и чувствительность груди:§!\n§WСчастье:: §G+5%§!§!\n§Продолжительность жизни лидера: §G+10§!§!\n\n§LОтвлекают:§!\n§WПроизводительность от деятельности: §R-5%§!§!\n\n§WПродуктивность молочных коров: §G+20%§!§!\n§WПроизводительность секс-работ: §G+10%§!§!\n\n§BПродвинутая черта:§!\n§WПоселения производят §YЭкзотические газы§! При работе на молочной ферме.§!\n"

trait_lv_drooling_vagina: "Текущая вагина"
trait_lv_drooling_vagina_desc: "§LСамки этого вида склонны к приступам интенсивной и продолжительной сексуальной активности. Чтобы облегчить этот период, они постоянно производят обильное количество вагинальной смазки. Им требуется специальная одежда, которая служит только для того, чтобы обнажить их слюнявую киску.§!\n"
trait_lv_drooling_vagina_effect: "§LЛегко рожают:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§LТребуется особая одежда:§!\n§WПотребление товаров массового спроса населением: §R+20%§!§!\n\n§WПродуктивность молочных коров: §G+5%§!§!\n§WПроизводительность секс-работ: §G+15%§!§!\n"

trait_lv_shapely_ass: "Стройная Попка"
trait_lv_shapely_ass_desc: "§LУ самок этого вида большие и стройные задницы, которые часто сравнивают с каким-нибудь сочным фруктом и вызывают вожделение. При интенсивных брачных ритуалах самкам требовалась дополнительная подкладка, чтобы стать более выносливыми любовниками.§!\n"
trait_lv_shapely_ass_effect: "§LПрекрасные задницы!:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+5%§!§!\n§WРост населения от иммиграции: §G+10%§!§!\n§WПриспособленность: §G+5%§!§!\n\n§WПроизводительность секс-работ: §G+10%§!§!\n§WОтношение: §Y5§!§!\n"

trait_lv_breeder_hips: "Идеальные бёдра"
trait_lv_breeder_hips_desc: "§LСамок этого вида часто сравнивали с древними богинями плодородия, у них были красивые, подтянутые задницы и удивительно широкие бедра. Ритуалы размножения этого вида интенсивны, продолжительны и часты.§!\n"
trait_lv_breeder_hips_effect: "§LСочные ягодицы:§!\n§WСчастье:: §G+5%§!§!\n§WСкорость прироста населения: §G+10%§!§!\n§WРост населения от иммиграции: §G+20%§!§!\n§WПриспособленность: §G+10%§!§!\n\n§WПроизводительность секс-работ: §G+20%§!§!\n§WОтношение: §Y10§!§!\n"

