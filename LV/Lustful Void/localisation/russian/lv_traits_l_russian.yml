# Physical #

trait_lv_small_breasts: "Маленькая грудь"
trait_lv_small_breasts_desc: "§LУ самок этого вида грудь гораздо меньше, чем у большинства видов, но не настолько мала, чтобы считать её неэффективной для грудного вскармливания. При таком недостатке массы самки развили более спортивное или атлетическое телосложение и стали в целом более стройными.§!\n"
trait_lv_small_breasts_effect: "§LПочтти не отвлекает:§!\n§WПроизводительность от деятельности: §G+5%§!§!\n\n§LПониженное производство молока:§!\n§WПроизводительность пищи от переработки: §R-1§!§!\n\n§LКоровам нужно меньше еды:§!\n§WСодержание  коров: §G-50%§!§!\n\n§WПродуктивность молочных коров: §R-20%§!§!\n"

trait_lv_watery_milk: "Водянистое молоко"
trait_lv_watery_milk_desc: "§LКачество молока у самок этого вида ужасное. Неэффективные молочные железы вырабатывают жидкое, часто называемое водянистым, молоко, которое имеет низкую питательную ценность, в сравнении с большинством других видов. Они прибегли к использованию домашних животных, чтобы компенсировать это.§!\n"
trait_lv_watery_milk_effect: "§LНеэффективные молочные железы:§!\n§WСчастье:: §R-5%§!§!\n§WСкорость прироста населения: §R-10%§!§!\n§WПриспособленность: §R-5%§!§!\n§Продолжительность жизни лидера: §R-10§!§!\n\n§WПродуктивность молочных коров: §R-15%§!§!\n"

