site_lv_srelic: "Searching for Answers"
site_lv_srelic_intro: "§LThis system has many odd features, and this relic world may hold the answers.§!"

lv_arcsite_events.11.name: "Finding Purpose"
lv_arcsite_events.11.desc: "§LIt seems that this society never aspired to venture beyond their home system and instead focused all of their efforts towards one thing: fucking. It seems that they were so focused on sexual gratification that everything else was secondary, and remnants of their fluids can be found all across the planet.§!"
lv_arcsite_events.12.name: "Library of Pleasures"
lv_arcsite_events.12.desc: "§LThe archaeology team has discovered the remnants of what appears to be a giant library filled with many documents created by the dead civilization. While most of the files are pornographic in nature, it seems that they may have stored more important documents as well.§!"
lv_arcsite_events.13.name: "The Vault of Glass"
lv_arcsite_events.13.desc: "§LWhile searching through the library, the team found a hidden tunnel that led to a large underground vault. A majority of the vault is filled floor to ceiling with glass computers holding even more media created by the civilization. It would seem that this holds every work ever created by the civilization. There are various offshoots from the main vault which the team has decided to investigate.§!"
lv_arcsite_events.14.name: "Outbound Signal"
lv_arcsite_events.14.desc: "§LOne of the archaeologists found that there was a hidden transmitter connected to the large database in the Vault of Glass. The signal it's giving off is entirely foreign and will take some time to decipher, but the team was able to determine that its receiver is on the shielded moon.§!"
lv_arcsite_events.15.name: "Signal Deciphered"
lv_arcsite_events.15.desc: "§LThe archaeology team was able to successfully decipher the transmission, and with the discovery of a transceiver, discovered that whatever is on the moon is actively accessing the Vault of Glass. The team has reverse-engineered the transceiver and is going to attempt communication with who (or what) is on the shielded moon.§!"
lv_arcsite_events.15.a: "Perhaps they have answers."
lv_arcsite_events.16.name: "Contact"
lv_arcsite_events.16.desc: "§LHello?\n\nHoly shit, I haven't received communications from this line in thousands of years! Y'all must be aliens, right? Damn, gonna be honest, I thought y'all would never come.§!"
lv_arcsite_events.16.a: "Who are you?"
lv_arcsite_events.16.a.response: "§LMe? Well, I'm a scientist, one of the few of my time. All I've ever wanted to do was go to the moon, but nobody else was even slightly interested.\n\n"Why would you want to go there?" they said, "just have sex with us", they said, well, FUCK THAT SHIT. I wanted to go to the moon, so I went to the damn moon. Turns out this place was just as suitable for life as the our home planet, but I knew that if the folks back home knew that they'd be sending people over here like crazy, so I developed the shield that's in place now. Had a few unintended consequences, such as extending my lifespan and not being able to turn it off, but it's been fine other than that.§!"
lv_arcsite_events.16.b: "What happened to your people?"
lv_arcsite_events.16.b.response: "§LWell, it was quite strange really. Their drive for lust was insane, it drove basically every decision they made. This lust was so strong that it gained the attention of some being from another plane of existence. It made some kind of deal with the folks down there, cause the last transmission I got was just every person on the planet saying 'yes' at the same time. When it left, all that remained was an empty planet and a weird purple ball about the size of an asteroid. The damn thing flew off somewhere, but I think it's still in the system.§!"
lv_arcsite_events.16.c: "You wouldn't happen to have any technology would you?"
lv_arcsite_events.16.c.response: "§LHaha, yes, of course I do, I am a scientist after all. I just so happen to have quite a few inventions that may be of some use to you, I'll send them over in exchange for access to alien media, cause I've almost ran out of stuff to do here.§!"
lv_arcsite_events.17.name: "Contact"
lv_arcsite_events.17.desc: "§LHaha, yes, of course I do, I am a scientist after all. I just so happen to have quite a few inventions that may be of some use to you, I'll send them over in exchange for access to alien media, cause I've almost ran out of stuff to do here.§!"
lv_arcsite_events.17.a: "Deal"

site_lv_sring: "Breaking Point"
site_lv_sring_intro: "§LThis segment of ringworld has been completely broken apart by a rogue world, exposing the innards of the structure. Maybe exploring this area will grant us some insight into what the creators of this structure had in mind.§!"

lv_arcsite_events.22.name: "Odd latch"
lv_arcsite_events.22.desc: "§LWhile exploring the wreckage, the archaeology team found a latch which seems to lead into a rather undamaged section of the ring. It's locked, so it will take some time to get through.§!"
lv_arcsite_events.23.name: "Maze of Infinitude"
lv_arcsite_events.23.desc: "§LAfter breaching through the latch, the archaeologists found a large maze that stretches in all directions. Control panels are found throughout, perhaps if we can get one working, a way can be found to something interesting.§!"
lv_arcsite_events.24.name: "Map of the Maze"
lv_arcsite_events.24.desc: "§LOnce the console was powered back on, a large maze of the structure was found, indicating an area far ahead that holds the data vaults of this ring's builders. The Archaeology team is ready to go, but the journey through the maze will take some time.§!"
lv_arcsite_events.25.name: "Server Stacks"
lv_arcsite_events.25.desc: "§LAfter some time, we have found the servers. While some are damaged, the archaeologists have been able to turn a few on. As of now they are searching through the archives for information regarding the ring and its builders. They will contact us when they've found everything they can.§!"
lv_arcsite_events.26.name: "A Horrible Fate"
lv_arcsite_events.26.desc: "§LThe archaeology team have found out much about this ring and its builders from these archives. They initially built the ring for themselves to live on, a new colony for their vast empire. However, they were forced to abandon it after an unknown force only known as 'The End' deleted every sentient lifeform in their empire from existence. This is only known because of an AI that continued recording data after they died. While this AI's data core was destroyed with this ring segment, it left coordinates to various caches before now undiscovered resources.§!"
lv_arcsite_events.26.a: "A tragic fate, we'll use these resources well."

site_lv_golden_rod: "Colony Ruins"
site_lv_golden_rod_intro: "§LScans of [From.Planet.GetName] show a dense distribution of structures in an area in the northern hemisphere. Further imagining reveal that a relatively small pre-industrial civilization must have lived here once.§!"

lv_arcsite_events.31.name: "City Exploration"
lv_arcsite_events.31.desc: "§LAn expedition of archaeologists was sent down to examine the ruins. On first observations, the ruins revealed many buildings made out of marble and stone. Most of them are decrepit and overgrown, but they must have been highly skilled architects judging by some of the details and shapes still visible on the building blocks.\n\nA large forest sits on the outskirts of the city, but tools and remains of cobblestone roads suggest it used to be a vast network of pastures and fields.§!"
lv_arcsite_events.32.name: "Investigating the Insides"
lv_arcsite_events.32.desc: "§LAfter investigating a fairly intact house, science officer [Root.GetLeaderName] found something very curious. The walls on the inside which were hardly weathered are covered in reliefs of animals, some of which are bipedal. This could suggest a mammalian civilization which also utilized mammalian farm animals. But aside from that, there are reoccurring references to something that might translate to the '§YGolden Rod§!' or something similar.\n\nThe rest of the team had similar findings in other buildings.§!"
lv_arcsite_events.32.a: "Find it!"
lv_arcsite_events.33.name: "Up the Mountain"
lv_arcsite_events.33.desc: "§LThe team led by science officer [Root.GetLeaderName] left the city to follow a strongly weathered road leading up the mountain. From there, they could overlook the entire city and make additional notes. The city might have had a population of 30 000 to 80 000 people which seems average for a civilization of such a level of technology. The city layout also revealed a large marketplace with a collapsed statue in the centre.\n\nEventually, the team reached a dead end on a plateau on the side of the mountain.§!"
lv_arcsite_events.34.name: "Getting Inside"
lv_arcsite_events.34.desc: "§LAfter removing layers of vines, the team found an entrance: A large door with more carvings of animals and signs on it. The absence of a lever or anything similar suggests that it can either only be opened from the inside or with a hidden trigger. Not wanting to waste time trying to find something that might not be there, the team unloaded their plasma cutters and began cutting open the door.§!"
lv_arcsite_events.35.name: "We're in"
lv_arcsite_events.35.desc: "§LThe door has been breached and given way to a vast tunnel made out of marble with the most impressive masonry work we've seen so far. Surprisingly the cave is well illuminated by glowing fungi covering the ceiling, and frequent gaps also let in bits of sunlight.\n\nIn front of the team lays an obvious path leading deeper into the mountain, so they decide to follow it.§!"
lv_arcsite_events.36.name: "Curious Statues"
lv_arcsite_events.36.desc: "§LAlong the path, there are now statues to the left and right. They are bipedal and mammalian and probably based on their former owners. Most of them appear as what we would call 'equine' and are covered in what represents beautiful garments. It is safe to assume that the population wore something similar.\n\nFollowing the path of statues, the team noticed a decrease in clothing. The further they go, the fewer garments cover the statue's body until they become completely naked.§!"
lv_arcsite_events.37.name: "Is this it?"
lv_arcsite_events.37.desc: "§LThe path of statues ended, and the large tunnel led to an immense cave. A few massive stone statues, used as pillars, are holding up the very tall ceiling, while this part of the cavern is still well-lit by the luminous fungus. Towards the centre of the room, the path turns into stairs leading up a reasonably large pyramid. On their way to the top, the team notices a massive throne with another statue sitting on it with a huge bowl in front of it.\n\nWhen they reach the top, they are both shocked and surprised. The bare bodies of the statues are nothing new, but this one is unique. It has a massive golden equine-like penis! Is this it? Is this the '§YGolden Rod§!'? It's not what we expected, but it's the only golden thing we've found so far, and it certainly has a central role in this place.§!"
lv_arcsite_events.37.a: "Is this it?"
lv_arcsite_events.38.name: "The Incident"
lv_arcsite_events.38.desc: "§LTrying to confirm the identity of the '§YGolden Rod§!' as the equine-like penis in the statue's lap, the team investigated the throne and its surrounding when they got interrupted by yelling. One of the archaeologists, called 'Bonnie', climbed onto the lab of the statue and yelled, 'Check this out!'.\n\nScience officer [Root.GetLeaderName] urges her to get down and stay professional, but she has other things in mind. She ignored everyone, ripped off her clothes, and mounted the §YGolden Rod§!. Even to her surprise, she slid down onto it and engulfed its massive size within seconds. She then lets out a loud moan, at which point both the golden ribbed penis and eyes of the statue begin to glow.§!"
lv_arcsite_events.38.a: "What's happening?"
lv_arcsite_events.39.name: "Transformation"
lv_arcsite_events.39.desc: "§LShe began having multiple orgasms, and then the unexpected happened. Her clit began to rapidly grow until it reached the size of her forearm and took shape of an equine penis. Still orgasming, her newly grown cock now ejaculating right into the bowl in front of the throne. She then passed out as we tried to get her down.\n\nWe are not sure exactly what just happened, but some things now make more sense while others raise more questions. From what we can tell, this is some strange ritual to somehow grow an equine penis! This suggests that the statues don't represent their creators, but the resulting species after the ceremony. The societal role of the ceremony is also a mystery. Was it for every member or a chosen few?\n\nWe will have to investigate further, but for now, we must decide what to do with the §YGolden Rod§!.§!"
lv_arcsite_events.39.a: "Remove the artefact."
lv_arcsite_events.39.a.tooltip: "§LAquire the '§YGolden Rod§!' as a relic.§!"
lv_arcsite_events.39.b: "It's alright. Open the temple for the public."
lv_arcsite_events.39.b.tooltip: "§LAdds the Temple as planetary feature with special jobs.§!"

###########################
###     Observation     ###
###########################

lv_observation_events.2.name: "Missing Scientists"
lv_observation_events.2.desc: "§LSeveral of our scientists working at the observation station orbiting §B[From.GetName]§! have gone missing. A detailed search of the station failed to locate them, but it did find a missing escape pod.§!"
lv_observation_events.2.a: "We must find them quickly."

lv_observation_events.3.name: "Death of a Scientist"
lv_observation_events.3.desc: "§LIt took our search team a mere hour to locate the escape pod. It was immediately clear that the pod had somehow malfunctioned and hit the ground at high speeds. Surprisingly one of the scientists had survived the crash and managed to drag themself into the wilderness, leaving a trail of blood. Several hours later, the search team found their body.§!"
lv_observation_events.3.a: "Why did they do this?"

lv_observation_events.5.name: "Strange Reports from [From.GetName]"
lv_observation_events.5.desc: "§LWe are receiving strange reports from our observers above §B[From.GetName]§!. One of the native kingdoms has rallied under a mysterious religious figure, and we have seen evidence of them using advanced technology far beyond their current level of development. We are also witnessing a rapid change in culture as the religion our scientists are calling 'a sex cult' is taking hold. Could this be related to our missing scientist?§!"
lv_observation_events.5.a: "Fascinating."

lv_observation_events.7.desc: "§LHello, friends. You may recognize me as one of the scientists that went missing on §B[From.GetName]§!. My sudden disappearance was quite intentional, I assure you.\n\nThe natives here have come to see me as something of a god... and why shouldn't they? After much deliberation, I have decided to bring true civilization to these savages.§!"
lv_observation_events.7.a: "What has gotten into you?!"
lv_observation_events.7.a.response: "§LI was tired. Tired of short-sighted ethical constraints, tired of the ridicule I suffered at the hands of my peers. Most of all, I was tired of passive observation.\n\nHA! What nonsense! It is our DUTY to interfere with primitive cultures - to guide and shape them into something useful! Observing quietly from a distance is just a shameful way of skirting responsibility.§!"
lv_observation_events.7.b: "You will report for immediate extraction!"
lv_observation_events.7.b.response: "§LIt is too late for that, I'm afraid. I am done taking orders from those beneath my station. My intellect was at your disposal, but you chose to squander it.\n\nHere I am treated with the respect I deserve. This is my home now. With my knowledge and the technical schematics I brought with me, I will jump-start this culture and shape it into something great.§!"
lv_observation_events.7.c: "You just wanted to fuck them."
lv_observation_events.7.c.response: "§LOf course! Don't you? This is the problem with the culture of §Y[Root.GetName]§!. Too many restraints. Why should we feel shame over our natural drive to reproduce?\n\nI will tell you. We should not. I will create a utopia here. Join it or leave us alone.\n\nThere is little more to say. I bid you farewell.§!"

lv_observation_events.9.name: "Rogue Scientist Consolidates Power"
lv_observation_events.9.desc: "§LWe have received alarming reports from the surface of §B[From.GetName]§!. It looks like our rogue scientist is consolidating power by giving one of the feudal kingdoms access to advanced weaponry, which are now in the process of conquering the rest of the planet in their name.\n\nA plan has been put forward to remove them from power, but it will require significant ground forces. There is no telling what effect this will have on the native population, as many have come to see the scientist as a god.§!"
lv_observation_events.9.a: "The operation is a go."
lv_observation_events.9.b: "It would only make things worse..."

lv_observation_events.10.name: "Successful Extraction"
lv_observation_events.10.desc: "§LWe have successfully extracted the rogue scientist from §B[From.From.GetName]§!! Hundreds of natives were tragically gunned down when they launched suicidal attacks against our forces in a futile attempt to protect their 'god'.\n\nOur legal system will now deal with the scientist, but the impact of these events on the [From.From.GetPlanetMoon]'s civilization must be immense. They still possess some of our technology, they are still incredibly sexually liberal, and their deity has just been spirited away by invaders from the stars.§!"
lv_observation_events.10.a: "At least one problem has been dealt with."

lv_observation_events.12.name: "Religious Conflicts on [From.GetName]"
lv_observation_events.12.desc: "§L§B[From.GetName]§! has descended into a massive war following the successful extraction of our rogue scientist. The empire they built has fragmented into several quarrelling factions, each with their own interpretation of his religious dogma.\n\nFighting has been particularly fierce due to the destructive weaponry the natives are now using. Several radiological 'dirty bombs' have so far been detonated by the opposing factions, and it looks like the conflict is only getting started. The 'Sexy Cult' is still going strong, but has taken a dark turn. Sexual assault and rape has replaced consensual sex as the conflict intensifies.§!"
lv_observation_events.12.a: "Concerning."

lv_observation_events.14.name: "Situation Calms on [From.GetName]"
lv_observation_events.14.desc: "§LThe situation on §B[From.GetName]§! seems to have settled down a bit since the successful extraction of our rogue scientist. Without him to interpret the data, the technical schematics he brought with him are of no use to them. They have started reverting back to their old ways, although they are still quite sexually liberal.§!"
lv_observation_events.14.a: "Some good news at last."

lv_observation_events.16.name: "Missile Strikes Observation Outpost!"
lv_observation_events.16.desc: "§LA barrage of surface-to-space missiles has been launched from the surface of §B[From.GetName]§! at our Observation Outpost! The station was destroyed with no survivors.\n\nIt looks like the primitive civilization on the [From.GetPlanetMoon]'s surface is continuing to advance at an incredible rate - even though we removed the influence of their so-called 'god'. The technology they gave them must have triggered a lasting scientific revolution.§!"
lv_observation_events.16.a: "This is why we need the Non-interference Directive."

lv_observation_events.18.desc: "§LSpirits protect me! You look like our Holy Saviour, yet the differences are telling. They spoke of daemons who would mimic Their appearance, and that might one day descend from the heavens to steal Them away. The prophecy came true, and there is no doubt in my mind that it was your doing.\n\nWhere is our Holy Saviour, wretched creature? I demand Their immediate release!§!"
lv_observation_events.18.a: "Your 'Holy Saviour' was just a scientist."
lv_observation_events.18.a.response: "§LOn my world, slandering the name of the Holy Saviour is an unforgivable sin punishable by death. It is only through Their magical inventions that our civilization managed to achieve all that it has. I will forgive your blasphemy, so long as you return the Holy Saviour to us.§!"
lv_observation_events.18.b: "They was executed for their crimes against your people."
lv_observation_events.18.b.response: "§LYou... you murdered the Holy Saviour? I... you... we... we cannot...\n\nThis... this crime will not go unpunished, daemon. Though it may take a thousand years, my people will see your daemonic empire grounded into dust!§!"
lv_observation_events.18.c: "Very well. They will be released into your custody."
lv_observation_events.18.c.response: "§LMay the Holy Saviour forgive your crimes, daemon. Perhaps there is hope for you yet.§!"

lv_observation_events.19.desc: "§LAhem. I suppose I should be thankful that you have returned me to my disciples after all these years I spent being shuttled between mental institutions...\n\nVery well. I am not past letting bygones be bygones. As long as you leave my people alone, I'm sure we can get along just fine. Space is very big after all.§!"
lv_observation_events.19.a: "We shall see."

lv_observation_events.20.desc: "§LA barrage of surface-to-space missiles has been launched from the surface of [From.From.GetName] at our observation outpost in high orbit! The station was destroyed with no survivors.\n\nIt looks like the primitive civilization on the §B[From.From.GetPlanetMoon]§!'s surface has advanced at an incredible rate - no doubt thanks to the efforts of our rogue scientist. They can no longer be considered primitive, and the window of opportunity to remove the scientist from power has been closed.§!"

lv_observation_events.22.name: "Missing Scientists Captured by Natives"
lv_observation_events.22.desc: "§LIt didn't take long for our drones and orbital satellites to discover the fate of our missing scientists. They seem to be fairing well on §B[From.GetName]§!, or at least as well as they can be given that they have been captured by the natives. It is unclear what the natives intend to do with our scientists and, unfortunately, the situation is too volatile to attempt a recovery mission.§!"
lv_observation_events.22.a: "We'll just have to bide our time."

lv_observation_events.24.name: "Scientists Sold"
lv_observation_events.24.desc: "§LOur observation station orbiting §B[From.GetName]§! has reported that a large majority of our captured scientists have been sold into slavery. National leaders and wealthy individuals from across the globe rushed to acquire what they were calling the 'Gifts from the Stars.' This will make recovering our scientists even harder now that they have been split up. At least we'll have the opportunity to view how the various cultures of [From.GetName] view our people.§!"
lv_observation_events.24.a: "We'll just have to bide our time."

lv_observation_events.26.name: "Used as Mounts"
lv_observation_events.26.desc: "§LOur observation station orbiting §B[From.GetName]§! has made a report stating that several of our captured scientists were rode in a fashion similar to mounts as their new owners travelled to their homeland. Our scientists, those still on the station, are unsure whether this is simply some display of domination over the "Gifts from the Stars", if they actually view our people as being mounts, or if there are some sexual elements to this behaviour. Our scientists, those on the station, are quick to point out that the stripping of the captured scientists' clothes and the forced piercing of many of them, while having sexual connotations in our culture, may not be in theirs.§!"
lv_observation_events.26.a: "We'll just have to bide our time."
lv_observation_events.26.b: "Savages!"
lv_observation_events.26.c: "At least we can learn about their culture."

lv_observation_events.28.name: "Kept as Domestic Slaves"
lv_observation_events.28.desc: "§LOur observation station orbiting §B[From.GetName]§! has made another report about our captured scientists. Those taken to the more advanced nations on [From.GetName] are being used as domestic slaves. Their primary duties seem to involve housekeeping and entertainment, although a large number of them are also being used as secretaries or aids for administrative duties.\n\nA large number of these domestic slaves are also being used to meet the sexual needs of their masters. While it is clear that the two species cannot produce offspring, the inhabitants of §B[From.GetName]§! may decide to intentionally breed our captured scientists.§!"
lv_observation_events.28.a: "We'll need to act soon."
lv_observation_events.28.b: "Maybe this situation isn't so bad..."

lv_observation_events.30.name: "Soon to be Bred"
lv_observation_events.30.desc: "§LIt has become clear that the people of §B[From.GetName]§! have determined that they will be receiving no further 'Gifts from the Stars' and so they have decided to simply make more of them themselves. The various countries around the globe have each concocted their own means of breeding our captured scientists. Some cultures are forcing the males to rape the females. Others are 'letting nature take its course' by ensuring the males and females have ample opportunities to reproduce. Regardless of the methods employed, it has become clear to us that soon our captured scientists will be bringing their children into the world.\n\\nWe must act now. Our generals have prepared a plan. We will deploy special forces teams all across the globe to simultaneously retrieve our scientists.§!"
lv_observation_events.30.a: "Mission is a go."
lv_observation_events.30.b: "Its about time!"
lv_observation_events.30.c: "Its too risky."

lv_observation_events.31.name: "Extraction Successful"
lv_observation_events.31.desc: "§LThe mission went better than expected. All of our scientists were extracted and we managed to keep native casualties to a bare minimum. Our observation station is reporting that the natives have no idea what occurred with some believing that the 'Gifts from the Stars' ascended to 'Heaven' and others believing our captured scientists were always just a figment of their imaginations. Of course, some of the more rational natives believe the truth, that we extracted our people, but they have no evidence to support their claims.§!"
lv_observation_events.31.a: "Give my regards to our special forces."

lv_observation_events.32.name: "Residents of the World Forever More"
lv_observation_events.32.desc: "§LWe've failed to extract our scientists before they began producing offspring. Now we will likely never recover our people, at least not unless we are willing to fully invade the country to do so.§!"
lv_observation_events.32.a: "What's done is done."

lv_observation_events.202.name: "Close Encounters of the Probing Kind"
lv_observation_events.202.desc: "§LOur scientists in orbit around §B[From.GetName]§! has begun to experiment on its inhabitants in order to get a firm understanding of their sexual characteristics. Thus far this has mainly involved sending droids equipped with dildos and other sexual toys and employing them to 'probe' the locals. The locals' reactions towards the droids have been split: many fear or hate them while some seem to like the probing, even going so far as to isolate themselves in the wilderness in the hopes of attracting our probing droids.§!"
lv_observation_events.202.a: "Fascinating."

lv_observation_events.204.name: "Breeding Experiments"
lv_observation_events.204.desc: "§LRecently our scientists in orbit around §B[From.GetName]§! has begun to experiment on the locals in order to better understand how they react sexually under different circumstances. These experiments range from simply putting two naked subjects of different sex in the same room to forcing the males to perform sexual intercourse with the females. Our scientists assure us that they are learning many interesting and useful things.§!"
lv_observation_events.204.a: "Fascinating."
lv_observation_events.204.b: "We can learn something even from uncivilized savages."
lv_observation_events.204.c: "Onwards! For science!"

lv_observation_events.206.name: "Probing Continued"
lv_observation_events.206.desc: "§LFeeling that their breeding experiments had hit a dead end, our scientists decided to continue the sexual probing of the locals of §B[From.GetName]§!. While they claim to be making great breakthroughs, some critics state that our scientists are simply probing the locals for the fun of it. Regardless, our scientists have noted a marked increase in pleasure of their test subjects.§!"
lv_observation_events.206.a: "What could it mean?"
lv_observation_events.206.b: "Of course disgusting xenos would want to be probed."
lv_observation_events.206.c: "Onwards! For science!"

lv_observation_events.208.name: "Masochistic Tendencies"
lv_observation_events.208.desc: "§LOur scientists aren't sure why, but their continued probing of the locals of §B[From.GetName]§! has caused them to become very submissive and noticeably more masochistic. They now yearn for the stress caused by our abductions and the pain that sometimes came with them. Some of our scientists claim that the locals were always like this, just that the traits had become subdued over time. Others believe that the locals became submissive and masochistic as a means of coping with our experiments. Regardless of the reason, this has likely become a permanent change for them.§!"
lv_observation_events.208.a: "Interesting."
lv_observation_events.208.a.tooltip: "All pops on [From.GetName] get the Submissive and Masochistic traits and become xenophiles."

lv_observation_events.209.name: "Breeding Experiments Continued"
lv_observation_events.209.desc: "§LOur scientist in orbit around §B[From.GetName]§! has moved their breeding experiments on to the next phase. They have begun to conduct experiments to see how the locals react to sexual intercourse with ours and other species. Some critics have pointed out that we already know that the locals won't be able to bare the children of any creature not native to their world, but that is not the point. Our scientists are trying to see how exactly the locals' genitals interact and handle the genitals of creatures foreign to their biosphere.§!"
lv_observation_events.209.a: "Carry on."
lv_observation_events.209.b: "So some of our people have actually fucked them? Gross!"
lv_observation_events.209.c: "For science!"

lv_observation_events.211.name: "Breeding Experiments End"
lv_observation_events.211.desc: "§LOur scientists in orbit around §B[From.GetName]§! have learned all they can from their breeding experiments with the locals. They know exactly what the locals find most sexually stimulating and the complete ins and outs of their sexual organs. They also know, definitively now, that the locals can only breed with their own species without modification. Our scientists have reported that they are ending their breeding experiments and moving on to new projects.§!"
lv_observation_events.211.a: "Interesting."
lv_observation_events.211.b: "Finally. We can stop fucking filth."
lv_observation_events.211.c: "Guess our scientists have reached a 'climax'."

lv_observation_events.213.name: "Sexy Modification"
lv_observation_events.213.desc: "§LAfter decades of research, our scientists have begun to get a handle on the genetic code of §B[From.GetName]'s§! inhabitants. They have proposed a daring plan that, through a combination of selective viruses, genetic engineering, and surgery, would allow us to modify the locals to better meet our standards of beauty. While dubious sounding at first, numerous scientists from around our empire have reviewed the proposed subject and have stated that it looks promising.§!"
lv_observation_events.213.a: "Let's do it."
lv_observation_events.213.b: "Sounds like a waste of time."

lv_observation_events.1213.name: "Sexy Modification Completed"
lv_observation_events.1213.desc: "§LOur project of modifying the locals of §B[From.GetName]§! to better meet our standards of beauty has been successfully completed.§!"
lv_observation_events.1213.a: "They look so much better!"

#lv_observation_events.302.name: "Lustful Machinations"
#lv_observation_events.302.desc: "§LOur infiltration of §B[From.GetName]§! has proceeded faster than we first expected when our agents began to use their cyber sextoys to convert some of the local leaders to our cause. Perhaps it shouldn't be too surprising that our self-lubricating 'massaging' machines have been so successful given that they can bring the locals to heights of ecstasy few of them have ever felt before.§!"
#lv_observation_events.302.a: "Sex sells!"

