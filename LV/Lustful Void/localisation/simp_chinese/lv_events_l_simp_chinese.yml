lv_colony_events.1.name: "Invasive Tentacles"
lv_colony_events.1.desc: "§LSeveral xeno lifeforms have somehow managed to sneak onto one of our planets. This wouldn't be an issue in and of itself if it weren't for the fact that they repeatedly attempt to breed with our colonists by force. The people are afraid and the local government is seeking aid.§!"
lv_colony_events.1.a: "We'll do what we can to help."
lv_colony_events.1.b: "Send in the special forces!"
lv_colony_events.1.c: "They mean us no harm!"
lv_colony_events.1.d: "This is why we can't trust xenos!"
lv_colony_events.1.e: "These creatures are divine beings!"

lv_colony_events.2.name: "Xeno Zoo Breakout"
lv_colony_events.2.desc: "§LSome animals kept in the zoo on §B[Root.GetName]§! have broken out of their enclosures. It took the zoo staff quite a while to contain the situation. Only after the animals had successfully raped several of the zoo visitors were they subdued and finally returned to their enclosures.§!"
lv_colony_events.2.a: "How terrible!"

lv_colony_events.3.name: "Futa Sadists"
lv_colony_events.3.desc: "§LGiven the comparatively large number of sadists on §B[Root.GetName]§!, and the ability for those sadists to modify themselves and others, it shouldn't be all that surprising that a massive futa BDSM orgy has taken place. Reports indicate that most who took part did so willingly, however there is a high possibility that many individuals were forced or pressured into taking part and are too ashamed to report so.§!"
lv_colony_events.3.a: "Both violent and arousing."

lv_colony_events.4.name: "Sadist Fun"
lv_colony_events.4.desc: "§LGiven the sadist population on §B[Root.GetName]§!, it should come as no surprise that some sort of massive BDSM orgy has occurred in several of the planet's population centres. Reports indicate that most who took part did so willingly, however, there is a high possibility that many individuals were forced or pressured into taking part and are too ashamed to report so.§!"
lv_colony_events.4.a: "Both violent and arousing."
lv_colony_events.4.b: "This doesn't reflect our society's values."

lv_colony_events.5.name: "Masochist Fun"
lv_colony_events.5.desc: "§LGiven that there is a significant population of masochists on §B[Root.GetName]§!, it shouldn't come as a surprise to see a BDSM party or two from time to time. The masochists have taken to tying themselves and each other up and inflicting pain on themselves. Any sadists they could find were 'recruited' to aid them in their endeavours.§!"
lv_colony_events.5.a: "Glad they are enjoying themselves."

lv_colony_events.9.name: "Raunchy Titans"
lv_colony_events.9.desc: "§LOur governor on §B[Root.GetName]§! didn't initially believe the reports that were coming in about the titanic lifeforms trying to mate with our colonists. Soon, however, a large amount of video and photographic evidence has left little doubt that they are indeed attempting to mate with our people. Thankfully only a few of our females have been injured during these mating attempts and the injuries themselves have been minor. The local government is still attempting to determine how best to handle this situation.§!"
lv_colony_events.9.desc_phile: "§LOn colonists on §B[Root.GetName]§! have begun to call the local titanic lifeforms the 'Sex Titans' after some of them attempted to mate with willing colonists. The few females lucky enough to partake in this act claim that the Sex Titans are very caring and gentle lovers, even if their massive phalli prove to be a tad uncomfortable upon insertion.§!"
lv_colony_events.9.desc_phobe: "§LInitial reports of lustful titanic lifeforms on §B[Root.GetName]§! raping our colonists has proven to be true. Thankfully the number of rapes have been fairly low, although a large number of people have been injured either during the rape incidents or while fleeing from these rapacious monsters. The horrors our females on the planet must endure, the constant fear of penetration by the titanic lifeforms' massive phalli, is horrible. Unfortunately, the local government is at a loss as to how to handle this situation.§!"
lv_colony_events.9.a: "Nothing we can do about it."
lv_colony_events.9.b: "Sounds like some of our people had the rides of their lives."
lv_colony_events.9.c: "Disgusting!"

lv_colony_events.10.name: "Titanic Rising"
lv_colony_events.10.desc: "§LReports from §B[Root.GetName]§! indicate that the titanic lifeforms find our colonists to be increasingly attractive mates. Why this is the case is up for much debate; what isn't up to debate is the increase in the number of reported 'incidents' involving the local titanic life. The government is split between how to handle the issue with some officials wanting to do nothing while others want to eliminate, or at least contain the titanic life. Regardless of their thoughts on the matter, all of our officials on [Root.GetName] agree that they don't know how to handle the issue.§!"
lv_colony_events.10.desc_phile: "§LReports from §B[Root.GetName]§! indicate that the titanic lifeforms find our colonists to be increasingly attractive mates. Why this is the case is up for much debate; what isn't up to debate is the increase in the number of reported sexual encounters with the Sex Titans. Many of our citizens have rushed to join the 'Titan Club': people who have had intercourse with a Sex Titan much like those of centuries past who had endeavoured to have sex in an operating aircraft.§!"
lv_colony_events.10.desc_phobe: "§LReports from §B[Root.GetName]§! indicate that the titanic lifeforms find our colonists to be increasingly attractive mates. Why this is the case is up for much debate; what isn't up to debate is the increase in the number of reported rapes involving the local titanic life. Many of our females are afraid of leaving the city or even leaving their homes. Local government officials have come up with a plan to cull the number of titanic lifeforms on the planet and harvest them to feed our people.§!"
lv_colony_events.10.a: "We will do nothing for now."
lv_colony_events.10.b: "We love the Sex Titans."
lv_colony_events.10.c: "Remove these vile creatures!"

lv_colony_events.11.name: "Raunchy Titans Contained"
lv_colony_events.11.desc: "§LOur efforts to contain and prevent the local titanic lifeforms from mating with our citizens has been successful.§!"
lv_colony_events.11.a: "These steaks taste great!"
lv_colony_events.11.b: "We should learn what we can from this."

lv_colony_events.12.name: "Enraged Raunchy Titans"
lv_colony_events.12.desc: "§LOur efforts to contain the local titanic lifeforms were unsuccessful, to say the least. Even now our local defence forces are attempting to hold them back, lest they unleash the rage upon our citizens.§!"
lv_colony_events.12.a.tooltip: "Titanic beasts are raping everyone!"

lv_colony_events.13.name: "Titanic Changes"
lv_colony_events.13.desc: "§LWe've received some concerning reports from §B[Root.GetName]§!. We are not sure why, or how for that matter, but repeated sexual intercourse with the titanic lifeforms has begun to change our females at a genetic level. Their sexual organs have begun to adapt to the incredible size of the titan's phalli. Not only that, but some of the local scientists are reporting that given enough time, the genetic changes will make it so our females will be able to bare the young of the titans. They assure us that if we act quickly we can prevent this from occurring.§!"
lv_colony_events.13.desc_phile: "§LWe've received amazing news from §B[Root.GetName]§!. We are not sure why, or how for that matter, but repeated sexual intercourse with the Sex Titans has begun to change our females at a genetic level. Their sexual organs have begun to adapt to the incredible size of the titan's phalli. Not only that, but some of the local scientists are reporting that given enough time, the genetic changes will make it so our females will be able to bare the young of the titans. They assure us that if we act quickly we can prevent this from occurring, although why would we want to do that?§!"
lv_colony_events.13.desc_phobe: "§LWe've received horrifying news from §B[Root.GetName]§!. We are not sure how, but repeated rapes by the titanic lifeforms have begun to change our females at a genetic level. Their sexual organs have begun to adapt to the incredible size of the titan's phalli. Not only that, but some of the local scientists are reporting that given enough time, the genetic changes will make it so our females will be able to bare the young of the titans. These disgusting creatures can no longer be allowed to do as they please!§!"
lv_colony_events.13.a: "We shall let nature take its course."
lv_colony_events.13.b: "Why wouldn't we let nature take its course?!"
lv_colony_events.13.c: "We need to stop this."
lv_colony_events.13.d: "We need to prevent crossbreeding to preserve these amazing creatures."
lv_colony_events.13.e: "This ends. Now."

lv_colony_events.14.name: "Titanic Evolution"
lv_colony_events.14.desc: "§LJust as our scientists and doctors predicted, the colonists of §B[Root.GetName]§! have been permanently changed by their continued sexual interactions with the titanic lifeforms. Only time will tell if these changes are for better or worse.§!"
lv_colony_events.14.desc_phile: "§LAmazing! The Sex Titans have altered our colonists to be their mates. Although the changes are permanent, our scientists assure us that these changes are for the better.§!"
lv_colony_events.14.desc_phobe: "§LOur fears have come true. The titanic rapists have altered our colonists to truly be their mates. Thankfully the children of these unfortunate pairings aren't also titans, although there are no guarantees that this won't become the case in the future.§!"
lv_colony_events.14.a: "It is what it is."
lv_colony_events.14.b: "Amazing!"
lv_colony_events.14.c: "I think I'm going to throw up."

lv_colony_events.15.name: "Titanic Fun"
lv_colony_events.15.desc: "§LThe titans of §B[Root.GetName]§! continue to have sexual intercourse with our colonists. Any new arrivals to the colony almost certainly have been genetically altered to meet the titans' needs.§!"
lv_colony_events.15.desc_phile: "§LThe Sex Titans on §B[Root.GetName]§! continue to have sexual intercourse with our colonists. Any new arrivals to the colony almost certainly have been granted the same amazing changes as our previous colonists.§!"
lv_colony_events.15.desc_phobe: "§LThe disgusting rapacious titans continue to rape our colonists on §B[Root.GetName]§!. To make matters worse even the newest colonists on the planet have had their bodies altered against their wills!§!"
lv_colony_events.15.a: "It is what it is."
lv_colony_events.15.b: "Sounds like fun!"
lv_colony_events.15.c: "Disgusting."

lv_colony_events_1.1.name: "Lusting Plants"
lv_colony_events_1.1.desc: "§LWe have known of the tentacled lifeforms on §B[Root.GetName]§! for quite some time and been able to live alongside them since establishing our colony. Granted occasionally one of our females would be abducted by the lifeforms, but these cases were fairly rare and didn't have a large impact on the colony. The colonists have called them the lusty plants, although whether these lifeforms are actually plants or not is up for debate.§!"

lv_colony_events_1.2.name: "Lusting Plants"
lv_colony_events_1.2.desc: "§LRecently the lusty plants have been especially aggressive and have begun to abduct increasingly large numbers of women. The abducted females were found after the colony launched a massive search effort. The lusty plants were clearly using the women for reproductive purposes and were using their milk to nourish themselves. Interestingly enough we have learned that the lusty plants are making the planet more inhabitable for our people. Perhaps this is an attempt to trade on their part?§!"
lv_colony_events_1.2.a: "This cannot be allowed to continue."
lv_colony_events_1.2.b: "If the Lusty Plants want a deal they've got it."
lv_colony_events_1.2.c: "They have abducted our people for the last time."

lv_colony_events_1.3.name: "The Tentacled Natives"
lv_colony_events_1.3.desc: "§LWe have known of the tentacled lifeforms on §B[invasion_location.GetName]§! for quite some time and have been able to live alongside them since establishing our colony. Granted occasionally a few of our people would be abducted by the lifeforms, but these cases were fairly rare and didn't have a large impact on the colony.§!"

lv_colony_events_1.4.name: "The Tentacled Natives"
lv_colony_events_1.4.desc: "§LSomething about our presence here on the planet, however, has caused a rapid change in these creatures. Their fertility rates have skyrocketed and, while far from sapient, our scientists have noticed a marked increase in their intelligence.§!"
lv_colony_events_1.4.a: "Interesting."
lv_colony_events_1.4.b: "Our people will come to love their primitive neighbours, tentacles and all."
lv_colony_events_1.4.c: "We need to kill as many of these tentacled beasts as possible."

lv_colony_events_1.5.name: "Tentacles Festival"
lv_colony_events_1.5.desc: "§LThe time to celebrate and give thanks to our beloved Tentacles has come again! As the planet-wide festivities begin, the main event will soon take place, where we offer our bodies and minds as permanent brood-mothers, being bred and birthing new Tentacles in a never-ending orgy of sex.\n\nAlthough we do this more than willingly, our loving Tentacles reward us for being such good pets! It's up to our leaders to decide what form their blessings will take this time.\n\n§RWARNING: You will lose either a pop or a ruler doing this!§!§!"
lv_colony_events_1.5.a: "Blessing of Offspring"
lv_colony_events_1.5.a.tooltip: "§L§Y1§! Pop's worth of population becomes permanent brood-mothers and in exchange, their first offspring will be sent to live among us, adding §Y1§! Tentacle pop!§!\n"
lv_colony_events_1.5.b: "Blessing of Bloom"
lv_colony_events_1.5.b.tooltip: "§L§Y1§! Pop's worth of population becomes permanent brood-mothers and in exchange, the Tentacles will randomly transform one of our physical traits to better suit their lustful needs in the future!§!\n"
lv_colony_events_1.5.c: "Blessing of Corruption"
lv_colony_events_1.5.c.tooltip: "§L§Y1§! Pop's worth of population becomes permanent brood-mothers and in exchange, the Tentacles will randomly alter our minds so we become the perfect breeding sluts!§!\n"
lv_colony_events_1.5.d: "Blessing of Cleansing"
lv_colony_events_1.5.d.tooltip: "§L§Y1§! Pop's worth of population becomes permanent brood-mothers and in exchange, the Tentacles will randomly heal our bodies and minds by removing undesirable traits!§!\n"
lv_colony_events_1.5.e: "Blessing of Attachment"
lv_colony_events_1.5.e.tooltip: "§LOur current ruler dedicates themselves to becoming a Royal Brood-mother, leaving their seat forever. Tentacles have an almost primal nature to them, but they are also very intelligent. They recognize and lust after our leaders, to dominate and break their minds. During a so-called initiates only orgy ceremony, Tentacle Symbiotes will randomly attach to some of the participating future leaders!§!\n"
lv_colony_events_1.5.f: "Perhaps not..."

lv_colony_events_1.6.name: "Leaders Get Tentacle Symbiotes"
lv_colony_events_1.6.desc: "§LThe orgy has begun! Agile, slick little tentacled creatures are entering their host through any orifices they can fit in without hurting their new lovers. Some symbiots even have territorial disputes over a host they particularly like, trying to show the host which one can sexually satisfy them more. These symbiots, once happy with their new squishy homes, will start improving their hosts both mentally and physically over time!§!"
lv_colony_events_1.6.a: "They are so cute!"

lv_colony_war_events.1.name: "Spoils of War"
lv_colony_war_events.1.desc: "§LOur soldiers are victorious! Even now the last remnants of armed resistance on §B[lv_attacked_planet.GetName]§! is being hunted down. Our troops are mostly being well behaved, but as is the nature of soldiers and conflicts, some are taking advantage of their newfound power over the locals.§!"
lv_colony_war_events.1.a: "This is the nature of war."
lv_colony_war_events.1.b: "To the victor goes the spoils."
lv_colony_war_events.1.c: "Find and punish those responsible."

lv_colony_war_events.2.name: "Spoils of War"
lv_colony_war_events.2.desc: "§LOur soldiers have been defeated! Even now the last remnants of armed resistance on §B[lv_attacked_planet.GetName]§! is being hunted down by the enemy. The females of our armed forces are even now receiving a very intimate lesson about the meaning of the phrase 'spoils of war'.§!"
lv_colony_war_events.2.a: "This is the nature of war."
lv_colony_war_events.2.b: "This is why you fight to the last."
lv_colony_war_events.2.c: "We have received an object lesson on the evils of war."

