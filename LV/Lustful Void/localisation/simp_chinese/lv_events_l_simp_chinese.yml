###     Pop Events     ###
##########################

lv_pop_events.1.name: "Invasive Breeding"
lv_pop_events.1.desc: "§LAfter some time, our population of §Y[lv_aggressively_sexing_pop.GetSpeciesName]§! has impregnated enough females of the other local species to cause a drastic change in local demographics.§!"
lv_pop_events.1.a: "This is how we evolved."
lv_pop_events.1.b: "We might need to stop this...or not."
lv_pop_events.1.c: "Use our numbers to dominate more females!"
lv_pop_events.1.d: "Let our species members fuck everything that moves!"
lv_pop_events.1.e: "Order §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! to spare their wombs..."
lv_pop_events.1.f: "§RRape them on sight!§!"

lv_pop_events.3.name: "Parasitic Breeding"
lv_pop_events.3.desc: "§LOur population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! impregnates females of §B[Root.GetName]§! with their parasitic offspring on a planet-wide scale, causing rapid growth of their species numbers and a drop in the number of hosts.§!"
lv_pop_events.3.a: "We can always find more hosts."
lv_pop_events.3.b: "The whole galaxy will submit to us."
lv_pop_events.3.c: "Use our numbers to infest even more hosts!"
lv_pop_events.3.d: "Becoming living incubator is MANDATORY!"
lv_pop_events.3.e: "Order §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! to spare their wombs..."
lv_pop_events.3.f: "§RPut our eggs into every orifice of theirs!§!"

lv_pop_events.5.name: "Sexual Conquest"
lv_pop_events.5.desc: "§LAs the population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! continues using members of other races as incubators for their young. This resulted in the number of locals on §B[Root.GetName]§! reaching a critical point. While the last females of §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! get impregnated against their will, remnants of their civilisation 'enjoy' their last days on that planet.§!"
lv_pop_events.5.a: "As it should be."
lv_pop_events.5.b: "Another victory for our race."
lv_pop_events.5.c: "Their bodies have always belonged to us"
lv_pop_events.5.d: "At least this xeno scum was useful for us"
lv_pop_events.5.e: "This was great. Lets do this again!"
lv_pop_events.5.f: "Through servitude, they have ascended."
lv_pop_events.5.g: "Give them some time to breed their own offspring."

lv_pop_events.6.name: "Sexual Conquest"
lv_pop_events.6.desc: "§LThe numbers of §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! have reached a critical point, as the last remnants of their female population on §B[Root.GetName]§! are used by our population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§!, willing or not.§!"

lv_pop_events.7.name: "Controlled Parasitic Breeding"
lv_pop_events.7.desc: "§LOur population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! impregnates females of §B[Root.GetName]§! with their parasitic offspring, causing moderate growth of their species numbers while keeping a number of hosts under control.§!"
lv_pop_events.7.a: "Breed those who want it."
lv_pop_events.7.b: "The better species deserves their females."
lv_pop_events.7.c: "Use convicts as breeding sluts."
lv_pop_events.7.d: "Allow some breaches in controlling procedures."
lv_pop_events.7.e: "Increase breeding control effectiveness"

lv_pop_events.8.name: "Controlled Invasive Breeding"
lv_pop_events.8.desc: "§LAfter some time, our population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! has impregnated enough females of §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§! to cause a moderate change in the demographics on §B[Root.GetName]§.§!"
lv_pop_events.8.a: "Lets try to not exterminate them."
lv_pop_events.8.b: "Well, if they want to be bred by us..."
lv_pop_events.8.c: "Use convicts for forced impregnations."
lv_pop_events.8.d: "Allow breaches in control procedures."
lv_pop_events.8.e: "Increase breeding control effectiveness"

lv_pop_events.9.name: "Our Citizens Violated"
lv_pop_events.9.desc: "§LConcerning reports come from the planetary governor of §B[Root.GetName]§!. The local population of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! is using our xeno citizenry as a means to incubate their own children, which often results in the loss of fertility or even death for the mother of the alien child. This causes a notable shift in the population, increasing numbers of §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§! and decreasing numbers of §Y[lv_aggressively_sexed_pop.GetSpeciesNamePlural]§!§!"
lv_pop_events.9.a: "We can't do anything about it"
lv_pop_events.9.b: "It doesn't sound that bad..."
lv_pop_events.9.c: "Just let them do whatever they want"
lv_pop_events.9.d: "Increase the presence of law enforcers to keep situation under control"

lv_pop_events.10.name: "Sexual Conquest"
lv_pop_events.10.desc: "§LAs our population on the planet of §B[Root.GetName]§! continues being used as breeding sluts by §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§!, our numbers have decreased to the point of no return. Remnants of our race still try to resist the sexual conquest of the §Y[lv_aggressively_sexing_pop.GetSpeciesNamePlural]§!, but they are doomed without our help.§!"
lv_pop_events.10.a: "We can not help them."
lv_pop_events.10.b: "This is terrifying!"
lv_pop_events.10.c: "There is something hot about it..."
lv_pop_events.10.d: "Institute Martial Law and imprison the perpetrators!"

lv_pop_events.11.name: "Need for Breeding"
lv_pop_events.11.desc: "§LOur species used to live in a world where many sapient races coexisted. Due to some odd mutations, our ancestors evolved in a way that allowed us to breed with anything that possesses at least a somewhat similar reproductive system to ours. Members of our species had many ways to attract willing females of other races and enough strength to fuck unwilling ones against their will. However, while it was a blessing for our race, preventing wars between ourselves, it also had a downside - we always had to have someone who would satisfy our sexual needs. And since the resulting offspring always belonged to our race, we reduced the numbers of other races over time to the point where they were no longer able to resist our advances. Those left were used as living sex toys until they went completely extinct. This caused mass unrest by sexually frustrated civilians and made our authorities invest in the space program, hoping to find aliens for further use.§!"
lv_pop_events.11.a: "We shall find some females to breed among the stars!"
lv_pop_events.11.b: "We shall find some breeding sluts to rape among the stars!"

