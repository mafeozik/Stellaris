lv_lewd_planets_1.1.c.tooltip: "§LDownload her databanks and disassemble the body.§!"

# Lost Sexbot Part 2
lv_lewd_planets_1.2.name: "Waking Her Up"
lv_lewd_planets_1.2.desc: "§LYou watch as a team of your most talented engineers, overseen by §E[lv_sexbot_finder.GetName]§!, finishes the repairs on the lost sexbot. You knew she was supposed to be weirdly attractive, but what you've found in the labs far exceeded your expectations. As expected of a §M[Root.GetRulerTitle]§!, you keep your composure and do not let your gaze wander too long over her luscious curves. You ostentatiously ignore the inviting holes between her legs and do your best not to think about the offhand remark scrambled on the side of one of the reports, that label the odd droid to be fully compatible with [Root.Owner.GetSpeciesName] physiology.\n\nSuddenly, her eyes snap open. §B[lv_sexbot_finder.GetName]§! reassures you she's perfectly harmless, but a pair of soldiers by your side still point their rifles at her, just in case.§!"
lv_lewd_planets_1.2.a: "What are you?"

# Lost Sexbot Part 3
lv_lewd_planets_1.3.name: "The Service Bot"
lv_lewd_planets_1.3.desc: "§LThe droid rises to her feet, her movements slow and sensual. Acting like she didn't just spend centuries floating across space in stasis, she looks around the room, analysing her surroundings. Until her eyes find you. 'Hello.' her voice is husky, melodic. Perfect for the bedroom. 'I am Unit 2946-S, your ultimate companion. I can keep a conversation with 27 known species. My orifices have been optimized to provide exquisite pleasure to 42 known species. Using my hands, I know how to satisfy an additional 69 known species.§!"

lv_lewd_planets_1.4.name: "The Service Bot"
lv_lewd_planets_1.4.desc: "§LAre you my new master? Do you want me to run the §EFirst Encounter§! subroutine?'\n\nYou look at the surrounding scientists. They all make non-committal gestures, too embarrassed to respond. They did say she is perfectly safe…§!"
lv_lewd_planets_1.4.a: "Ah, the perks of being §H[Root.GetRulerTitle]§!!"
lv_lewd_planets_1.4.a.tooltip: "§LOrder her to your quarters… Discreetly.§!"
lv_lewd_planets_1.4.b: "How perverse… but also fascinating…"
