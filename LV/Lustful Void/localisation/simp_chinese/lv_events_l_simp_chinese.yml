lv_lewd_planets_1_category: "Weak Signal"
lv_lewd_planets_1_category_desc: "§LOur scanners have detected a capsule sailing through space, locked in a stable orbit around §Y[From.GetName]§!. Only a few meters in size, our scientists believe it to be some sort of escape pod.§!"

# Lost Sexbot Part 1
lv_lewd_planets_1.1.name: "Lost Sexbot"
lv_lewd_planets_1.1.desc: "§LEven though the capsule looked like an escape pod, it turns out to be something akin to a cargo container, with rather peculiar content. Inside of it, §E[Root.GetLeaderName]§! found what can only be described as a female sexbot. Humanoid in shape, though well endowed around the chest and backside, this robotic servant is in remarkably good condition despite being several hundred years old. With the main core intact, §E[Root.GetLeaderName]§! believes we might be able to reactivate her with the technology available back on our homeworld.§!"
lv_lewd_planets_1.1.a: "Well, what are you waiting for?"
lv_lewd_planets_1.1.a.tooltip: "§LBring her to our homeworld and activate her!§!"
lv_lewd_planets_1.1.b: "How obscene… but I am curious."
lv_lewd_planets_1.1.b.tooltip: "§LBring her to our homeworld and activate her.§!"
