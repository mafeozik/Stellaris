lv_country_events.2.name: "Interstellar Exchange"
lv_country_events.2.desc: "§LIt has come to our attention that several businesses have begun to cater to xenos. What should we do?§!"
lv_country_events.2.a: "Tax them like any other business."		
lv_country_events.2.b: "Xeno businesspeople?! Awesome! Let's tax the businesses." 
lv_country_events.2.c: "Disgusting! Tear these businesses down and sell their assets!"
lv_country_events.2.d: "Execute everyone involved. We stand together or not at all."
lv_country_events.2.e: "Another investment opportunity!"

lv_country_events.3.name: "Robot Rapists"
lv_country_events.3.desc: "§LThe governors of several of our cities have reported a disturbing trend. Young women have been assaulted by various types of robots. Some of these robots were simple humanoid and smaller pet-sized models, but several of the involved droids were large industrial models. Needless to say, this is a matter of great concern. We believe these attacks are not linked in any way and are simply a random collection of faulty programming, hackers, and the rare case of emergent AI.§!"
lv_country_events.3.a: "Investigate the matter and have our PR team tackle the issue."
lv_country_events.3.b: "Let's learn what we can from these attacks."
lv_country_events.3.c: "These machines are a plague on our society!"
lv_country_events.3.d: "We'll get all those behind these attacks."

# Military Gangbang
lv_country_events.4.name: "Unit Recreational Parties"
lv_country_events.4.desc: "§LThese so-called 'unit recreational parties' have become fairly commonplace in our armed forces. Each platoon, ship, or airwing has its own version but in general, these parties are where a group of higher ranks have forced group sex with one or more recruits. Some of our military leaders claim this is simply a way of venting for the troops, although others warn this could cause discipline issues later on.§!"
lv_country_events.4.a: "That's life in the military for you."
lv_country_events.4.b: "Find a few officers involved and make an example of them."
lv_country_events.4.c: "Wars and armies are the root of all evil."
lv_country_events.4.d: "Our troops offer their bodies to their country and leaders."
lv_country_events.4.e: "Soldiers should not be treating their comrades like a piece of meat."
lv_country_events.4.f: "Let's study this fascinating bit of military culture!"

lv_country_events.5.name: "War Prisoner Rapists Punished"
lv_country_events.5.desc: "§LWe expect better from our soldiers. Those who were behind the rape of captured soldiers or civilians have been punished accordingly. We didn't stop there. Those who know of these terrible deeds and did nothing have also been punished accordingly. We know that, in time, this will become a problem again, but for the forseeable future our soldiers will be very well behaved.§!"
lv_country_events.5.a: "Good"
lv_country_events.5.b: "We expect the best from our troops."
lv_country_events.5.c: "We are better than this."

lv_country_events.6.name: "Festival of Love"
lv_country_events.6.desc: "§LA large portion of our citizens has begun participating in what they call a 'Festival of Love'. There seem to be many different definitions of what the 'Festival of Love' actually is, but as far as we can ascertain it involves large groups of people indulging in sexual intercourse throughout the day and generally being kind to each other.§!"
lv_country_events.6.a: "Whatever makes them happy."
lv_country_events.6.b: "A true festival of love!"
lv_country_events.6.c: "This a great opportunity to invest in the contraception market!"
lv_country_events.6.d: "Unacceptable! Ban this festival immediately!"
lv_country_events.6.e: "We do not support this type of festival."

lv_country_events.7.name: "Futa Rising"
lv_country_events.7.desc: "§LThe ability to alter our genes is causing ripples in society itself. 'Futas', females with male genitalia, are now beginning to crop up in our society. Only time will tell what the longterm effects of this will be.§!"
lv_country_events.7.a: "People are weird."
lv_country_events.7.b: "This will only spread our love further."
lv_country_events.7.c: "Strange, but very interesting."
lv_country_events.7.d: "We must stand united against these vile changes."
lv_country_events.7.e: "Equality at last!"
lv_country_events.7.f: "This is illegal genetic modification! Ban the practice."
lv_country_events.7.g: "We do not allow this kind of genetic modification."

lv_country_events.8.name: "Science Gone Wrong"
lv_country_events.8.desc: "§LSomething has gone horribly wrong at one of our top secret science facilities. Several of the facilities containment systems failed, allowing the entities being experimented on to break out. Many of the scientists were killed while others were used to meet the entities' sexual needs. Repeatedly. The good news is we did learn something from this event. Unfortunately, it appears that some of the entities escaped into the surrounding areas, so this may cause more issues for us later on.§!"
lv_country_events.8.a: "Could have been worse."
lv_country_events.8.b: "This makes us look bad."
lv_country_events.8.c: "We will learn what we can from this."

lv_country_events.9.name: "Illegal Sex Robots"
lv_country_events.9.desc: "§LDue to a police investigation concerning some stolen robotic parts, multiple non-registered robots were found inside an abandoned warehouse. Upon their arrival, officers were assaulted by what they described as 'sexually obsessed' robots.\n\nFortunately, apart from some officers reported to be inexplicably tired after the intervention, our police forces managed to deactivate them without any major incident. After  a thourough investigation, these sexbots seem to have been heavily modified to resemble humanoid females. They are also reprogrammed to be attracted to phallic shapes and to provide sexual pleasure to their owners.\n\nHowever, we have yet to discover who is responsible for the creation of these robots.§!"
lv_country_events.9.a: "Register the modified robots and let them integrate into our society."
lv_country_events.9.b: "Remove the modifications and reprogram them to our standards."
lv_country_events.9.c: "Dismantle the robots and recover the stolen parts."
lv_country_events.9.d: "Fascinating! We should attempt to reverse engineer one of them."
lv_country_events.9.e: "Unacceptable! Eradicate these robotic abominations!"
lv_country_events.9.f: "It seems we had dismantled a robotic prostitution network!"

lv_country_events.11.name: "Xeno Clients"
lv_country_events.11.desc: "§LThe prostitutes of our country have found an open market in §Y[event_target:lv_neighbour_target.GetName]§! and have been taking full advantage of it. There has been a mix of tourists from §Y[event_target:lv_neighbour_target.GetName]§! employing our prostitutes while on our worlds. Regardless of where exactly the business has been occurring, one thing is clear: we've seen an increase in tax revenue!§!"
lv_country_events.11.a: "Good."
lv_country_events.11.b: "Great!"
lv_country_events.11.c: "This ends now."
lv_country_events.11.d: "Naturally, those of lower upbringing would engage in these acts."
lv_country_events.11.e: "This is exactly why we use our slaves for prostitution."

lv_country_events.12.name: "Money Can Buy Happiness"
lv_country_events.12.desc: "§LRecently we have seen an influx of prostitutes from §Y[event_target:neighbour_target.GetName]§! plying their trade in our cities. This increase in the number of workers in the sex industry has increased the happiness of the general populace but is resulting in some of our wealth being siphoned off to §Y[event_target:neighbor_target.GetName]§!§!."
lv_country_events.12.a: "Good."
lv_country_events.12.b: "Crack down on this illegal act!"

