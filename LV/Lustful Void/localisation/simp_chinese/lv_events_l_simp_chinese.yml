lv_fleet_events.1.name: "Sadistic Celebration"
lv_fleet_events.1.desc: "§LDuring [officer.GetHerHis] most recent victorious engagement with the enemy, Admiral [officer.GetName] managed to capture the enemy's commanding officer. The hours of physical, mental, and sexual abuse the sadistic [officer.GetName] is likely to inflict on [officer.GetHerHis] new 'toy' will have them wishing they had never enlisted in the military.§!"
lv_fleet_events.1.a: "This is the nature of war."
lv_fleet_events.1.b: "Naturally the strong dominate the weak."
lv_fleet_events.1.c: "[officer.GetShehe] has earned this reward."
lv_fleet_events.1.d: "How horrifying!"

