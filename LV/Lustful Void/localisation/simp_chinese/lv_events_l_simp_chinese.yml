lv_relic_events.11.name: "Ritual of the Golden Rod"
lv_relic_events.11.desc: "§LWe have prepared the '§YGolden Rod§!' for the ritual and must now decide what to do with it.\n\nWill we allow one of our leaders to impale themselves on the rod? Or should we make it publicly available for a limited time on a planet, allowing everyone to use it?§!"
lv_relic_events.11.a.name: "Allow one of our leaders to get impaled."
lv_relic_events.11.a.tooltip: "A random leader will get the §EEquine Penis§! trait."
lv_relic_events.11.b.name: "Prepare the '§YGolden Rod§!' for shipment to a planet."
lv_relic_events.11.b.tooltip: "Enables a decision on a single planet to transform all pops. When finished, all pops on that planet will get the §EEquine Penis§! trait."

lv_relic_events.21.name: "A Promising Offer"
lv_relic_events.21.desc: "§LBonnie, the scientist involved in the 'temple incident' during one of our latest excavations, has become quite the celebrity. Many people are fascinated by what happened to her and give her very 'personal' visits.\n\nWe can't ignore the scientific aspect of this. Many in the scientific community would like to know more about what happened to her and how it works. An increasing number of people agree that she should be given a position as a head scientist so she can work closely with others to find out more about this mystery and how the '§YGolden Rod§!' works.\n\nAnother smaller group of scientists heavily disagrees. They label all of this as a great mistake and would rather forget the incident rather than indulge in any more 'degeneracy'.§!"
lv_relic_events.21.a: "Of course. Give her a position immediately!"
lv_relic_events.21.a.tooltip: "§LReceive Bonnie, a level 5 Scientist.§!"
lv_relic_events.21.b: "This degeneracy has to end now."

lv_relic_events.22.name: "The temple is open!"
lv_relic_events.22.desc: "§LAfter minor restorations and cleaning up, the Temple of the §YGolden Rod§! has finally been opened to the public. Scientists from across the empire are eager to study it, while the general population seems fascinated with the transformation the archaeologist underwent during the discovery of it.\n\nWe should expect to see an increased output in research and tourism from this location!§!"
lv_relic_events.22.a: "Excellent!"
lv_relic_events.22.a.tooltip: "Soon, all §H$job_lv_rod_temple_initiate_plural$§! on the planet will go through the ceremony and grow a §EEquine Penis§!!\n\nThe ceremony will take place every §B5 Years§!."

