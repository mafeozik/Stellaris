# Decision Events #
###################

lv_mono_gender_conversion_mm.desc: "§LChoose which gender you want to turn this planet's population into. These will take you to sub-menus where you get a few more options.\n\nNote that you will get a gas refund if you decide that you don't want to do it anymore!§!"

lv_mono_gender_conversion_mm.1: "Female Submenu"
lv_mono_gender_conversion_mm.2: "Male Submenu"
lv_mono_gender_conversion_mm.3: "Futa Submenu"

lv_mono_gender_conversion_fsm.desc: "§LThis is the female sub-menu!\n\nFor now you can either convert the whole planet or just xenos (as in not including your main species). This will cause some serious stability issues for a few years...\n\nMore options might be added as the mod grows.§!"

lv_mono_gender_conversion_fsm.1: "Convert All"
lv_mono_gender_conversion_fsm.1.tooltip: "§LTransform all pops into females!\n\n§RWARNING!§! This will remove the §HAll Male§! and §HFutanari§! traits, including any male-specific traits.§!"
lv_mono_gender_conversion_fsm.2: "Convert Xenos Only"
lv_mono_gender_conversion_fsm.2.tooltip: "§LTransform only xeno pops into females!\n\n§RWARNING!§! This will remove the §HAll Male§! and §HFutanari§! traits, including any male-specific traits.§!"

lv_mono_gender_conversion_msm.desc: "§LThis is the male sub-menu!\n\nFor now you can either convert the whole planet or just xenos (as in not including your main species). This will cause some serious stability issues for a few years...\n\nMore options might be added as the mod grows.§!"

lv_mono_gender_conversion_msm.1: "Convert All"
lv_mono_gender_conversion_msm.1.tooltip: "§LTransform all pops into males!\n\n§RWARNING!§! This will remove the §HAll Female§! and §HFutanari§! traits, including any female-specific traits.§!"
lv_mono_gender_conversion_msm.2: "Convert Xenos Only"
lv_mono_gender_conversion_msm.2.tooltip: "§LTransform only xeno pops into males!\n\n§RWARNING!§! This will remove the §HAll Female§! and §HFutanari§! traits, including any female-specific traits.§!"

lv_mono_gender_conversion_fusm.desc: "§LThis is the futanari sub-menu!\n\nFor now you can either convert the whole planet or just xenos (as in not including your main species). This will cause some serious stability issues for a few years...\n\nMore options might be added as the mod grows.§!"

lv_mono_gender_conversion_fusm.1: "Convert All"
lv_mono_gender_conversion_fusm.1.tooltip: "§LTransform all pops into futanari!\n\n§RWARNING!§! This will remove the §HAll Female§! and §HAll Male§! traits.§!"
lv_mono_gender_conversion_fusm.2: "Convert Xenos Only"
lv_mono_gender_conversion_fusm.2.tooltip: "§LTransform only xeno pops into futanari!\n\n§RWARNING!§! This will remove the §HAll Female§! and §HAll Male§! traits.§!"

lv_mono_gender_conversion_fsm_ca.desc: "§LAll pops have been transformed into females...whether they like it or not.§!"
lv_mono_gender_conversion_fsm_ca.1: "Good!"

lv_mono_gender_conversion_fsm_cxo.desc: "§LAll xeno pops have been transformed into females...whether they like it or not.§!"
lv_mono_gender_conversion_fsm_cxo.1: "Good!"

lv_mono_gender_conversion_msm_ca.desc: "§LAll pops have been transformed into males...whether they like it or not.§!"
lv_mono_gender_conversion_msm_ca.1: "Good!"

lv_mono_gender_conversion_msm_cxo.desc: "§LAll xeno pops have been transformed into males...whether they like it or not.§!"
lv_mono_gender_conversion_msm_cxo.1: "Good!"

lv_mono_gender_conversion_fusm_ca.desc: "§LAll pops have been transformed into futanari...whether they like it or not.§!"
lv_mono_gender_conversion_fusm_ca.1: "Good!"

lv_mono_gender_conversion_fusm_cxo.desc: "§LAll xeno pops have been transformed into futanari...whether they like it or not.§!"
lv_mono_gender_conversion_fusm_cxo.1: "Good!"

