LV_RAUNCHY_TITANIC_LIFE_REMOVAL_MEAN: "Titanic Life Harvesting"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_MEAN_DESC: "By containing and using them as livestock, we can prevent the titanic lifeforms on [Root.GetName] from attempting to mate with our citizens."

LV_RAUNCHY_TITANIC_LIFE_REMOVAL: "Titanic Life Isolation"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_DESC: "By isolating them in preserves we can prevent the titanic lifeforms on [Root.GetName] from attempting to mate with our citizens."

LV_RAUNCHY_TITANIC_LIFE_REMOVAL_NICE: "Titanic Life Preservation"
LV_RAUNCHY_TITANIC_LIFE_REMOVAL_NICE_DESC: "By enacting new laws limiting intercourse with them we can preserve the titanic lifeforms on [Root.GetName]."

LV_RESCUE_CAPTURED_CREW_MEMBERS: "Rescue The Captured Women"
LV_RESCUE_CAPTURED_CREW_MEMBERS_DESC: "We have formulated a plan to rescue our kidnapped crewmembers, and are ready to begin as soon as possible."

lv_hidden_flesh_pit.3.name: "Tentacle Pit Retrieval Success"
lv_hidden_flesh_pit.3.desc: "§LWe were successful in retrieving the women with minimum difficulty. However, we did do some damage to the lifeforms, and as such what we can learn from them is reduced as a result.§!"
lv_hidden_flesh_pit.4.name: "Tentacle Pit Retrieval Great Success"
lv_hidden_flesh_pit.4.desc: "§LOur plan to rescue our crewmembers was a great success! We received no resistance from the lifeforms and didn't have to use more violent methods to retrieve the women. Vast amounts of biological research can be gained from these passive yet lustful organisms.§!"
lv_hidden_flesh_pit.5.name: "Tentacle Pit Failure"
lv_hidden_flesh_pit.5.desc: "§LDespite our best efforts, we not only failed to rescue our initial crew but more have been captured. Visual feeds from our rescue team are still being received, and it shows the women being raped and used for breeding. Although no more rescue attempts are being considered, we are hopeful that with these video feeds something can still be gained from this utter failure.§!"

LV_EXTRACT_ROGUE_SEXY_SCIENTIST: "Extract Rogue Scientist"
LV_EXTRACT_ROGUE_SEXY_SCIENTIST_DESC: "One of our scientists has gone rogue and is being worshipped as a god by the natives on [From.GetName]. An operation must be launched to remove them - by force if necessary."

LV_EXTRACT_ENSLAVED_SCIENTISTS: "Extract the Enslaved Scientists"
LV_EXTRACT_ENSLAVED_SCIENTISTS_DESC: "Several of our scientists have been enslaved by the natives on [From.GetName]. An operation must be launched to rescue them before the natives successfully breed them."

LV_SEXY_MODIFICATION_PROJECT: "Sexy Modification"
LV_SEXY_MODIFICATION_PROJECT_DESC: "Through a combination of selective viruses, genetic engineering, and surgery we will modify the locals of [From.GetName] to better meet our standards of beauty."

