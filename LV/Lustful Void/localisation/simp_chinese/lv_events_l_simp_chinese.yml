#################
# Event Pop-ups #
#################

lv_event_popups.0: "Acknowledged."

# Brood Parasite #

lv_brood_parasite_inform.desc: "§LBrood Parasites have begun implanting their eggs in any orifice they can sexually penetrate on planet §E[Root.GetName]§!. The resulting new Brood Mothers are having mixed reactions to the sudden role change of egg incubators...§!"

lv_ep_brood_parasite.name.1: "Life finds a way."
lv_ep_brood_parasite.name.1.tooltip: "§LWhat may seem weird to us is a biological necessity to them.§!\n"
lv_ep_brood_parasite.name.2: "Defilement."
lv_ep_brood_parasite.name.2.tooltip: "§LAn absolutely disgusting form of reproduction.§!\n"
lv_ep_brood_parasite.name.3: "As it should be."
lv_ep_brood_parasite.name.3.tooltip: "§LWhat may seem weird to others is a biological necessity for us.§!\n"

# Biomechanical Breeder #

lv_biomechanical_breeder_inform.desc: "§LBiomechanical breeding has commenced between the biological and robotic population on planet §E[Root.GetName]§!. Impregnated females may experience some discomfort during this process.§!"

lv_ep_biomechanical_breeder.name.1: "Good."
lv_ep_biomechanical_breeder.name.1.tooltip: "§LThe next generation is assured.§!\n"
lv_ep_biomechanical_breeder.name.2: "Blasphemous."
lv_ep_biomechanical_breeder.name.2.tooltip: "§LSuch an unnatural conception throws into question the integrity of the child's very soul.§!\n"
lv_ep_biomechanical_breeder.name.3: "Reproductive protocols initiated."
lv_ep_biomechanical_breeder.name.3.tooltip: "§LMaternity units seeded. Now adjusting work loads.§!\n"

# Mono Gender #

lv_mono_gender_inform.desc: "§LA mono-gendered species on planet §E[Root.GetName]§! have been sexually active with another species, gender or even robotic units. Interbreeding between them is becoming increasingly common.§!"

lv_ep_mono_gender.name.1: "The miracle of life."
lv_ep_mono_gender.name.1.tooltip: "§LThat species from such different places can meet as a family is a testament to life's beauty.§!\n"
lv_ep_mono_gender.name.2: "Disgusting species mixers."
lv_ep_mono_gender.name.2.tooltip: "§LThe longer we permit this, the more normalized it will become.§!\n"

# Dom/Sub #

lv_dom_sub_inform.desc: "§LSexual unions between a notoriously domineering species and an unusually submissive species on planet §E[Root.GetName]§! have become common. While these relationships are highly one-sided, both species seem to be willing participants in this arrangement.§!"

lv_ep_dom_sub.name.1: "Useful."
lv_ep_dom_sub.name.1.tooltip: "§LThis should keep them calm and productive, respectively.§!\n"
lv_ep_dom_sub.name.2: "We must keep an eye on this."
lv_ep_dom_sub.name.2.tooltip: "§LThose who are comfortable in their oppression are the most vulnerable of all.§!\n"
lv_ep_dom_sub.name.3: "As it should be."
lv_ep_dom_sub.name.3.tooltip: "§LThose dependent on the weapon of another always live under their boot.§!\n"

# Sex Crazed #

lv_sex_crazed_inform.desc: "§LDue to the planet wide orgies on §B[Root.GetName]§!, some of our people have become broken addicts that need constant sexual stimulation to have some semblance of functionality.§!"

lv_ep_sex_crazed.name.1: "They know their place now."
lv_ep_sex_crazed.name.2: "They are free to do what they want."
lv_ep_sex_crazed.name.3: "Perhaps this frenzy can be used offensively!"

# All Female #

lv_all_female_inform.desc: "§LOver the past several years, females on the planet [Root.GetName] have opted to breed with males possessing intercompatible sperm due to their highly enticing nature, which has made it incredibly hard for males of other species to find mates. As another side effect, those with this sperm cause the females they breed with to give birth to either more females of that species or the young of the intercompatible males themselves. Now it has come to the point where these species have become exclusively female.§!"

lv_all_female.name.1: "Acknowledged."
lv_all_female.name.1.tooltip: "§LSome pops will now become exclusively female.§!"

# All Male #

lv_all_male_inform.desc: "§LOver the past several years, males on the planet [Root.GetName] have opted to breed with females possessing intercompatible wombs due to their highly enticing nature, which has made it incredibly hard for females of other species to find mates. As another side effect, those with these wombs only give birth to either more males of the species they breed with or the young of the intercompatible females themselves. Now it has come to the point where these species have become exclusively male.§!"

lv_all_male.name.1: "Acknowledged."
lv_all_male.name.1.tooltip: "§LSome pops will now become exclusively male.§!"

# Hybrids #

lv_perfect_bio_hybrid.desc: "§LA 'perfect' hybrid species have been born on §E[Root.GetName]§!!\n\nNot only do these new hybrids have what most would call physical perfection, but they also seem to display powerful psionic abilities. This combination essentially gives them mind control and could be a danger if we're not careful.§!"

lv_perfect_bio_hybrid.name.1: "We need to keep an eye on them."
lv_perfect_bio_hybrid.name.1.tooltip: "§LSome are already calling them gods. We need to make sure people understand there is no such thing.§!"
lv_perfect_bio_hybrid.name.2: "They really are perfect..."
lv_perfect_bio_hybrid.name.2.tooltip: "§LThese new beings must be divine in nature...how else could they display such power!§!"

# Milk Cow Specialization #

lv_no_milk_cow_specialization.desc: "§LWe can now specialize our milk cows. For now our milk cow policy is fine as is, we don't want to put too much strain on them... (default option)§!"
lv_maximize_milk_cow_production.desc: "§LBy constantly keeping our milk cows  stimulated and their breasts injected with a steady stream of lactation drugs, we can increase milk production even more!§!"
lv_free_use_cows.desc: "§LAllowing the public to have sex with any milk cows they want will placate them a bit.§!"
lv_milk_cow_renting.desc: "§LBy renting out the bodies of our milk cows, we can make quite a bit of extra credits.§!"
lv_milk_cow_breeding.desc: "§LFocusing on using our milk cows as breeders will help substantially with colonization or re-population efforts!§!"

# Buildings #

lv_pop_stealing_notify.desc: "§LOur operations on the foreign world §R[lv_abduction_planet.GetName]§! have paid off! A large number of their people have been acquired without drawing too much attention. They have been moved to §E[lv_relocated_planet.GetName]§!.§!"
lv_pop_stolen_notify.desc: "§LForeign operations on §R[lv_abduction_planet.GetName]§! have abducted a large number of our people! They have been moved to §E[lv_relocated_planet.GetName]§! as far as we know.§!"

