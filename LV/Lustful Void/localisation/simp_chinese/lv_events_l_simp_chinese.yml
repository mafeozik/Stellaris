lv_neuter_purge_event.1.name: "Undesirables with Benefits"
lv_neuter_purge_event.1.desc: "§LOur policy of neutering the [PREV.FROMFROM.GetName] people have come with some unintended, but very desirable consequences. For whatever reason, whether they wished to leave behind some kind of offspring or were hoping to obtain favours from our loyal citizens, many of the [PREV.FROMFROM.GetName] not only had intercourse with our citizens but also offered to bare their offspring.§!"
lv_neuter_purge_event.1.a: "I almost feel bad that they are now gone."

lv_neuter_purge_event.2.name: "Baby Ovens"
lv_neuter_purge_event.2.desc: "§LThrough the use of hormones, gene therapy, powerful aphrodisiacs, artificial insemination, and a strict regiment of compulsory intercourse with loyal citizens, we have managed to turn a large number of undesirables on [PREV.THIS.GetName] into 'baby ovens', baring the young not of their own species, but those of loyal citizen species.§!" 
