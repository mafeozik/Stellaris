lv_leader_events.101.name: "Pleasure Suit Addiction"
lv_leader_events.101.desc: "§L§E[event_target:lv_suit_slut.GetName]§! has become hopelessly addicted to the joys of wearing a pleasure suit and can no longer live without it. Their constant state of arousal has begun to affect their abilities.§!"
