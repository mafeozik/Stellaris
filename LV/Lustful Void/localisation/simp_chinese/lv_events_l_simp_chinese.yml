#########################
###     Anomalies     ###
#########################

lv_lewd_asteroids_1_category: "Interesting Asteroid"
lv_lewd_asteroids_1_category_desc: "§LSensors have picked up unusual readings on the nearby asteroid designated [From.GetName].§!"

lv_lewd_asteroids_1.1.name: "The Mad Scientist's Tentacled Creation"
lv_lewd_asteroids_1.1.desc: "§LUpon further investigation, the [Root.GetName] detected a small and what looks like an abandoned facility built into [From.GetName]. A survey team is dispatched to investigate. At first, the team reports that the facility seems to hold some promise for good salvage and does indeed look deserted, but suddenly the facility's hidden defences spring to life and incapacitate the team, cutting communications in the process.§!"

lv_lewd_asteroids_1.2.name: "The Mad Scientist's Tentacled Creation"
lv_lewd_asteroids_1.2.desc: "§LA second, better-armed team is sent in to rescue the first. It takes them some time, but eventually, the first team is located in the depths of a functioning laboratory. The facility's sole occupant has decided that our people would make excellent test subjects for some sort of tentacled creation that's eagerly in the process of raping the captured crew members.§!"
lv_lewd_asteroids_1.2.a: "Those poor people."
lv_lewd_asteroids_1.2.b: "We will learn much from their sacrifice."
lv_lewd_asteroids_1.2.c: "Let's learn what we can to make this worthwhile."
lv_lewd_asteroids_1.2.d: "The creation of life is a sacred duty!"
lv_lewd_asteroids_1.2.e: "Our people ARE NOT your test subjects!"

lv_lewd_asteroids_2_category: "Interesting Asteroid"
lv_lewd_asteroids_2_category_desc: "§LSensors have picked up unusual readings on the nearby asteroid designated [From.GetName].§!"

lv_lewd_asteroids_2.1.name: "The Cyber Sex Rock"
lv_lewd_asteroids_2.1.desc: "§LOur survey team has located an immense unauthorized station disguised as an asteroid in orbit of [From.GetStarName]. Rather than the usual black market trades, this hub specializes in illicit sexual services and products such as exotic cybernetics, unethical body modifications and extremely potent aphrodisiacs that would fail even the laxest of societal standards and laws. We need to decide what to do with the facility and those within.§!"
lv_lewd_asteroids_2.1.a: "Another tax source."
lv_lewd_asteroids_2.1.b: "Another mineral source."
lv_lewd_asteroids_2.1.c: "Shut it down. Their assets are forfeit."
lv_lewd_asteroids_2.1.c.tooltip: "§LThe lead scientist seems willing to join us in exchange for sanctuary, however.§!"
lv_lewd_asteroids_2.1.d: "Shut it down, but we should take notes."
lv_lewd_asteroids_2.1.d.tooltip: "§LThese designs are quite... interesting. The lead scientist seems willing to join us in exchange for sanctuary, however.§!"
lv_lewd_asteroids_2.1.e: "Offer their creativity a safe haven, provided they follow our rules."
lv_lewd_asteroids_2.1.f: "This disrupts the natural order. Destroy it."

lv_slime_asteroid_category: "The Slime"
lv_slime_asteroid_category_desc: "§LThe crew of §B[Root.GetFleetName]§! has reported catching sight of some slime-like entity on a nearby asteroid. §G[Root.GetLeaderName]§! has recommended we collect a sample for further research.§!"
 
lv_slime_asteroid.1.name: "Raunchy Slime"
lv_slime_asteroid.1.desc: "§LThe slime entity was easily located and brought aboard the §B[Root.GetFleetName]§!. §G[Root.GetLeaderName]§! wasn't sure if it was even alive or not until it broke free and attempted to mate with a nearby scientist.§!"
lv_slime_asteroid.1.a: "We can use their photosynthesizing nature to our advantage."
lv_slime_asteroid.1.b: "Their biology and behaviour are truly fascinating."
lv_slime_asteroid.1.c: "Perhaps our engineers can find a use for them."

lv_hidden_flesh_pit_category: "Interesting Thermal Readings"
lv_hidden_flesh_pit_category_desc: "§LThe sensors of the §B[Root.GetFleetName]§! have picked up an unusual heat spot on the nearby asteroid.§!"
 
lv_hidden_flesh_pit.1.name: "Hidden Pit Of Tentacles Uncovered"
lv_hidden_flesh_pit.1.desc: "§LAfter a more focused scan of the asteroid by the §B[Root.GetFleetName]§!, the location of the heat spot was found. We sent down a team to study the anomaly but lost contact soon after. When comms were re-established, the expedition had lost several of their members to unknown lifeforms, reportedly only hearing the echoes of wet squelching and lustful moans as they fled. We believe these creatures to be the source of heat we detected.§!"
lv_hidden_flesh_pit.1.a: "We must save them, whatever the cost!"
lv_hidden_flesh_pit.1.b: "Let's study these creatures for the good of our civilization."
lv_hidden_flesh_pit.1.c: "How do these creatures survive in the vacuum space? We must know!"
lv_hidden_flesh_pit.1.d: "These lustful creatures must be purged in holy fire!"
lv_hidden_flesh_pit.1.e: "The loss of a few drones is insignificant."
 
lv_hidden_flesh_pit.2.name: "Unknown Micro Biosphere Uncovered"
lv_hidden_flesh_pit.2.desc: "§LTaking a closer look at the hot spot led to an incredible discovery! What seems like a micro biosphere flourishes in the cracks of the asteroid. A team was dispatched for a closer look and while studying the environment, a crew member decided to remove their protective gear, seeming to be in some kind of trance. They were immediately set upon by the organisms living there and after some panic and a little awkward study, the organisms seem to thankfully be symbionts, pampering the enthralled scientist while breeding them very thoroughly.§!"
lv_hidden_flesh_pit.2.a: "Let's make this asteroid a tourist destination for relaxation."
lv_hidden_flesh_pit.2.b: "Build a dedicated research station to study the biosphere!"
lv_hidden_flesh_pit.2.c: "The deviancy of this biosphere cannot be tolerated"
lv_hidden_flesh_pit.2.d: "The hive will benefit much from this."

lv_sexy_planet_category: "The Odd Lifeform"
lv_sexy_planet_category_desc: "§LThe crew has detected some kind of strange lifeform on §Y[From.GetName]§!.§!"
 
lv_sexy_planet.1.name: "In Heat"
lv_sexy_planet.1.desc: "§LAll search efforts for the lifeform proved fruitless. Even sending survey ships to physically search §Y[From.GetName]§! failed to obtain any results.\n\nIt seems that it was unnecessary for us to search so hard, however, as one of our pilots discovered the lifeform in their survey ship as they returned from the planet's surface.§!"
lv_sexy_planet.1.a: "Disturbing yet fascinating."

lv_sexy_planet.2.name: "The Swarm"
lv_sexy_planet.2.desc: "§LUpon touching down on the surface of §Y[From.GetName]§! our survey team was immediately beset upon by a creature with an insatiable sex drive. Command could do little more than watch as the creature stripped the clothes of the crew members and penetrated all of their holes with its tentacles, not letting them go until it had fully filled them with its seed.§!"
lv_sexy_planet.2.a: "Disturbing, yet fascinating."
lv_sexy_planet.2.b: "These vile creatures will make good test subjects for our latest weapons."
lv_sexy_planet.2.c: "The crew clearly enjoyed the experience."

lv_potential_colony_site_category: "Potential Colony Site"
lv_potential_colony_site_category_desc: "§L[Root.GetLeaderName] claims to find a site on §Y[From.GetName]§! that would be perfect for a new colony.§!"

lv_sexy_planet.3.name: "Tentacled Lifeforms Abound"
lv_sexy_planet.3.desc: "§LAt first the site on §Y[From.GetName]§! did indeed seem perfect. The survey team was in the process of determining the best spot for a future administrative building when one of the team's members was suddenly pulled into a hole in the ground. They cried out as tendril-like appendages wrapped themselves around them and forced their way inside any orifice big enough to penetrate. §G[Root.GetLeaderName]§! informs us that the planet is home to numerous other 'tentacle lifeforms'.§!"
lv_sexy_planet.3.a: "Besides that, it's still a good site for a colony, right?"
lv_sexy_planet.3.b: "Gather as much data as we can about these fascinating lifeforms."
lv_sexy_planet.3.c: "Eradicate it! We won't tolerate the presence of these creatures."

lv_sexy_planet_hard_category: "Something Lurks Here"
lv_sexy_planet_hard_category_desc: "§LThe crew believes it may have detected signs of a strange lifeform on §Y[From.GetName]§!, but whatever it is it has proven itself to be immensely hard to track.§!"
 
lv_sexy_planet_hard.1.name: "The Xeno Terror"
lv_sexy_planet_hard.1.desc: "§LThe crew managed to find the lifeform. Well... perhaps it would be more accurate to say that it found them. §G[Root.GetLeaderName]§! still isn't sure what sort of creature this lifeform is, but they says with some confidence that it was bio-engineered. Whatever it is, the 'Xeno Terror' as the crew calls it, seems to have a strong sexual attraction to our species.§!"
lv_sexy_planet_hard.1.a: "Truly Horrifying"
lv_sexy_planet_hard.1.b: "This is why no one important is sent on these missions."
lv_sexy_planet_hard.1.c: "Nope! Nope! Nope!"
lv_sexy_planet_hard.1.d: "Learn what we can then nuke the site from orbit."

lv_nuclear_sex_category: "Life on a Ruined World"
lv_nuclear_sex_category_desc: "§LThe crew has detected lifeforms on the surface of §Y[From.GetName]§! despite the planet having been ruined by a nuclear conflict. Trying to find these lifeforms from orbit has proven frustrating at best, as the lifeforms are being shielded from our sensors by the various ruins on the planet's surface. §G[Root.GetLeaderName]§! has suggested sending a team to the surface to investigate further.§!"

lv_nuclear_sex.1.name: "Nuclear Sex"
lv_nuclear_sex.1.desc: "§LThe survey team hadn't been on the surface long before one of the lifeforms made contact with an isolated member of the team. Upon arriving at the scene, the other survey members found a torn-up hazard suit, which was covered in a slimy substance, but surprisingly no blood. It's clear that the lost member was taken alive, but other than faint moan-like echoes in the ruins, our team was unable to locate them. Eventually, the search had to be called off due to the dangerous environment and fear of also being taken.§!"
lv_nuclear_sex.1.a: "Let's keep quiet about this incident."
lv_nuclear_sex.1.b: "Make the recordings of the event public so we can learn as much as we can."
lv_nuclear_sex.1.c: "Our scientist suffered a tragic but unintended fate."

lv_slug_planet_category: "Slug Planet"
lv_slug_planet_category_desc: "§LAfter a few days scanning [from.GetName], [Root.GetFleetName] has detected some kind of lifeform that possesses an entirely different DNA structure than the rest of the lifeforms present. [Root.GetLeaderName] suggests sending a team down to the surface to investigate further.§!"
 
lv_slug_planet.1.name: "Slug Planet"
lv_slug_planet.1.desc: "§LThe detected lifeforms certainly did not belong to [from.GetName]'s ecosystem. From what our scientists could gather, the 'slugs' as they call them, were implanted on the planet centuries ago. Why? They can only speculate. What we know for sure is that they appear to really like our people in a sexual sense. While investigating the slugs, several of our scientists were dragged to the ground by the slugs, who then proceeded to rape them. Repeatedly. Thankfully the slugs made for gentle, if sticky, attackers.§!"
lv_slug_planet.1.a: "Interesting."

lv_bad_category: "The Odd Lifeform"
lv_bad_category_desc: "§LThe crew has detected some kind of strange lifeform on §Y[From.GetName]§!.§!"

lv_bad.1.name: "Pirate Abduction"
lv_bad.1.desc: "§LWhat we thought was a simple lifeform turned out to be a pirate. Fortunately, our science ship and most of our team were uninjured. However, several members of the crew were abducted. Despite our best efforts, we have been unable to track them and must conclude that they are being kept as slaves for the pirates, sold, or worse.§!"
lv_bad.1.a: "Well dammit."

lv_bad.2.name: "Slaver Attack"
lv_bad.2.desc: "§LAll was going well when we suddenly lost contact with §G[Root.GetLeaderName]§! and their crew. Attempts to re-establish contact proved fruitless and when we sent a rescue team all they found were the debris left behind by an attack. Several days later, we were informed of a widely distributed video showing the attack and abduction of the scientists. The video also showed ten hours of the 'training' of the scientists as they were taught all the skills they would need to have in their new lives as sex slaves.§!"
lv_bad.2.a: "Well dammit."

lv_bad.3.name: "Fun Outdoors"
lv_bad.3.desc: "§LAfter an exhaustive survey, the crew of §G[FROMFROM.GetFleetName]§! gave up their search. Many hurried to return to the ship, but some decided to take their time and enjoy the 'sights' and each other's bodies.§!"
lv_bad.3.a: "These things happen."

