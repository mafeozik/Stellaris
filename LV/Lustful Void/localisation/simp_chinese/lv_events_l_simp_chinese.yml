lv_leader_events.103.desc: "§L§E[event_target:lv_suit_slut.GetName]§! has managed to overcome their pleasure suit addiction, and can once again function normally, though their body will never truly forget the sensation.§!"

lv_leader_events.105.name: "Pleasure Suits Banned"
lv_leader_events.105.desc: "§LA momentous day! With the banning of addictive pleasure suits, all of our leaders have publicly given up their personal suits, which should keep them safe from the dangers of suit addiction, at least for now. Our population may take some time to adjust to the absence.§!"
