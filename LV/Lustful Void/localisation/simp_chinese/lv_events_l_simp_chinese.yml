###     Crime      ###
######################

lv_crime_events.1.name: "Disappearances"
lv_crime_events.1.desc: "§LThere have been reports of citizens going missing on §B[Root.GetName]§!. Though regularly missing persons are a standard occurrence in any society, there seems to be an increase as of late. Citizens have been going missing en masse and our law enforcement believes that there is a link to the rising crime rates. Until we can clamp down on these crime rates, it may be a long road until we can find these poor souls.§!"
lv_crime_events.1.a: "There is nothing we can do..."

lv_crime_events.2.name: "Enforcers Attacked!"
lv_crime_events.2.desc: "§LOn a regular patrol, a group of our law enforcement members were attacked and robbed on §B[Root.GetName]§!. The attack has shaken our people's faith in the government, and we need to find a way to get this under control before it gets out of hand.§!"
lv_crime_events.2.a: "Find these suspects at once!"

lv_crime_events.3.name: "Enforcer Patrol Raped!"
lv_crime_events.3.desc: "§LOur law enforcement members were ambushed again, but this time the attackers took more than their equipment. Members of the public just watched while our Enforcers were stripped and raped in public, and then left restrained with their own equipment. This show of force has massively shaken the people's faith in our rule.§!"
lv_crime_events.3.a: "We need to figure this out, quickly."

lv_crime_events.4.name: "Enforcer Headquarters Raided!"
lv_crime_events.4.desc: "§LIt appears that the criminals on §B[Root.GetName]§! weren't simply content making a mockery of our law enforcement. Early this morning, there was an attack on an Enforcer headquarters by these gang members. It was a planned and organized raid, only to happen when the staff was either gone or off duty and tired. After this successful attack, the gang members decided to rub it in by having a three day party in the headquarters. Media has been distributed starring these gang members in Enforcer uniforms raping and torturing our Enforcers in the headquarters jail, which has been emptied of criminals and filled with Enforcers that the gang members didn't take with them after their party.§!"
lv_crime_events.4.a: "There are no words..."

lv_crime_events.5.name: "Reappearance"
lv_crime_events.5.desc: "§LThe Enforcers that were taken from our headquarters on §B[Root.GetName]§! have reappeared, but not in the employ of the government. These harlots walk the street and enforce the law of the gang, not of the administration. Further, they wear fetishized uniforms and allow gang members to abuse and degrade them at a whim while terrorizing the locals. These trophies will be reclaimed in time and returned to their families, but for now, they are nothing but toys and tools for the criminals we try to fight.§!"
lv_crime_events.5.a: "Get them, quickly."

