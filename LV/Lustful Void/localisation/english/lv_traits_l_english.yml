trait_lv_futanari: "Futanari"
trait_lv_futanari_desc: "§LAs a survival strategy this species, rather than split into distinct gender categories has all the necessary equipment to self propagate. Outwardly they appear to have a female phenotype but posses a fully functioning set of male and female sexual organs.§!\n"
