trait_lv_erogenous_anus: "Erogenous Anus"
trait_lv_erogenous_anus_desc: "§LThe anal walls of this species have far more nerve endings than their sexual organs, so much so that that they view the vagina as a strictly reproductive organ. So sensitive are their rectums that erotic braille novels in the form of suppositories have become quite popular.§!\n"
