trait_lv_large_breasts: "Large Breasts"
trait_lv_large_breasts_desc: "§LThis species has the double D's to please. Mating preferences have resulted in this species having larger breasts than most other species and a notable increase in milk quantity and quality only seen in domestic animals.§!\n"
