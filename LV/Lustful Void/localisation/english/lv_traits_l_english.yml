trait_lv_fizzy_milk: "Fizzy Milk"
trait_lv_fizzy_milk_desc: "§LThe breasts of this species are home to many beneficial bacteria. These bacteria attack foreign invaders and even kill cancer cells. The side effects of their inhibition are permanently induced lactation and low levels of neutral gasses resulting in this species having slightly thicker and fizzing milk. As a result of built-up gasses, this species is also prone to random projectile lactation.§!\n"
