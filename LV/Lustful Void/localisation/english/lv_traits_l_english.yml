trait_lv_lewd_mind: "Lewd Mind"
trait_lv_lewd_mind_desc: "§LThis species has a stronger sex drive than most and can turn the most innocent of thoughts into something lewd and depraved. It is a serious distraction that can lead to accidents and unfinished work but mostly manifests as blankly staring into space or lewd slips of the tongue.§!\n"
