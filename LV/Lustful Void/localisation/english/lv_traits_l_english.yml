trait_lv_exotic_honey: "Exotic Honey"
trait_lv_exotic_honey_desc: "§LThis species has reactivated a recessive gene, and they now have a gland connected to their reproductive organs which have atrophied over generations. This gland now produces a unique and exotic type of honey that is released with each ejaculation. Containing trace amounts of valuable motes, it is thought that this was feed to select individuals in large quantities to produce some effect or change.§!\n"
trait_lv_exotic_honey_effect: "§LDelicious honey:§!\n§WFood from Jobs: §G+20%§!§!\n\n§LWax infrastructure:§!\n§WPop Housing Usage: §G-20%§!§!\n§WHabitability: §G+10%§!§!\n\n§WMilk Cow Output: §G+10%§!§!\n§WSex Jobs Output: §G+10%§!§!\n\n§BAdvanced trait:§!\n§WPops with this trait produce §YVolatile Motes§! when working LV jobs.§!\n"

trait_lv_oviposition: "Oviposition"
trait_lv_oviposition_desc: "§LAs an alternative, this species can reproduce by laying eggs. While usually fertilised while still inside, the method of incubation can vary wildly. Some incubate the egg for a predetermined amount of time while others might lay within days of intercourse. In some extreme cases, an egg can be incubated until it is roughly the size of a small child before laying.§!\n"
