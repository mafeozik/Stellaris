trait_lv_aphrodisiac_milk: "Aphrodisiac Milk"
trait_lv_aphrodisiac_milk_desc: "§LThis species has a natural but low level of lactation. As an essential part of their reproduction cycle, they have also evolved specialised glands in their mammaries as part of their mating ritual. When aroused, this gland will release a potent aphrodisiac into the breast milk, which is then fed to one or more sexual partners.§!\n"
