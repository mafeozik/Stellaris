trait_lv_sexually_inept: "Sexually Inept"
trait_lv_sexually_inept_desc: "§LFor this species, sex is a means to an end, and that end is the propagation of the race. Sexual liaisons are very business-like, often as formal as a handshake and just as brief. Any prolonged engagement usually requires an appointment and scheduling.§!\n"
trait_lv_sexually_inept_effect: "§LBusiness before pleasure:§!\n§WHappiness: §R-10%§!§!\n§WPop Growth Speed: §R-25%§!§!\n§WResources from Jobs: §G+10%§!§!\n\n§WSex Jobs Output: §R-50%§!§!\n"

trait_lv_sexually_repressed: "Sexually Repressed"
trait_lv_sexually_repressed_desc: "§LThis species has cultivated a much more restrained view and practice of sex than other species. While not exactly chaste, they can easily be offended by what they consider to be 'base and animal' behaviour.§!\n"
