trait_lv_sex_crazed: "Sex Crazed"
trait_lv_sex_crazed_desc: "§LThis species is sexually obsessed, spending most of their days fighting their impulses. Trying to focus does little to keep their unbridled libidos in check. Prone to spontaneous acts of shameless lust. It's a small miracle that they manage to hold down jobs or even remember to sleep when they aren't having sex with one but usually more partners.§!\n"
