trait_lv_seasonal_breeders: "Seasonal Breeders"
trait_lv_seasonal_breeders_desc: "§LThis species has matched their breeding cycle to match their planets seasonal changes for maximum productivity. While normally calm and diligent in there work for most of the year, they set aside time for unrestrained, libidinous orgies where they mate near constantly with reckless abandon before returning to their quiet lives.§!\n"
