trait_lv_excess_estrogen: "Excess Estrogen"
trait_lv_excess_estrogen_desc: "§LThis species produces an overabundance of estrogen. Attributes such as busts, hips, and so on have become extremely accentuated. Skin is silken smooth, breasts are large and supple, hips are broader, and thighs are thicc. Co-operative, social and more amicable, they appear as tame and submissive as house pets.§!\n"
